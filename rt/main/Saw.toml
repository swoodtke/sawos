[package]
name = "sosmain"
version = "0.1.0"

# The process half of the runtime: the `_start` of a program written with
# `main`, and the boot context `main` reads. A program opts in by depending on
# this package and importing it; a package that exports its own `_start`
# never depends on it. See src/lib.saw.
#
# No `runtime = true`: the image's own manifest declares it, because the
# image's compile is where the runtime's seams land (root/Saw.toml).
#
# `bootplan` names the console record's tag, `uartproto` the console's wire,
# and `sosrt` the line's piece, which the wire's payload must hold.
[dependencies]
sos = { path = "../../kernel/sysapi" }
sosrt = { path = "../common" }
bootplan = { path = "../../root/bootplan" }
uartproto = { path = "../../drivers/uartproto" }
