[package]
name = "sosrt"
version = "0.1.0"

# Arch-free and role-free: consumed by the kernel build and by every Saw process
# build alike. Primitives only, so it compiles freestanding for any target. See
# src/lib.saw.
#
# This package holds the `__saw_rt_*` seams but does not carry `runtime = true`
# itself. That key makes Blade pass `--runtime` to a compile, and this package
# is never compiled on its own: it rides into an image as a module. The
# declaration belongs to the thing being built: `root/Saw.toml` for a process
# image, the kernel build's compile for a kernel. Putting it here too would read
# like the source of truth while changing nothing.
