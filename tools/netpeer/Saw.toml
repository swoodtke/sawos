[package]
name = "netpeer"
version = "0.1.0"

# The gate's network peer: a hosted program that QEMU's `-netdev stream`
# connects to, and that answers the guest's frames as a script says (ARP, ICMP
# echo and the scripted behaviours of src/peer.saw). It has no dependency of
# its own: its frame code is written here, not taken from `netstack`, so a
# symmetric encoding mistake in the stack cannot pass against itself. See
# src/main.saw for its command.
