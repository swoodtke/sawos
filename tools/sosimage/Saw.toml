[package]
name = "sosimage"
version = "0.1.0"

# The image builder: a hosted program that compiles a kernel, stitches a root
# image and child images into it, writes the boot region table and links. See
# src/main.saw for its commands.
[dependencies]
# The sosimg layout the kernel loads, read here to hold a resident image to its
# flash slot. It lives in the sawlang checkout; `.sawlang` at the top of this
# tree is a link to the checkout the toolchain resolved, which the runner
# writes before it builds this package.
imgformat = { path = "../../.sawlang/libs/imgformat" }
# The typed TOML reader the hand-written descriptions (a board's, a process's
# and an image's) are read through, from the same checkout.
toml = { path = "../../.sawlang/libs/toml" }
# The types the stock root's plan is written in, for the rule a setup write
# follows, which the builder's tests hold to the part's words.
bootplan = { path = "../../root/bootplan" }
# The ESP32-S3's LDO settings from its eFuse, which the builder's tests hold to
# ESP-IDF's arithmetic.
s3dbias = { path = "../../hal/xtensa-esp32s3/dbias" }
