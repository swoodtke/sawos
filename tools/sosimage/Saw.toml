[package]
name = "sosimage"
version = "0.1.0"

# The image builder: a hosted program that compiles a kernel, stitches a root
# image and child images into it, writes the boot region table and links. See
# src/main.saw for its commands.
[dependencies]
# The sosimg layout the kernel loads, read here to hold a resident image to its
# flash slot. It lives in the sawlang checkout; `.sawlang` at the top of this
# tree is a link to the checkout the toolchain resolved, which the runner
# writes before it builds this package.
imgformat = { path = "../../.sawlang/libs/imgformat" }
