[package]
name = "child-echo-pl011"
version = "0.1.0"

# Same reason as sos/root's: this image carries its own `__saw_rt_*` seams, out
# of the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# THE USERSPACE UART ECHO DRIVER, AS A CHILD (sawos design 9 D-2), for the board
# whose console is a PL011. Same program as the ns16550 child package beside it,
# and the DIFFERENCES ARE THE DEVICE — see `uart-echo-pl011`, whose driver body
# this file's is.
#
# **IT IS LINKED AT THE CHILD BASE**, which is the one manifest line that differs
# from the root-as-driver twin's: on a machine with no translation two processes
# cannot both live at root's address.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/child.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
