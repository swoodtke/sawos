[package]
name = "child-echo-pl011"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# The userspace UART echo driver as a child, for the board whose console is a
# PL011. Same program as the ns16550 child package beside it; the differences
# are the device. See `uart-echo-pl011`, whose driver body this one reuses.
#
# Its only section is for aarch64, which links every process with `user.ld`
# (arm64 translates), the same script `uart-echo-pl011` names.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
