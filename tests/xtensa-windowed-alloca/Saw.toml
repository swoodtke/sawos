[package]
name = "xtensa-windowed-alloca"
version = "0.1.0"

# A windowed C root for the ESP32-S3 that moves its stack pointer with `movsp`
# after its caller's frame was spilled, under each call size. The Saw file is
# empty (see its header), so no Saw is compiled windowed into the image.
[dependencies]

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.xtensa-esp-unknown-elf]
linker-script = "windowed.ld"
native = "../../hal/xtensa-esp32s3/user/syscall.c alloca.c alloca.S"
target-features = "+windowed"
