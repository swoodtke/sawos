[package]
name = "bounded-room-child"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# A client with a task live whose bounded `send` waits for room, falls back to
# an unbounded `Call` when its table has no row for a claim, and takes a
# reply's refusal as its answer (spec §10.1).
[dependencies]
sos = { path = "../../kernel/sysapi" }
sosmain = { path = "../../rt/main" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 2, high = 3 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/user.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"

[sos.xtensa-esp-unknown-elf]
linker-script = "../../hal/xtensa-esp32s3/user/user.ld"
native = "../../hal/xtensa-esp32s3/user/syscall.c ../../rt/common_c/support.c"
