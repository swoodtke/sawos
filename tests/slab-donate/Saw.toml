[package]
name = "slab-donate"
version = "0.1.0"

# Same reason as sos/root's: this image carries its own `__saw_rt_*` seams, out
# of the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# M5 UNIT 6: CAPACITY BECOMES POLICY (sawos design 32, on design 25 D-6). Root
# fills the Waiter slab to its COMPILED FLOOR, is refused a fifth, donates a page
# to `SlabKind.Waiters`, and is then given the fifth — which proves the ceiling
# moved. Then the part that matters more than the count: the waiter living in the
# DONATED extent takes an attachment, is woken by a signal and reports its key,
# so a slot in donated memory is a slot like any other.
#
# It needs no child and no device — only a POOL to cut the donation out of, which
# is the runner's `"pool": True`.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
