[package]
name = "process-badimage"
version = "0.1.0"

runtime = true

# `BadImage` is a status, not a fault. Root hands `process_create` a region that
# is not an image, gets a value back, reports it and exits clean. In every other
# case where a process hands the kernel something wrong the process dies; here
# it does not, because image bytes are data a launcher was handed rather than
# something it wrote.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
