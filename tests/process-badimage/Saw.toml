[package]
name = "process-badimage"
version = "0.1.0"

runtime = true

# BADIMAGE IS A STATUS, NOT A FAULT (sawos design 2 D-4, settling sawlang#232
# agenda item 2's lean (i)). Root hands `process_create` a region that is not an
# image, gets a VALUE back, reports it and exits clean. Every other case in this
# suite where a process hands the kernel something wrong ends with the process
# dead; this is the one where it does not, and the reason is that image bytes
# are DATA a launcher was handed rather than something it wrote.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/root.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
