[package]
name = "give-duplicate-tag"
version = "0.1.0"

runtime = true

# A DUPLICATE TAG IS A FAULT (sawos design 4): the tag IS the identity, and an
# identity naming two handles is broken config — caller-checkable, since the
# launcher chose both — that would make a child's boot record a multimap and its
# lookup ambiguous. Same reasoning, same fault tag, as a Waiter's duplicate key.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/root.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
