[package]
name = "child-data-first"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# A child linked with its writable data first and its code after it, for
# `buffer_rule` and `buffer_alias`. It is linked at the second child base.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "first.riscv32.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c text_offset.c"

[sos.aarch64-unknown-none-elf]
linker-script = "first.arm64.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c text_offset.c"
