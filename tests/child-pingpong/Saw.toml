[package]
name = "child-pingpong"
version = "0.1.0"

# Same reason as sos/root's: this image carries its own `__saw_rt_*` seams, out
# of the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# **THE FUSED CLIENT, AND IT PRINTS NOTHING** (sawos design 17). One `send`
# per round trip, a payload it verifies itself, and an exit code that says
# whether every round matched. Its launcher asserts its exact syscall count,
# so a printed byte — one `ecall` each — would make that number a hash of its
# own prose (design 16's rule).

[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/child.ld"
native = "../../hal/riscv32/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/child.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
