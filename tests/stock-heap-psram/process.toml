# What this child needs from a stock root: tools/sosimage/src/declaration.saw
# states the format. It has no built-in heap, so every block it is served is
# one of its heaps'. The image says which range each heap's pool is in.
format = 1
arena = 0

[[boot]]
name = "system"
kind = "system"
tag = 1

# It holds its System, its Process and its main thread's own Thread handle;
# each heap's pool, `Memory` and `Mapping`, and the Process handle the heaps
# map through.
[quota]
handles = 12
mappings = 2

[heap.default]
len = 0x8000

[heap.data]
slot = 1
len = 0x1_0000
