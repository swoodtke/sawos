[package]
name = "give-boot-drain"
version = "0.1.0"

runtime = true

# THE HEADLINE OF M3 UNIT 3 (sawos design 4): root furnishes a child with
# capabilities, donates it its own Process handle at the barrier, and never has
# to witness what it does. It is a real Blade package for the reason sos/root is
# — a launcher should go through the pipeline every SOS process goes through,
# and should reach the kernel through the `sos` module and never through an op
# number.
#
# Its kernel arms no tick, so the only thing that ever takes the processor away
# from root is root parking on its own timer.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
