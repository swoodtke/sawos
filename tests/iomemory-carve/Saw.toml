[package]
name = "iomemory-carve"
version = "0.1.0"

runtime = true

# M3 UNIT 4's DEVICE-AUTHORITY PROOF (sawos design 6 D-1/D-2): a window is
# CARVED non-exclusively, mapped, and a carve the machine's protection hardware
# cannot express is a FAULT.
#
# It needs no per-architecture constant, which is itself worth noting: `carve`
# takes an OFFSET into what the caller holds, so a driver names a sub-window
# without ever learning an address. The one number here is the window's own
# length, and both boards' console pages are one page.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/root.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
