# `net_ping.toml` under the name of the case that boots it with a
# pinger that tells its first `WaitEvent`. The gate's `net_wait_told` case
# builds it with `sosimage build`, which names the image's files for the
# case.
format = 1

[image]
name = "net_wait_told"
board = "riscv32-virt"
tick = false

[root]
package = "stock"

# The driver's queue memory (one page) and one client's ring (eight slots
# each way: 32,896 bytes, and a page-rounded 0x9000 on arm64).
[[pool]]
name = "netq"
len = 0xA000

[[process]]
name = "net"
package = "sawos:drivers/svc-virtio-net"
device = { net = "VIRTIO7" }
pools = { queues = "netq" }
ceilings = { memory = ["transfer", "mint", "map", "physical"], pool = ["allocate", "map", "physical", "mint", "transfer"] }

[[process]]
name = "ping"
package = "sawos:tests/net-ping"
clients = { netdev = "net.netdev" }
inputs = { pingconfig = "tests/images/netping/tell-first.saw" }
