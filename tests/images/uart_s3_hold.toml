# `uart_s3_lines` with the driver's transmit ring at 16 bytes and its fill
# cap at 8 (`tests/images/uart/hold.saw`), so every line's `Write` is held
# until the ring has room for its rest. The S3 smoke's `uart_s3_hold` case
# builds it with `sosimage build`.
format = 1

[image]
name = "uart_s3_hold"
board = "esp32s3"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-uart-esp32s3"
device = { uart = "UART0" }
inputs = { uartconfig = "tests/images/uart/hold.saw" }

[[process]]
name = "client"
package = "sawos:tests/uart-lines"
