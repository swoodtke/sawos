# An image whose console is a healthy claimant that takes each request at once,
# from a thread at `Rt0`, and answers it a period later
# (`tests/console-staller` in its `late` mode), on the riscv32 `virt` board. A
# client prints seventeen lines, so the ring is full with its last waiting in a
# call, and another child faults: root's post about it is refused for room,
# waits for the inlet's room level, and lands once the claimant answers. The
# image arms no tick. The `console_room_kept` case builds it with `sosimage
# build`.
format = 1

[image]
name = "console_room_kept"
board = "riscv32-virt"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:tests/console-staller"
inputs = { stallconfig = "tests/console-staller/config/late_brisk.saw" }

[[process]]
name = "full"
package = "sawos:tests/console-flood"
inputs = { floodconfig = "tests/console-flood/config/full.saw" }
clients = { aux = "console.uart" }

[[process]]
name = "faulter"
package = "sawos:tests/console-flood"
inputs = { floodconfig = "tests/console-flood/config/fault.saw" }
clients = { aux = "console.uart" }
