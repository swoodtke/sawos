# An image that names its console, the console driver's serve, with a client
# written with `main` that prints three lines and panics
# (`tests/console-panic`), on the flat profile's board, `riscv32-virt-flat`.
# The image arms no tick. The `console_panic` case builds it with `sosimage
# build`.
format = 1

[image]
name = "console_panic"
board = "riscv32-virt-flat"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-console"

[[process]]
name = "client"
package = "sawos:tests/console-panic"
