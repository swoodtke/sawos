# A stock-root image the builder refuses once the kernel's numbers are known:
# the client's `handles` row is past the handle table. The gate's
# `stock_root_refused` case asks `sosimage build` for it and expects the
# refusal.
format = 1

[image]
name = "stock_refused"
board = "riscv32-virt"
tick = false

[root]
package = "stock"

[[process]]
name = "server"
package = "sawos:tests/stock-server"
pools = { scratch = "spare" }

[[process]]
name = "client"
package = "sawos:tests/stock-client"
clients = { peer = "server.echo" }
quota = { handles = 33 }

[[pool]]
name = "spare"
len = 0x1000
