# An image that names its console, the console driver's serve, with a client
# written with `main` that panics holding the output lock
# (`tests/console-panic`), on the riscv32 `virt` board. The image arms no
# tick. The `console_panic_locked` case builds it with `sosimage build`.
format = 1

[image]
name = "console_panic_locked"
board = "riscv32-virt"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-console"

[[process]]
name = "client"
package = "sawos:tests/console-panic"
inputs = { panicrole = "tests/images/consolepanic/locked.saw" }
