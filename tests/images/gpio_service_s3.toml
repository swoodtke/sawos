# The GPIO driver under the stock root, with a client that makes every request
# of `gpioproto` (`tests/gpio-service-client`) over the pins of
# `tests/images/gpio/smoke.saw`. The S3 smoke's `gpio_service` case builds it
# with `sosimage build`.
format = 1

[image]
name = "gpio_service"
board = "esp32s3"
tick = false

[root]
package = "stock"

[[process]]
name = "driver"
package = "sawos:drivers/svc-gpio-esp32s3"
device = { gpio = "GPIO", iomux = "IO_MUX" }
inputs = { gpioconfig = "tests/images/gpio/smoke.saw" }

[[process]]
name = "client"
package = "sawos:tests/gpio-service-client"
clients = { gpio = "driver.gpio" }
