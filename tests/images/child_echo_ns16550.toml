# The `child_echo_ns16550` case, as a hand-written image: a hand-written root
# (`tests/driver-child`) launching a driver child (`tests/child-echo-ns16550`),
# and the console's window as its one device row. `sosimage build` builds it.
format = 1

[image]
name = "child_echo_ns16550"
board = "riscv32-virt"
tick = false

[root]
package = "sawos:tests/driver-child"

[[process]]
name = "echo"
package = "sawos:tests/child-echo-ns16550"

[rows]
devices = ["UART0"]
