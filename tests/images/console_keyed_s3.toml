# `launch_all_s3.toml` at a console key that writes: the S3 smoke's
# `console_keyed_image` case builds it with `sosimage build`, which compiles
# the kernel at it, and boots it; the emulator's UART0 is not on the crystal
# by its CLK_CONF word, so the key's `not taken` line is printed.
format = 1

[image]
name = "console_keyed_image"
board = "esp32s3"
tick = false

[keys]
console = "b921600"

[root]
package = "sawos:tests/launch-all"

[[process]]
name = "first"
package = "sawos:tests/child-instance"

[[process]]
name = "second"
package = "sawos:tests/child-instance"

[[process]]
name = "third"
package = "sawos:tests/child-instance"

[[pool]]
name = "spare"
len = 0x4000

[rows]
pools = ["spare"]
