# The stock root on the riscv32 `virt` board, launching one process whose
# declaration has no `[ceilings]` and whose pool record names no rights, so the
# opt-in `physical` is in neither its ceilings nor its pool record. The gate's
# `stock_physical_default` case builds it with `sosimage build`.#
# Its image narrows the `pool` ceiling to every right but `extend` and
# `physical`, and its pool record, naming no rights, follows.
format = 1

[image]
name = "stock_physical_default"
board = "riscv32-virt"
tick = false

[root]
package = "stock"

[[process]]
name = "physdefault"
package = "sawos:tests/stock-physical-default"
pools = { dma = "spare" }
ceilings = { pool = ["transfer", "mint", "map", "map-execute", "allocate"] }

[[pool]]
name = "spare"
len = 0x1000
