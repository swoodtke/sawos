# The ESP32-S3's kernel-print console server as the image's console, with a
# client that prints a burst of lines beside a counting thread
# (`tests/console-share`). The S3 smoke does not run its
# `console_share_profile` case; it is built with `--emit-flash`.
format = 1

[image]
name = "console_share_profile"
board = "esp32s3"
tick = true
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-console"

[[process]]
name = "client"
package = "sawos:tests/console-share"
inputs = { shareconfig = "tests/console-share/config/burst.saw" }
clients = { uart = "console.uart" }
