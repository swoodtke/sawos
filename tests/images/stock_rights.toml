# The stock root on the riscv32 `virt` board, whose processes' System rights
# come from their declarations or, for one that names none, from the image's
# `[system]` default, here the launch convention's four less `transfer`.
# `narrow` names `debug` and `process-self` and prints every right its System
# handle has; `mute` names the convention's rights but `debug`, so its first
# print is the kernel's `AccessDenied` fault and root reports its end; and
# `plain` names none, and prints that it holds the image's default. The
# gate's `stock_rights` case builds it with `sosimage build`.
format = 1

[image]
name = "stock_rights"
board = "riscv32-virt"
tick = false

[root]
package = "stock"

[system]
rights = ["debug", "process-self", "clock-get"]

[[process]]
name = "narrow"
package = "sawos:tests/stock-narrow"

[[process]]
name = "mute"
package = "sawos:tests/stock-mute"

[[process]]
name = "plain"
package = "sawos:tests/stock-plain"
