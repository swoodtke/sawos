# An image that names its console, the console driver's serve, with a client
# written with `main` that fills the connection's ring with lines and panics
# (`tests/console-panic`), on the ESP32-S3. The image arms no tick. The
# `console_panic_full` case builds it with `sosimage build`.
format = 1

[image]
name = "console_panic_full"
board = "esp32s3"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-console"

[[process]]
name = "client"
package = "sawos:tests/console-panic"
inputs = { panicrole = "tests/images/consolepanic/full.saw" }
