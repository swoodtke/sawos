# The `uart_service_ns16550` case on the flat profile, as a hand-written
# image: `uart_service_ns16550.toml` for the board `riscv32-virt-flat`.
format = 1

[image]
name = "uart_service_ns16550"
board = "riscv32-virt-flat"
tick = false

[root]
package = "sawos:tests/uart-service"

[[process]]
name = "driver"
package = "sawos:drivers/svc-uart-ns16550"

[[process]]
name = "client"
package = "sawos:tests/svc-client"

[rows]
devices = ["UART0"]
