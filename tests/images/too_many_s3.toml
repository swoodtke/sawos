# Five processes besides root on the ESP32-S3, which has four flash slots for
# them: the S3 smoke's `too_many_processes` case holds that `sosimage build`
# refuses it, naming the counts, before it builds anything.
format = 1

[image]
name = "too_many_processes"
board = "esp32s3"
tick = false

[root]
package = "sawos:tests/launch-all"

[[process]]
name = "a"
package = "sawos:tests/child-instance"

[[process]]
name = "b"
package = "sawos:tests/child-instance"

[[process]]
name = "c"
package = "sawos:tests/child-instance"

[[process]]
name = "d"
package = "sawos:tests/child-instance"

[[process]]
name = "e"
package = "sawos:tests/child-instance"
