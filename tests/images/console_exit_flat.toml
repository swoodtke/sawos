# An image that names its console, the console driver's serve, with a client
# that prints a line and ends with `sosmain.exit` (`tests/console-exit`), on
# the flat profile's board, `riscv32-virt-flat`. The image arms no tick. The
# `console_exit` case builds it with `sosimage build`.
format = 1

[image]
name = "console_exit"
board = "riscv32-virt-flat"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-console"

[[process]]
name = "exit"
package = "sawos:tests/console-exit"
