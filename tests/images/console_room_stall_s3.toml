# `console_room_kept.toml` with a claimant that takes one message and stops
# taking (`tests/console-staller` in its `stall` mode), on the ESP32-S3: the
# ring stays full, root's post about the fault is refused for room with nothing
# of root's posted, and the watchdog, seeing the take count stand since the
# refusal, kills the claimant. The image arms no tick. The `console_room_stall`
# case builds it with `sosimage build`.
format = 1

[image]
name = "console_room_stall"
board = "esp32s3"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:tests/console-staller"
inputs = { stallconfig = "tests/console-staller/config/stall.saw" }

[[process]]
name = "full"
package = "sawos:tests/console-flood"
inputs = { floodconfig = "tests/console-flood/config/full.saw" }
clients = { aux = "console.uart" }

[[process]]
name = "faulter"
package = "sawos:tests/console-flood"
inputs = { floodconfig = "tests/console-flood/config/fault.saw" }
clients = { aux = "console.uart" }
