# An image whose console is a claimant that takes one message and stops taking
# (`tests/console-staller` in its `stall` mode), on the riscv32 `virt` board,
# and eight clients that panic at once with a text past the kernel's bound
# (`tests/console-flood` with `long_panic`): root's lines about their ends pass
# its backlog, so it drops those that do not fit and counts them, and says how
# many once the watchdog has killed the claimant. The image arms no tick. The
# `console_backlog_dropped` case builds it with `sosimage build`.
format = 1

[image]
name = "console_backlog_dropped"
board = "riscv32-virt"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:tests/console-staller"
inputs = { stallconfig = "tests/console-staller/config/stall.saw" }

[[process]]
name = "p1"
package = "sawos:tests/console-flood"
inputs = { floodconfig = "tests/console-flood/config/long_panic.saw" }
clients = { aux = "console.uart" }

[[process]]
name = "p2"
package = "sawos:tests/console-flood"
inputs = { floodconfig = "tests/console-flood/config/long_panic.saw" }
clients = { aux = "console.uart" }

[[process]]
name = "p3"
package = "sawos:tests/console-flood"
inputs = { floodconfig = "tests/console-flood/config/long_panic.saw" }
clients = { aux = "console.uart" }

[[process]]
name = "p4"
package = "sawos:tests/console-flood"
inputs = { floodconfig = "tests/console-flood/config/long_panic.saw" }
clients = { aux = "console.uart" }

[[process]]
name = "p5"
package = "sawos:tests/console-flood"
inputs = { floodconfig = "tests/console-flood/config/long_panic.saw" }
clients = { aux = "console.uart" }

[[process]]
name = "p6"
package = "sawos:tests/console-flood"
inputs = { floodconfig = "tests/console-flood/config/long_panic.saw" }
clients = { aux = "console.uart" }

[[process]]
name = "p7"
package = "sawos:tests/console-flood"
inputs = { floodconfig = "tests/console-flood/config/long_panic.saw" }
clients = { aux = "console.uart" }

[[process]]
name = "p8"
package = "sawos:tests/console-flood"
inputs = { floodconfig = "tests/console-flood/config/long_panic.saw" }
clients = { aux = "console.uart" }
