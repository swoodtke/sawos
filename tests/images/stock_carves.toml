# Seven processes, each given one word of the RTC carved from its row, in an
# image whose IoMemory slab holds eight: the RTC's row and the seven carves.
# The gate's `stock_carves` case builds it and boots it; `stock_carves_over`
# is the same with an eighth, which the builder refuses.
format = 1

[image]
name = "stock_carves"
board = "riscv32-virt"
tick = false

[limits]
iomemories = 8

[root]
package = "stock"

[[process]]
name = "a0"
package = "sawos:tests/stock-goldfish-part"
device = { alarm = "RTC.word[3..=3]" }

[[process]]
name = "a1"
package = "sawos:tests/stock-goldfish-part"
device = { alarm = "RTC.word[3..=3]" }

[[process]]
name = "a2"
package = "sawos:tests/stock-goldfish-part"
device = { alarm = "RTC.word[3..=3]" }

[[process]]
name = "a3"
package = "sawos:tests/stock-goldfish-part"
device = { alarm = "RTC.word[3..=3]" }

[[process]]
name = "a4"
package = "sawos:tests/stock-goldfish-part"
device = { alarm = "RTC.word[3..=3]" }

[[process]]
name = "a5"
package = "sawos:tests/stock-goldfish-part"
device = { alarm = "RTC.word[3..=3]" }

[[process]]
name = "a6"
package = "sawos:tests/stock-goldfish-part"
device = { alarm = "RTC.word[3..=3]" }
