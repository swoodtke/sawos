# An image that names its console, served by a driver that ends at its third
# request, unanswered (`tests/console-quit`), on the flat profile's board,
# `riscv32-virt-flat`: the client (`tests/console-gone`) prints, flushes, and
# prints again as a call, which the driver leaves as it ends. The image arms
# no tick. The `console_quit` case builds it with `sosimage build`.
format = 1

[image]
name = "console_quit"
board = "riscv32-virt-flat"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:tests/console-quit"

[[process]]
name = "client"
package = "sawos:tests/console-gone"
