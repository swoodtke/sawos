# A child with no built-in heap and two heaps over pools the stock root
# gives it, on the arm64 `virt` board: a default heap and a data heap, each
# pool in the image's `heap-ram` range. The child fills its data heap, shares
# a page from its default heap's pool, and exits; its end stops the machine.
# The gate's `stock_heap` case builds it with `sosimage build`.
format = 1

[image]
name = "stock_heap"
board = "arm64-virt"
tick = false
heap-ram = "ram"

[root]
package = "stock"

[[process]]
name = "heap"
package = "sawos:tests/stock-heap"
on-exit = "shutdown"
