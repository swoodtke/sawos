# A child whose heaps' pools come to 2 MiB, on the arm64 `virt` board: with
# its own region they pass the 2 MiB its rows have above its link address in
# the grant window, which a heap's row and the room it grows into need, so
# `sosimage build` refuses the image by name. The gate's `stock_heap_window`
# case builds it.
format = 1

[image]
name = "stock_heap_wide"
board = "arm64-virt"
tick = false

[root]
package = "stock"

[[process]]
name = "wide"
package = "sawos:tests/stock-heap-wide"
on-exit = "shutdown"
