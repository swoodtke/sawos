# Stage G1: the GPIO driver's interrupt path with nothing wired, from a client
# that drives pin 14, its own loopback (`tests/gpio-loopback-client`). The S3
# smoke's `gpio_loopback_board` case builds it for a board with `--emit-flash`.
format = 1

[image]
name = "gpio_loopback_board"
board = "esp32s3"
tick = false

[root]
package = "stock"

[[process]]
name = "driver"
package = "sawos:drivers/svc-gpio-esp32s3"
device = { gpio = "GPIO", iomux = "IO_MUX" }
inputs = { gpioconfig = "tests/images/gpio/board.saw" }

[[process]]
name = "client"
package = "sawos:tests/gpio-loopback-client"
clients = { gpio = "driver.gpio" }
