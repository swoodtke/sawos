# `launch_all_s3.toml` with a build key of its own: the S3 smoke's
# `keys_stated_twice` case names a clock key as well, and the runner refuses
# the case before anything is built, since a key is stated in one place.
format = 1

[image]
name = "keys_stated_twice"
board = "esp32s3"
tick = false

[keys]
clock = "xtal40"

[root]
package = "sawos:tests/launch-all"

[[process]]
name = "first"
package = "sawos:tests/child-instance"

[[process]]
name = "second"
package = "sawos:tests/child-instance"

[[process]]
name = "third"
package = "sawos:tests/child-instance"

[[pool]]
name = "spare"
len = 0x4000

[rows]
pools = ["spare"]
