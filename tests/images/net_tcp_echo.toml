# The virtio network driver and a client scenario on the riscv32 `virt` board.
# The client opens a TCP connection to the peer's echo port.
# The driver holds the last transport (`VIRTIO7`, where the runner places the
# network device). The gate's `net_tcp_echo` case builds it with
# `sosimage build`.
format = 1

[image]
name = "net_tcp_echo"
board = "riscv32-virt"
tick = false

[root]
package = "stock"

[[pool]]
name = "netq"
len = 0xA000

[[process]]
name = "net"
package = "sawos:drivers/svc-virtio-net"
device = { net = "VIRTIO7" }
pools = { queues = "netq" }
ceilings = { memory = ["transfer", "mint", "map", "physical"], pool = ["allocate", "map", "physical", "mint", "transfer"] }

[[process]]
name = "client"
package = "sawos:tests/net-client"
clients = { netdev = "net.netdev" }
inputs = { netcase = "tests/images/netclient/tcp_echo.saw" }
