# `uart_s3_read` with the driver's receive ring at 8 bytes
# (`tests/images/uart/lost.saw`) and a client that reads only once every
# byte typed has reached the driver (`tests/uart-reader` with
# `config/lost.saw`), so the ring overflows. The S3 smoke's `uart_s3_lost`
# case builds it with `sosimage build`.
format = 1

[image]
name = "uart_s3_lost"
board = "esp32s3"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-uart-esp32s3"
device = { uart = "UART0" }
inputs = { uartconfig = "tests/images/uart/lost.saw" }

[[process]]
name = "client"
package = "sawos:tests/uart-reader"
inputs = { readconfig = "tests/uart-reader/config/lost.saw" }
clients = { uart = "console.uart" }
