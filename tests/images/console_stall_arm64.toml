# An image whose console is a claimant that takes one message and then stops
# taking, alive (`tests/console-staller` in its `stall` mode), with one client
# that tells a byte to a second console driver (`svc-console` as `aux`, which
# the claim ends with `EXIT_CLAIMED`) and faults (`tests/console-flood` with
# `quick_fault`), on the arm64 `virt` board. Root's lines about those ends wait
# unanswered, and root's console watchdog kills the claimant. The image arms no
# tick. The `console_stall` case builds it with `sosimage build`.
format = 1

[image]
name = "console_stall"
board = "arm64-virt"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:tests/console-staller"
inputs = { stallconfig = "tests/console-staller/config/stall.saw" }

[[process]]
name = "aux"
package = "sawos:drivers/svc-console"

[[process]]
name = "quick"
package = "sawos:tests/console-flood"
inputs = { floodconfig = "tests/console-flood/config/quick_fault.saw" }
clients = { aux = "aux.uart" }
