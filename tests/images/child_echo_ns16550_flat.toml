# The `child_echo_ns16550` case on the flat profile, as a hand-written image:
# `child_echo_ns16550.toml` for the board `riscv32-virt-flat`.
format = 1

[image]
name = "child_echo_ns16550"
board = "riscv32-virt-flat"
tick = false

[root]
package = "sawos:tests/driver-child"

[[process]]
name = "echo"
package = "sawos:tests/child-echo-ns16550"

[rows]
devices = ["UART0"]
