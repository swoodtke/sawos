# The `process_walk` case, as a hand-written image: a hand-written root
# (`tests/process-walk`) launching two children (`tests/child-bye` and
# `tests/child-walk-idle`). `sosimage build` builds it.
format = 1

[image]
name = "process_walk"
board = "riscv32-virt"
tick = false

[root]
package = "sawos:tests/process-walk"

[[process]]
name = "bye"
package = "sawos:tests/child-bye"

[[process]]
name = "idle"
package = "sawos:tests/child-walk-idle"
