# The stock root on the riscv32 `virt` board, with a process whose declaration
# says `bands = "full"`. Root sets the identity band map on it before it
# starts, so a thread it starts at `Rt0` runs above one at `High`. The
# gate's `stock_full_bands` case builds it with `sosimage build`. There is no
# tick, so nothing but the kernel's own preemption on a wake orders the
# process's lines.
format = 1

[image]
name = "stock_full_bands"
board = "riscv32-virt"
tick = false

[root]
package = "stock"

[[process]]
name = "bands"
package = "sawos:tests/stock-bands"
