# `console_share_s3.toml` with the ESP32-S3's UART driver as the console: the
# same client and burst, so the two differ in the console's server alone. The
# S3 smoke does not run its `console_share_profile_uart` case; it is built
# with `--emit-flash`.
format = 1

[image]
name = "console_share_profile_uart"
board = "esp32s3"
tick = true
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-uart-esp32s3"
device = { uart = "UART0" }

[[process]]
name = "client"
package = "sawos:tests/console-share"
inputs = { shareconfig = "tests/console-share/config/burst.saw" }
clients = { uart = "console.uart" }
