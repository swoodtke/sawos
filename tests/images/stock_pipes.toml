# Four servers, a connection each, in an image whose Pipe slab holds four. No
# client is bound to any, so each ends once root has let go of its own end.
# The gate's `stock_pipes` case builds it and boots it; `stock_pipes_over` is
# the same with a fifth server, which the builder refuses.
format = 1

[image]
name = "stock_pipes"
board = "riscv32-virt"
tick = false

[limits]
pipes = 4

[root]
package = "stock"

[[process]]
name = "s0"
package = "sawos:tests/stock-server"
pools = { scratch = "p0" }

[[process]]
name = "s1"
package = "sawos:tests/stock-server"
pools = { scratch = "p1" }

[[process]]
name = "s2"
package = "sawos:tests/stock-server"
pools = { scratch = "p2" }

[[process]]
name = "s3"
package = "sawos:tests/stock-server"
pools = { scratch = "p3" }

[[pool]]
name = "p0"
len = 0x1000

[[pool]]
name = "p1"
len = 0x1000

[[pool]]
name = "p2"
len = 0x1000

[[pool]]
name = "p3"
len = 0x1000
