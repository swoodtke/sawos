# `stock_processes.toml` with a third child: four Process objects, root's
# among them, in a slab of three, which the builder refuses. The gate's
# `stock_processes_over` case expects the refusal.
format = 1

[image]
name = "stock_processes_over"
board = "riscv32-virt"
tick = false

[limits]
processes = 3

[root]
package = "stock"

[[process]]
name = "a0"
package = "sawos:tests/stock-goldfish-part"
device = { alarm = "RTC.word[3..=3]" }

[[process]]
name = "a1"
package = "sawos:tests/stock-goldfish-part"
device = { alarm = "RTC.word[3..=3]" }

[[process]]
name = "a2"
package = "sawos:tests/stock-goldfish-part"
device = { alarm = "RTC.word[3..=3]" }
