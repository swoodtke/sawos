# An image that names its console: the board's UART driver serves it, and the
# client, which declares no client record, is given an inlet of that
# connection under `CONSOLE_TAG` after its own records. The gate's
# `console_tag` case builds it with `sosimage build`.
format = 1

[image]
name = "console_tag"
board = "riscv32-virt"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-uart-ns16550"
device = { uart = "UART0" }

[[process]]
name = "client"
package = "sawos:tests/console-tag-client"
