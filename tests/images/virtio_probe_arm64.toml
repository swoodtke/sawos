# `virtio_probe.toml` on the arm64 `virt` board: one process holds the
# transports' page that starts at transport 24 (`VIRTIO24`, 0x0A00_3000, where
# the runner places the device) and prints its identity registers. That page is
# in the second device block, which a process could not map before the HAL
# offered it. The gate's `virtio_probe` case builds it with `sosimage build`.
format = 1

[image]
name = "virtio_probe"
board = "arm64-virt"
tick = false

[root]
package = "stock"

[[process]]
name = "probe"
package = "sawos:tests/virtio-probe"
device = { virtio = "VIRTIO24" }
