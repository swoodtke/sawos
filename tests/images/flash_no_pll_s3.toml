# `launch_all_s3.toml` at a flash key and no clock key, so at the default
# `rom`: a flash key but `rom` needs a clock key on the PLL, and the S3
# smoke's `flash_key_without_pll_image` case requires the kernel's compile
# to refuse it.
format = 1

[image]
name = "flash_key_without_pll_image"
board = "esp32s3"
tick = false

[keys]
flash = "dio80"

[root]
package = "sawos:tests/launch-all"

[[process]]
name = "first"
package = "sawos:tests/child-instance"

[[process]]
name = "second"
package = "sawos:tests/child-instance"

[[process]]
name = "third"
package = "sawos:tests/child-instance"

[[pool]]
name = "spare"
len = 0x4000

[rows]
pools = ["spare"]
