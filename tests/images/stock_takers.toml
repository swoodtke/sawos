# The stock root on the riscv32 `virt` board, with two processes taking the
# RTC whole: the first is given a sibling of its row and the second the row
# itself, the row being in root's hands since a setup write took it. Both
# print the alarm's upper word the setup write set. The gate's
# `stock_takers` case builds it with `sosimage build`.
format = 1

[image]
name = "stock_takers"
board = "riscv32-virt"
tick = false

[root]
package = "stock"

[[setup]]
register = "RTC.ALARM_HIGH"
set = 0x5

[[process]]
name = "probe"
package = "sawos:tests/stock-goldfish"

[[process]]
name = "alarm"
package = "sawos:tests/stock-goldfish-part"
device = { alarm = "RTC" }
inputs = { stockconfig = "tests/images/stock/alarm-whole.saw" }
