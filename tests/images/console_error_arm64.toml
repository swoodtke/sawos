# An image that names its console, the console driver's serve, with a client
# written with `main` that prints a line and returns an `Err`
# (`tests/console-error`), on the arm64 `virt` board. The image arms no tick.
# The `console_error` case builds it with `sosimage build`.
format = 1

[image]
name = "console_error"
board = "arm64-virt"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-console"

[[process]]
name = "client"
package = "sawos:tests/console-error"
