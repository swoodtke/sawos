# A child with no built-in heap and two heaps over pools the stock root gives
# it, on the ESP32-S3 with its PSRAM: the image's `heap-ram` puts the default
# heap's pool in the SRAM, and the child's own `heap-ram` puts its data heap's
# in the PSRAM. The child does word atomics on a block of the data heap and
# holds each heap's blocks to its range, then exits; its end stops the
# machine. The S3 smoke's `stock_heap_psram` case builds it with
# `sosimage build`.
format = 1

[image]
name = "stock_heap_psram"
board = "esp32s3-r8"
tick = false
heap-ram = "sram"

[root]
package = "stock"

[[process]]
name = "heap"
package = "sawos:tests/stock-heap-psram"
heap-ram = { data = "psram" }
on-exit = "shutdown"
