# `console_stall.toml` with the claimant in its `loop` mode, on the arm64
# `virt` board: it takes one message and loops in syscalls at `Rt0` without
# taking, and root's console watchdog, at `Rt1`, still kills it. The image arms
# no tick. The `console_stall_looping` case builds it with `sosimage build`.
format = 1

[image]
name = "console_stall_looping"
board = "arm64-virt"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:tests/console-staller"
inputs = { stallconfig = "tests/console-staller/config/loop.saw" }

[[process]]
name = "aux"
package = "sawos:drivers/svc-console"

[[process]]
name = "quick"
package = "sawos:tests/console-flood"
inputs = { floodconfig = "tests/console-flood/config/quick_fault.saw" }
clients = { aux = "aux.uart" }
