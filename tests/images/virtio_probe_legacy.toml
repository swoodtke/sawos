# `virtio_probe.toml` under the name of the case that boots it with
# legacy transports. The gate's `virtio_probe_legacy` case builds
# it with `sosimage build`, which names the image's files for the case.
format = 1

[image]
name = "virtio_probe_legacy"
board = "riscv32-virt"
tick = false

[root]
package = "stock"

[[process]]
name = "probe"
package = "sawos:tests/virtio-probe"
device = { virtio = "VIRTIO7" }
