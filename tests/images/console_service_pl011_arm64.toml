# The client of `console_service_arm64.toml` against the board's UART driver
# instead of the console driver: the image names the driver's package and
# gives it the console UART, and the client is the same package. The driver
# claims the console while it serves, so its serve is the image's console
# too: root writes its lines through it, and the client is given its inlet
# under `CONSOLE_TAG` beside its own. The gate's `console_service_uart` case
# builds it with `sosimage build`.
format = 1

[image]
name = "console_service_uart"
board = "arm64-virt"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-uart-pl011"
device = { uart = "UART0" }

[[process]]
name = "client"
package = "sawos:tests/uart-text-client"
clients = { uart = "console.uart" }
# Its declaration's row and one more, for the console's inlet, which its boot
# set keeps for the whole run: the table is full where its declaration says.
quota = { handles = 8 }
