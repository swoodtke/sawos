# The ESP32-S3's UART driver as the image's console, and a client that holds
# the most `Read`s the driver will with nothing typed, has a fifth answered
# `Busy` and drops the four, twice (`tests/uart-reader` with
# `config/held.saw`). The S3 smoke's `uart_s3_held` case builds it with
# `sosimage build`.
format = 1

[image]
name = "uart_s3_held"
board = "esp32s3"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-uart-esp32s3"
device = { uart = "UART0" }

[[process]]
name = "client"
package = "sawos:tests/uart-reader"
inputs = { readconfig = "tests/uart-reader/config/held.saw" }
clients = { uart = "console.uart" }
