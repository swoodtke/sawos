# `virtio_probe_arm64.toml` under the name of the case that boots it with
# another device on the bus. The gate's `virtio_probe_wrong_device` case builds
# it with `sosimage build`, which names the image's files for the case.
format = 1

[image]
name = "virtio_probe_wrong_device"
board = "arm64-virt"
tick = false

[root]
package = "stock"

[[process]]
name = "probe"
package = "sawos:tests/virtio-probe"
device = { virtio = "VIRTIO24" }
