# `console_tag_ns16550.toml` on arm64: the board's UART driver serves the
# console, and the client is given an inlet of that connection under
# `CONSOLE_TAG` after its own records. The gate's `console_tag` case builds it
# with `sosimage build`.
format = 1

[image]
name = "console_tag"
board = "arm64-virt"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-uart-pl011"
device = { uart = "UART0" }

[[process]]
name = "client"
package = "sawos:tests/console-tag-client"
