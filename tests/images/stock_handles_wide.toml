# The stock root on the riscv32 `virt` board, whose one process declares a
# handle table of 48 entries, past the 32 its body holds, and fills 40 of
# them. The builder derives the handle block that table needs and the image
# carries it; without it root's `QuotaSet` for the row answers `NoResource`.
# The gate's `stock_handles_wide` case builds it with `sosimage build`.
format = 1

[image]
name = "stock_handles_wide"
board = "riscv32-virt"
tick = false

[root]
package = "stock"

[[process]]
name = "wide"
package = "sawos:tests/stock-handles-wide"
