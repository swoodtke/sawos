# The stock root on the riscv32-virt board, whose one process serves thirty
# connections. Root holds more handles than its body's table while it makes
# them, and the image states no root table or blocks: the builder derives
# root's table and the handle blocks it takes. Without the derivation root
# runs out of table room while it makes the connections.
format = 1

[image]
name = "stock_root_wide"
board = "riscv32-virt"
tick = false

[limits]
pipes = 32

[root]
package = "stock"

[[process]]
name = "wide"
package = "sawos:tests/stock-root-wide"
