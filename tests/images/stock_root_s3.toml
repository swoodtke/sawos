# The stock root on the ESP32-S3: three setup writes to timer group 1's
# alarm word (a store, then a clear and a set that keep the other bits), a
# server and a client joined by a connection, the server's pool and its
# declared `Waiter` row, and the timer group given whole to the one process
# that takes it. The server serves until its last client's end is gone.
# Root stops the machine when every child has ended. The S3
# smoke's `stock_root` case builds it with `sosimage build`.
format = 1

[image]
name = "stock_root"
board = "esp32s3"
tick = false

[root]
package = "stock"

[[setup]]
register = "TIMG1.T0ALARMLO"
write = 0xF0F0

[[setup]]
register = "TIMG1.T0ALARMLO"
clear = 0xF0

[[setup]]
register = "TIMG1.word[4]"
set = 0xA

[[process]]
name = "server"
package = "sawos:tests/stock-server"
pools = { scratch = "spare" }
inputs = { stockconfig = "tests/images/stock/server.saw" }

[[process]]
name = "client"
package = "sawos:tests/stock-client"
clients = { peer = "server.echo" }

[[process]]
name = "probe"
package = "sawos:tests/stock-timg"

[[pool]]
name = "spare"
len = 0x1000
