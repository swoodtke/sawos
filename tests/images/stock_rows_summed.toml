# The stock root on the riscv32 `virt` board with two instances of a process
# whose declaration gives it a `Thread` row of 9, the first raised to 10 here.
# The image states no `threads` total: the builder derives it from root's
# main thread and both rows, 20 in all, past the board's default total of 16,
# so each instance makes every thread its row allows while the other holds
# its own. The gate's `stock_rows_summed` case builds it with `sosimage
# build`.
format = 1

[image]
name = "stock_rows_summed"
board = "riscv32-virt"
tick = false

[root]
package = "stock"

[[process]]
name = "first"
package = "sawos:tests/stock-rows-summed"
quota = { threads = 10 }

[[process]]
name = "second"
package = "sawos:tests/stock-rows-summed"
