# The console driver under the stock root, with a client that writes, syncs,
# reads and ends through it (`tests/uart-text-client`). The gate's
# `console_service` case builds it with `sosimage build`.
format = 1

[image]
name = "console_service"
board = "riscv32-virt"
tick = false

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-console"

[[process]]
name = "client"
package = "sawos:tests/uart-text-client"
clients = { uart = "console.uart" }
