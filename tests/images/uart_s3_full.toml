# `uart_s3_read` with more bytes than the driver's receive threshold typed at
# once (`tests/uart-reader` with `config/full.saw`), so the receive FIFO's
# full cause rises. The S3 smoke's `uart_s3_full` case builds it with
# `sosimage build`.
format = 1

[image]
name = "uart_s3_full"
board = "esp32s3"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-uart-esp32s3"
device = { uart = "UART0" }

[[process]]
name = "client"
package = "sawos:tests/uart-reader"
inputs = { readconfig = "tests/uart-reader/config/full.saw" }
clients = { uart = "console.uart" }
