# The ESP32-S3's kernel-print console server as the image's console, with
# `tests/console-share` as the stage timer (`config/stages.saw`): where the
# time of one line goes. The S3 smoke does not run its
# `console_share_stages_console` case; it is built with `--emit-flash`.
format = 1

[image]
name = "console_share_stages_console"
board = "esp32s3"
tick = true
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-console"

[[process]]
name = "client"
package = "sawos:tests/console-share"
inputs = { shareconfig = "tests/console-share/config/stages.saw" }
clients = { uart = "console.uart" }
