# `net_ping_flat.toml` under the name of the case that boots it with
# legacy transports. The gate's `net_legacy` case builds it with
# `sosimage build`, which names the image's files for the case.
format = 1

[image]
name = "net_legacy"
board = "riscv32-virt-flat"
tick = false

[root]
package = "stock"

[[pool]]
name = "netq"
len = 0xA000

[[process]]
name = "net"
package = "sawos:drivers/svc-virtio-net"
device = { net = "VIRTIO7" }
pools = { queues = "netq" }
ceilings = { memory = ["transfer", "mint", "map", "physical"], pool = ["allocate", "map", "physical", "mint", "transfer"] }

[[process]]
name = "ping"
package = "sawos:tests/net-ping"
clients = { netdev = "net.netdev" }
