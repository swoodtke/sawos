# `uart_s3_hold` with the driver's serving thread lowered to its client's
# level (`tests/images/uart/backpressure.saw`) and a client that tells 64
# lines in one burst (`tests/uart-lines` with `config/burst.saw`), so the
# connection's ring fills and the client's tells become calls. The S3
# smoke's `uart_s3_backpressure` case builds it with `sosimage build`.
format = 1

[image]
name = "uart_s3_backpressure"
board = "esp32s3"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-uart-esp32s3"
device = { uart = "UART0" }
inputs = { uartconfig = "tests/images/uart/backpressure.saw" }

[[process]]
name = "client"
package = "sawos:tests/uart-lines"
inputs = { linesconfig = "tests/uart-lines/config/burst.saw" }
