# The stock root on the riscv32 `virt` board, launching a process whose
# declaration asks for the opt-in `physical` on `memory` and `pool` and an
# image that grants neither, so the builder refuses it. The gate's
# `stock_physical_not_granted` case builds it with `sosimage build`.
#
# It lives in `tests/images/refused/`, which the tree check does not read, since
# it binds every image in `tests/images/` and this one is refused there.
format = 1

[image]
name = "stock_physical_not_granted"
board = "riscv32-virt"
tick = false

[root]
package = "stock"

[[process]]
name = "physgrant"
package = "sawos:tests/stock-physical-granted"
pools = { dma = "spare" }

[[pool]]
name = "spare"
len = 0x2000
