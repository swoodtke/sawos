# The stock root on the riscv32 `virt` board, launching a process whose pool
# record keeps `allocate`, `map` and `physical`, in an image whose `pool`
# ceiling lists `allocate` and `physical`: it removes `map`, which the record
# keeps, so the builder refuses it. The gate's `stock_ceiling_strips_kept` case
# builds it with `sosimage build`.
#
# It lives in `tests/images/refused/`, which the tree check does not read, since
# it binds every image in `tests/images/` and this one is refused there.
format = 1

[image]
name = "stock_ceiling_strips_kept"
board = "riscv32-virt"
tick = false

[root]
package = "stock"

[[process]]
name = "physgrant"
package = "sawos:tests/stock-physical-granted"
pools = { dma = "spare" }
ceilings = { memory = ["map", "physical"], pool = ["allocate", "physical"] }

[[pool]]
name = "spare"
len = 0x2000
