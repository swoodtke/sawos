# The stock root on the riscv32 `virt` board, launching a program written with
# `main` (`tests/console-lines`) in an image whose `process` ceiling lists
# `exit` alone: it removes rights the program's start-up spends, so the builder
# refuses it. The gate's `stock_ceiling_strips_runtime` case builds it with
# `sosimage build`.
#
# It lives in `tests/images/refused/`, which the tree check does not read, since
# it binds every image in `tests/images/` and this one is refused there.
format = 1

[image]
name = "stock_ceiling_strips_runtime"
board = "riscv32-virt"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-console"

[[process]]
name = "lines"
package = "sawos:tests/console-lines"
ceilings = { process = ["exit"] }
