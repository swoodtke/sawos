# The stock root on the riscv32 `virt` board, launching a process whose
# declaration has no `[ceilings]`, in an image that grants it `physical` on
# `memory`, so the builder refuses it. The gate's `stock_physical_not_asked`
# case builds it with `sosimage build`.
#
# It lives in `tests/images/refused/`, which the tree check does not read, since
# it binds every image in `tests/images/` and this one is refused there.
format = 1

[image]
name = "stock_physical_not_asked"
board = "riscv32-virt"
tick = false

[root]
package = "stock"

[[process]]
name = "physdefault"
package = "sawos:tests/stock-physical-default"
pools = { dma = "spare" }
ceilings = { memory = ["map", "physical"] }

[[pool]]
name = "spare"
len = 0x1000
