# `virtio_probe_arm64.toml` under the name of the case that boots it with no
# device on the bus. The gate's `virtio_probe_empty` case builds it with
# `sosimage build`, which names the image's files for the case. It holds the
# first page of transports (`VIRTIO0`), where nothing is plugged: DeviceID 0.
format = 1

[image]
name = "virtio_probe_empty"
board = "arm64-virt"
tick = false

[root]
package = "stock"

[[process]]
name = "probe"
package = "sawos:tests/virtio-probe"
device = { virtio = "VIRTIO0" }
