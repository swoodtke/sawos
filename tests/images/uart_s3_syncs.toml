# The driver with a 16-byte transmit ring, a 4-byte fill cap and its serving
# thread at its client's level (`tests/images/uart/syncs.saw`), and a client
# that writes a line the driver must hold and posts five `Sync`s behind it,
# one more than the driver holds at once (`tests/uart-reader` with
# `config/syncs.saw`). The S3 smoke's `uart_s3_syncs` case builds it with
# `sosimage build`.
format = 1

[image]
name = "uart_s3_syncs"
board = "esp32s3"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-uart-esp32s3"
device = { uart = "UART0" }
inputs = { uartconfig = "tests/images/uart/syncs.saw" }

[[process]]
name = "client"
package = "sawos:tests/uart-reader"
inputs = { readconfig = "tests/uart-reader/config/syncs.saw" }
clients = { uart = "console.uart" }
