# An image whose console, a healthy claimant that takes one message a period
# (`tests/console-staller` in its `slow` mode), is the second process, on the
# arm64 `virt` board: two clients fault at once, so root has six lines for the
# console, of which it posts four, and a third (`tests/console-flood` with
# `behind`) yields until root has posted them and then prints ten lines, which
# the claimant takes before root's last two. The image arms no tick. The
# `console_writer_limit` case builds it with `sosimage build`.
format = 1

[image]
name = "console_writer_limit"
board = "arm64-virt"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "behind"
package = "sawos:tests/console-flood"
inputs = { floodconfig = "tests/console-flood/config/behind.saw" }
clients = { aux = "console.uart" }

[[process]]
name = "console"
package = "sawos:tests/console-staller"
inputs = { stallconfig = "tests/console-staller/config/slow.saw" }

[[process]]
name = "first"
package = "sawos:tests/console-flood"
inputs = { floodconfig = "tests/console-flood/config/fault.saw" }
clients = { aux = "console.uart" }

[[process]]
name = "second"
package = "sawos:tests/console-flood"
inputs = { floodconfig = "tests/console-flood/config/fault.saw" }
clients = { aux = "console.uart" }
