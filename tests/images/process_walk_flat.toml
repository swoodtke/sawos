# The `process_walk` case on the flat profile, as a hand-written image:
# `process_walk.toml` for the board `riscv32-virt-flat`.
format = 1

[image]
name = "process_walk"
board = "riscv32-virt-flat"
tick = false

[root]
package = "sawos:tests/process-walk"

[[process]]
name = "bye"
package = "sawos:tests/child-bye"

[[process]]
name = "idle"
package = "sawos:tests/child-walk-idle"
