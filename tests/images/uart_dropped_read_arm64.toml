# A client that drops the claim of a read its UART driver answers from its
# buffer (`tests/uart-drop-client`), against the PL011 driver. The gate's
# `uart_dropped_read` case builds it with `sosimage build`. The driver claims
# the console while it serves, so its serve is the image's console too.
format = 1

[image]
name = "uart_dropped_read"
board = "arm64-virt"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-uart-pl011"
device = { uart = "UART0" }

[[process]]
name = "client"
package = "sawos:tests/uart-drop-client"
clients = { uart = "console.uart" }
