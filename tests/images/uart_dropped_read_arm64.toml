# A client that drops the claim of a read its UART driver can answer at once
# (`tests/uart-drop-client`), against the PL011 driver. The gate's
# `uart_dropped_read` case builds it with `sosimage build`.
format = 1

[image]
name = "uart_dropped_read"
board = "arm64-virt"
tick = false

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-uart-pl011"
device = { uart = "UART0" }

[[process]]
name = "client"
package = "sawos:tests/uart-drop-client"
clients = { uart = "console.uart" }
