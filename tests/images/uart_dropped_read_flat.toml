# `uart_dropped_read.toml` on the flat profile's board. The gate's
# `uart_dropped_read` case builds it with `sosimage build`.
format = 1

[image]
name = "uart_dropped_read"
board = "riscv32-virt-flat"
tick = false

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-uart-ns16550"
device = { uart = "UART0" }

[[process]]
name = "client"
package = "sawos:tests/uart-drop-client"
clients = { uart = "console.uart" }
