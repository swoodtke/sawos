# The stock root on the riscv32 `virt` board: three setup writes to the
# RTC's alarm word (a store, then a clear and a set that keep the other
# bits), a server and a client joined by a connection, the server's pool and
# its declared `Waiter` row, the RTC given whole to one process with its line
# and one register of it carved for another. The server serves until its
# last client's end is gone, and its end stops the machine. The gate's
# `stock_root` case builds it with `sosimage build`.
format = 1

[image]
name = "stock_root"
board = "riscv32-virt"
tick = false

[root]
package = "stock"

[[setup]]
register = "RTC.ALARM_HIGH"
write = 0xF0F0

[[setup]]
register = "RTC.ALARM_HIGH"
clear = 0xF0

[[setup]]
register = "RTC.word[3]"
set = 0xA

[[process]]
name = "server"
package = "sawos:tests/stock-server"
pools = { scratch = "spare" }
inputs = { stockconfig = "tests/images/stock/server.saw" }
on-exit = "shutdown"

[[process]]
name = "client"
package = "sawos:tests/stock-client"
clients = { peer = "server.echo" }

[[process]]
name = "probe"
package = "sawos:tests/stock-goldfish"

[[process]]
name = "alarm"
package = "sawos:tests/stock-goldfish-part"
device = { alarm = "RTC.word[3..=3]" }

[[pool]]
name = "spare"
len = 0x1000
