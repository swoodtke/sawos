# Stage G2: the switch wired from GPIO 21 to ground, read through the GPIO
# driver (`tests/gpio-switch-client`). The S3 smoke's `gpio_switch_board` case
# builds it for a board with `--emit-flash`.
format = 1

[image]
name = "gpio_switch_board"
board = "esp32s3"
tick = false

[root]
package = "stock"

[[process]]
name = "driver"
package = "sawos:drivers/svc-gpio-esp32s3"
device = { gpio = "GPIO", iomux = "IO_MUX" }
inputs = { gpioconfig = "tests/images/gpio/board.saw" }

[[process]]
name = "client"
package = "sawos:tests/gpio-switch-client"
clients = { gpio = "driver.gpio" }
