# `net_ping.toml` on the flat profile's board. The gate's `net_ping` case
# builds it with `sosimage build`.
format = 1

[image]
name = "net_ping"
board = "riscv32-virt-flat"
tick = false

[root]
package = "stock"

[[pool]]
name = "netq"
len = 0xA000

[[process]]
name = "net"
package = "sawos:drivers/svc-virtio-net"
device = { net = "VIRTIO7" }
pools = { queues = "netq" }
ceilings = { memory = ["transfer", "mint", "map", "physical"], pool = ["allocate", "map", "physical", "mint", "transfer"] }

[[process]]
name = "ping"
package = "sawos:tests/net-ping"
clients = { netdev = "net.netdev" }
