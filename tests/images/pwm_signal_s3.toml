# Stage P1: the servo signal on pads 41 and 42 with nothing wired, from a
# client that commands both channels and reads the pads back through GPIO
# (`tests/pwm-signal-client`), over the servos of `tests/images/pwm/board.saw`.
# The S3 smoke's `pwm_signal_board` case builds it for a board with
# `--emit-flash`, once at each of the `rom` and `pll80` clock keys.
#
# The servo pins, 41 and 42, are stated four times: in the configuration, in
# the driver's two parts, and in the two pad words of the setup writes (bits 9
# and 10 of GPIO's second bank). Nothing checks one against another; this
# stage reads back the output enables `ENABLE1_W1TS` sets.
format = 1

[image]
name = "pwm_signal_board"
board = "esp32s3"
tick = false

[root]
package = "stock"

# LEDC's clock on and its reset off, each a read-modify-write of a word that
# gates every peripheral; then pads 41 and 42 driven low once they are GPIO.
[[setup]]
register = "SYSTEM.PERIP_CLK_EN0"
set = 0x800

[[setup]]
register = "SYSTEM.PERIP_RST_EN0"
clear = 0x800

[[setup]]
register = "GPIO.OUT1_W1TC"
write = 0x600

[[setup]]
register = "GPIO.ENABLE1_W1TS"
write = 0x600

[[process]]
name = "driver"
package = "sawos:drivers/svc-pwm-esp32s3"
device = { ledc = "LEDC", outsel = "GPIO.out_sel[41..=42]", pads = "IO_MUX.pad[41..=42]" }
inputs = { pwmconfig = "tests/images/pwm/board.saw" }

[[process]]
name = "client"
package = "sawos:tests/pwm-signal-client"
device = { gpio = "GPIO" }
clients = { pwm = "driver.pwm" }
