# `console_service.toml` for the flat profile's board, `riscv32-virt-flat`.
# The gate's `console_service` case builds it with `sosimage build`.
format = 1

[image]
name = "console_service"
board = "riscv32-virt-flat"
tick = false

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-console"

[[process]]
name = "client"
package = "sawos:tests/uart-text-client"
clients = { uart = "console.uart" }
