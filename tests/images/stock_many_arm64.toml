# Six children of 28 records each over 18 connections, on the
# arm64-virt board: the stock root's plan and bookkeeping take more than the
# user scripts' default arena, so the builder links root with the arena it
# computes (8-byte words). Each child says one line and exits; root
# reports each end. Each child's clients are of serves root has given by then,
# its own and its elders', so root holds one end of each connection. The
# gate's `stock_many` case builds it with `sosimage build`.
format = 1

[image]
name = "stock_many"
board = "arm64-virt"
tick = false

[limits]
processes = 7
pipes = 18

[root]
package = "stock"

[[process]]
name = "m0"
package = "sawos:tests/stock-many"
clients = { c0 = "m0.s0", c1 = "m0.s1", c2 = "m0.s2", c3 = "m0.s0", c4 = "m0.s1", c5 = "m0.s2", c6 = "m0.s0", c7 = "m0.s1", c8 = "m0.s2", c9 = "m0.s0", c10 = "m0.s1", c11 = "m0.s2", c12 = "m0.s0", c13 = "m0.s1", c14 = "m0.s2", c15 = "m0.s0", c16 = "m0.s1", c17 = "m0.s2", c18 = "m0.s0", c19 = "m0.s1", c20 = "m0.s2", c21 = "m0.s0", c22 = "m0.s1", c23 = "m0.s2" }

