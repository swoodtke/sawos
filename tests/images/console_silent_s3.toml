# An image that names no console, with a client written with `main` whose
# System holds no `Debug` (`tests/console-silent`), on the ESP32-S3: its
# `print` is dropped. The `console_silent` case builds it with `sosimage
# build`.
format = 1

[image]
name = "console_silent"
board = "esp32s3"
tick = false

[root]
package = "stock"

[[process]]
name = "silent"
package = "sawos:tests/console-silent"
