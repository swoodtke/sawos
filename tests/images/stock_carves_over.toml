# `stock_carves.toml` with an eighth process given a carve of the RTC: nine
# IoMemory objects in a slab of eight, which the builder refuses before it
# builds anything. The gate's `stock_carves_over` case expects the refusal.
format = 1

[image]
name = "stock_carves_over"
board = "riscv32-virt"
tick = false

[limits]
iomemories = 8

[root]
package = "stock"

[[process]]
name = "a0"
package = "sawos:tests/stock-goldfish-part"
device = { alarm = "RTC.word[3..=3]" }

[[process]]
name = "a1"
package = "sawos:tests/stock-goldfish-part"
device = { alarm = "RTC.word[3..=3]" }

[[process]]
name = "a2"
package = "sawos:tests/stock-goldfish-part"
device = { alarm = "RTC.word[3..=3]" }

[[process]]
name = "a3"
package = "sawos:tests/stock-goldfish-part"
device = { alarm = "RTC.word[3..=3]" }

[[process]]
name = "a4"
package = "sawos:tests/stock-goldfish-part"
device = { alarm = "RTC.word[3..=3]" }

[[process]]
name = "a5"
package = "sawos:tests/stock-goldfish-part"
device = { alarm = "RTC.word[3..=3]" }

[[process]]
name = "a6"
package = "sawos:tests/stock-goldfish-part"
device = { alarm = "RTC.word[3..=3]" }

[[process]]
name = "a7"
package = "sawos:tests/stock-goldfish-part"
device = { alarm = "RTC.word[3..=3]" }
