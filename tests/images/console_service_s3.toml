# `console_service.toml` for the ESP32-S3, which has no UART driver. The S3
# smoke's `console_service` case builds it with `sosimage build`.
format = 1

[image]
name = "console_service"
board = "esp32s3"
tick = false

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-console"

[[process]]
name = "client"
package = "sawos:tests/uart-text-client"
clients = { uart = "console.uart" }
