# The PL011 driver as the image's console, and a client that prints lines
# through it and then `Sync`s from a thread above the driver's band
# (`tests/uart-lines-client`): the driver's `Stats` after the `Sync`
# counts every byte sent. The gate's `uart_sync` case builds it with
# `sosimage build`.
format = 1

[image]
name = "uart_sync"
board = "arm64-virt"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-uart-pl011"
device = { uart = "UART0" }

[[process]]
name = "client"
package = "sawos:tests/uart-lines-client"
clients = { uart = "console.uart" }
