# The stock root on the riscv32 `virt` board, whose processes' rights ceilings
# come from their declarations' `[ceilings]`. `ceilings` narrows its ceilings
# to three kinds and reads them back, then signals an Event whose ceiling
# withholds `signal`; `heap` is a program written with `main` over a heap,
# whose declaration lists exactly the rights its runtime spends. The gate's
# `stock_ceilings` case builds it with `sosimage build`.
format = 1

[image]
name = "stock_ceilings"
board = "riscv32-virt"
tick = false
heap-ram = "ram"

[root]
package = "stock"

[[process]]
name = "ceilings"
package = "sawos:tests/stock-ceilings"

[[process]]
name = "heap"
package = "sawos:tests/stock-ceilings-heap"
