# The ESP32-S3's UART driver as the image's console, interrupt-driven both
# ways, with one client that prints numbered lines through it
# (`tests/uart-lines`) and returns. The driver claims the console, so the
# kernel holds back its lines about the client's end and root prints them
# through the driver. The S3 smoke's `uart_s3_lines` case builds it with
# `sosimage build`.
format = 1

[image]
name = "uart_s3_lines"
board = "esp32s3"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-uart-esp32s3"
device = { uart = "UART0" }

[[process]]
name = "client"
package = "sawos:tests/uart-lines"
