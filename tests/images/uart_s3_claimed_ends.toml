# The ESP32-S3's UART driver as the image's console, and three clients that
# end under its claim (`tests/uart-ends`): one makes a debug print and
# exits, one panics on a text longer than the kernel keeps, one faults on a
# syscall. The kernel holds back its lines about their ends and root prints
# them from the death records, through the driver. The S3 smoke's
# `uart_s3_claimed_ends` case builds it with `sosimage build`.
format = 1

[image]
name = "uart_s3_claimed_ends"
board = "esp32s3"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-uart-esp32s3"
device = { uart = "UART0" }

[[process]]
name = "ends"
package = "sawos:tests/uart-ends"

[[process]]
name = "panics"
package = "sawos:tests/uart-ends"
inputs = { endsconfig = "tests/uart-ends/config/panic.saw" }

[[process]]
name = "faults"
package = "sawos:tests/uart-ends"
inputs = { endsconfig = "tests/uart-ends/config/fault.saw" }
