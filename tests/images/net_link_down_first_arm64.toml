# `net_link_down_first.toml` on the arm64 `virt` board, the driver on `VIRTIO24`
# (0x0A00_3000), the profile's own row. The gate's `net_link_down_first` case
# builds it with `sosimage build`.
format = 1

[image]
name = "net_link_down_first"
board = "arm64-virt"
tick = false

[root]
package = "stock"

[[pool]]
name = "netq"
len = 0xA000

[[process]]
name = "net"
package = "sawos:drivers/svc-virtio-net"
device = { net = "VIRTIO24" }
pools = { queues = "netq" }
ceilings = { memory = ["transfer", "mint", "map", "physical"], pool = ["allocate", "map", "physical", "mint", "transfer"] }

[[process]]
name = "client"
package = "sawos:tests/net-client"
clients = { netdev = "net.netdev" }
inputs = { netcase = "tests/images/netclient/link_down_first.saw" }
