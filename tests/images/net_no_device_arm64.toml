# `net_ping_arm64.toml` with the driver on `VIRTIO24` (0x0A00_3000), under the
# name of the case that boots it with no device on the transport. The gate's
# `net_no_device` case builds it with `sosimage build`, which names the
# image's files for the case.
format = 1

[image]
name = "net_no_device"
board = "arm64-virt"
tick = false

[root]
package = "stock"

[[pool]]
name = "netq"
len = 0xA000

[[process]]
name = "net"
package = "sawos:drivers/svc-virtio-net"
device = { net = "VIRTIO24" }
pools = { queues = "netq" }
ceilings = { memory = ["transfer", "mint", "map", "physical"], pool = ["allocate", "map", "physical", "mint", "transfer"] }

[[process]]
name = "ping"
package = "sawos:tests/net-ping"
clients = { netdev = "net.netdev" }
