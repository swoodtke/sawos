# An image that names its console, the console driver's serve, with a client
# written with `main` that prints a line and returns an `Err`
# (`tests/console-error`), on the ESP32-S3. The image arms no tick. The
# `console_error` case builds it with `sosimage build`.
format = 1

[image]
name = "console_error"
board = "esp32s3"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-console"

[[process]]
name = "client"
package = "sawos:tests/console-error"
