# The virtio-mmio probe on the riscv32 `virt` board: one process holds the
# last transport (`VIRTIO7`, where QEMU places a device the command line gives
# no bus) and prints its identity registers. The gate's `virtio_probe` case
# builds it with `sosimage build`.
format = 1

[image]
name = "virtio_probe"
board = "riscv32-virt"
tick = false

[root]
package = "stock"

[[process]]
name = "probe"
package = "sawos:tests/virtio-probe"
device = { virtio = "VIRTIO7" }
