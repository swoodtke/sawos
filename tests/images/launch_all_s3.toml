# Root and three processes on the ESP32-S3, every address the image builder's:
# three instances of `tests/child-instance`, each its own link in a flash slot
# and a region of its own, and a pool placed after them, which root allocates
# from. The S3 smoke's `launch_all` case builds it with `sosimage build` and
# boots it.
format = 1

[image]
name = "launch_all"
board = "esp32s3"
tick = false

[root]
package = "sawos:tests/launch-all"

[[process]]
name = "first"
package = "sawos:tests/child-instance"

[[process]]
name = "second"
package = "sawos:tests/child-instance"

[[process]]
name = "third"
package = "sawos:tests/child-instance"

[[pool]]
name = "spare"
len = 0x4000

[rows]
pools = ["spare"]
