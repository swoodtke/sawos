# The ESP32-S3's UART driver as the image's console, with a client that
# echoes what is typed at the UART and reports each line with the driver's
# counters (`tests/uart-line-echo`). It never ends, so the S3 smoke does not
# run its `uart_line_echo` case; it is built with `--emit-flash`.
format = 1

[image]
name = "uart_line_echo"
board = "esp32s3"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-uart-esp32s3"
device = { uart = "UART0" }

[[process]]
name = "client"
package = "sawos:tests/uart-line-echo"
clients = { uart = "console.uart" }
