# `net_ring_no_pin.toml` on the flat profile's board. The gate's
# `net_ring_no_pin` case builds it with `sosimage build`.
format = 1

[image]
name = "net_ring_no_pin"
board = "riscv32-virt-flat"
tick = false

[root]
package = "stock"

[[pool]]
name = "netq"
len = 0xA000

[[process]]
name = "net"
package = "sawos:drivers/svc-virtio-net"
device = { net = "VIRTIO7" }
pools = { queues = "netq" }
ceilings = { memory = ["transfer", "mint", "map", "physical"], pool = ["allocate", "map", "physical", "mint", "transfer"] }

[[process]]
name = "client"
package = "sawos:tests/net-client"
clients = { netdev = "net.netdev" }
inputs = { netcase = "tests/images/netclient/ring_no_pin.saw" }
