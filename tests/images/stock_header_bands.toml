# A stock-root image the builder refuses once it has built the child: the
# child's manifest states a band map, which is root's and is not read for a
# child. The gate's `stock_header_bands` case asks `sosimage build` for it and
# expects the refusal.
format = 1

[image]
name = "stock_header_bands"
board = "riscv32-virt"
tick = false

[root]
package = "stock"

[[process]]
name = "asks"
package = "sawos:tests/stock-bands-header"
