# `virtio_probe.toml` on the flat profile's board. The gate's `virtio_probe`
# case builds it with `sosimage build`.
format = 1

[image]
name = "virtio_probe"
board = "riscv32-virt-flat"
tick = false

[root]
package = "stock"

[[process]]
name = "probe"
package = "sawos:tests/virtio-probe"
device = { virtio = "VIRTIO7" }
