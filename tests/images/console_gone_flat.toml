# An image that names its console, the serve of a driver that ends at once,
# before it serves anyone (`tests/console-gone-driver`), on the flat profile's
# board, `riscv32-virt-flat`: the client (`tests/console-gone`) prints to a
# driver that is gone. The image arms no tick. The `console_gone` case builds it
# with `sosimage build`.
format = 1

[image]
name = "console_gone"
board = "riscv32-virt-flat"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:tests/console-gone-driver"

[[process]]
name = "client"
package = "sawos:tests/console-gone"
