# The `uart_service_ns16550` case, as a hand-written image: a hand-written
# root (`tests/uart-service`) launching the NS16550 driver and its client, and
# the console's window as its one device row. `sosimage build` builds it.
format = 1

[image]
name = "uart_service_ns16550"
board = "riscv32-virt"
tick = false

[root]
package = "sawos:tests/uart-service"

[[process]]
name = "driver"
package = "sawos:drivers/svc-uart-ns16550"

[[process]]
name = "client"
package = "sawos:tests/svc-client"

[rows]
devices = ["UART0"]
