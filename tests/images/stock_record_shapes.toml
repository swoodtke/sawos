# The stock root on the riscv32 `virt` board, whose processes are given one
# record of each shape the stock root makes with the rights their declarations
# name: `first` a sibling of the RTC's row and its line, `carve` a carve of
# one register, `last` the row itself after root has taken it for the others,
# and `pipes` the server end of a connection and an inlet of it. Each prints
# the rights it holds. The gate's `stock_record_shapes` case builds it with
# `sosimage build`.
format = 1

[image]
name = "stock_record_shapes"
board = "riscv32-virt"
tick = false

[root]
package = "stock"

[[process]]
name = "first"
package = "sawos:tests/stock-shape-first"

[[process]]
name = "carve"
package = "sawos:tests/stock-shape-carve"
device = { alarm = "RTC.word[3..=3]" }

[[process]]
name = "last"
package = "sawos:tests/stock-shape-last"

[[process]]
name = "pipes"
package = "sawos:tests/stock-shape-pipes"
clients = { peer = "pipes.echo" }
