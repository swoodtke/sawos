# An image that names its console, the serve of a driver that ends at once,
# before it serves anyone (`tests/console-gone-driver`), on the ESP32-S3: the
# client (`tests/console-panic`) prints three lines to a driver that is gone and
# panics. The image arms no tick. The `console_panic_gone` case builds it with
# `sosimage build`.
format = 1

[image]
name = "console_panic_gone"
board = "esp32s3"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:tests/console-gone-driver"

[[process]]
name = "client"
package = "sawos:tests/console-panic"
