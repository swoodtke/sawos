# An image that names its console, the console driver's serve, and gives its
# processes no `Debug` unless they name it (`[system]`), on the arm64 `virt`
# board: the driver ends at once, before it serves anyone, and the client
# (`tests/console-gone`), which names its own rights, prints to a driver that
# is gone. The image arms no tick. The `console_gone` case builds it with
# `sosimage build`.
format = 1

[image]
name = "console_gone"
board = "arm64-virt"
tick = false
console = "console.uart"

[system]
rights = ["process-self", "transfer"]

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-console"

[[process]]
name = "client"
package = "sawos:tests/console-gone"
