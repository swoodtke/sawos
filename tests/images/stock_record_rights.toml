# The stock root on the riscv32 `virt` board, whose process is given a window
# with the one right its declaration's record names, `map`, within the
# `iomemory` ceiling its declaration lists. It prints the rights it holds of
# the window and carves it. The gate's `stock_record_rights` case builds it
# with `sosimage build`.
format = 1

[image]
name = "stock_record_rights"
board = "riscv32-virt"
tick = false

[root]
package = "stock"

[[process]]
name = "rights"
package = "sawos:tests/stock-record-rights"
device = { rtc = "RTC" }
