# The NS16550 driver built to panic once it has served three messages
# (`config/panic.saw`), holding the console claim with its transmitter
# busy, as the image's console, and a client that prints lines through it
# (`tests/uart-lines-client`). The driver's teardown ends the claim, and
# the kernel's lines about its death come out on the console the driver
# left. The gate's `uart_claimed_death` case builds it with
# `sosimage build`.
format = 1

[image]
name = "uart_claimed_death"
board = "riscv32-virt"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-uart-ns16550"
device = { uart = "UART0" }
inputs = { uartconfig = "drivers/svc-uart-ns16550/config/panic.saw" }

[[process]]
name = "client"
package = "sawos:tests/uart-lines-client"
clients = { uart = "console.uart" }
