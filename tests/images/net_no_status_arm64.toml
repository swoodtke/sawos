# `net_ping_arm64.toml` with the driver on `VIRTIO8` (0x0A00_1000), under the
# name of the case that boots it with a device that does not offer
# `STATUS`. The gate's `net_no_status` case builds it with `sosimage build`.
format = 1

[image]
name = "net_no_status"
board = "arm64-virt"
tick = false

[root]
package = "stock"

[[pool]]
name = "netq"
len = 0xA000

[[process]]
name = "net"
package = "sawos:drivers/svc-virtio-net"
device = { net = "VIRTIO8" }
pools = { queues = "netq" }
ceilings = { memory = ["transfer", "mint", "map", "physical"], pool = ["allocate", "map", "physical", "mint", "transfer"] }

[[process]]
name = "ping"
package = "sawos:tests/net-ping"
clients = { netdev = "net.netdev" }
