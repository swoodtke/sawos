# An image whose console is `svc-console`, with twelve more of it, on the
# riscv32 `virt` board: thirteen connections, and root holds every one's inlet
# until its release, beside the console's inlet it keeps and, from its
# supervise step, a sibling of the console's Process handle and its watchdog's
# kick. The builder sizes root's handle table from the most it holds at any
# step, and the image boots to `root: console ended` only when the count is
# right. The `console_root_handles` case builds it with `sosimage build`.
format = 1

[image]
name = "console_root_handles"
board = "riscv32-virt"
tick = false
console = "console.uart"

[limits]
pipes = 13

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-console"

[[process]]
name = "s1"
package = "sawos:drivers/svc-console"

[[process]]
name = "s2"
package = "sawos:drivers/svc-console"

[[process]]
name = "s3"
package = "sawos:drivers/svc-console"

[[process]]
name = "s4"
package = "sawos:drivers/svc-console"

[[process]]
name = "s5"
package = "sawos:drivers/svc-console"

[[process]]
name = "s6"
package = "sawos:drivers/svc-console"

[[process]]
name = "s7"
package = "sawos:drivers/svc-console"

[[process]]
name = "s8"
package = "sawos:drivers/svc-console"

[[process]]
name = "s9"
package = "sawos:drivers/svc-console"

[[process]]
name = "s10"
package = "sawos:drivers/svc-console"

[[process]]
name = "s11"
package = "sawos:drivers/svc-console"

[[process]]
name = "s12"
package = "sawos:drivers/svc-console"
