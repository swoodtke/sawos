# `launch_all_s3.toml` at a clock key on the PLL and a flash key: the S3
# smoke's `flash_keyed_image` case builds it with `sosimage build`, which
# compiles the kernel at both, and boots it.
format = 1

[image]
name = "flash_keyed_image"
board = "esp32s3"
tick = false

[keys]
clock = "pll80"
flash = "dio80"

[root]
package = "sawos:tests/launch-all"

[[process]]
name = "first"
package = "sawos:tests/child-instance"

[[process]]
name = "second"
package = "sawos:tests/child-instance"

[[process]]
name = "third"
package = "sawos:tests/child-instance"

[[pool]]
name = "spare"
len = 0x4000

[rows]
pools = ["spare"]
