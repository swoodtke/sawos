# The ESP32-S3's UART driver as the image's console, built to take one
# message and then stop taking, alive (`tests/images/uart/stall.saw`), and
# a client that faults (`tests/uart-ends` with `config/fault.saw`). Root's
# lines about the fault wait behind the stopped driver, and root's console
# watchdog kills it. The S3 smoke's `uart_s3_stall` case builds it with
# `sosimage build`.
format = 1

[image]
name = "uart_s3_stall"
board = "esp32s3"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-uart-esp32s3"
device = { uart = "UART0" }
inputs = { uartconfig = "tests/images/uart/stall.saw" }

[[process]]
name = "faults"
package = "sawos:tests/uart-ends"
inputs = { endsconfig = "tests/uart-ends/config/fault.saw" }
