# Root and four processes, every address the image builder's: three
# instances of `tests/child-instance`, each its own link at its own region,
# `tests/child-bye`, and a pool placed after them, which root allocates from.
# The gate's `launch_all` case builds it with `sosimage build` on riscv32 and
# boots it.
format = 1

[image]
name = "launch_all"
board = "riscv32-virt"
tick = false

[root]
package = "sawos:tests/launch-all"

[[process]]
name = "first"
package = "sawos:tests/child-instance"

[[process]]
name = "second"
package = "sawos:tests/child-instance"

[[process]]
name = "third"
package = "sawos:tests/child-instance"

[[process]]
name = "bye"
package = "sawos:tests/child-bye"

[[pool]]
name = "spare"
len = 0x1_0000

[rows]
pools = ["spare"]
