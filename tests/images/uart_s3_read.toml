# The ESP32-S3's UART driver as the image's console, with a client that
# reads four bytes the runner types at UART0 (`tests/uart-reader`). The S3
# smoke's `uart_s3_read` case builds it with `sosimage build`.
format = 1

[image]
name = "uart_s3_read"
board = "esp32s3"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-uart-esp32s3"
device = { uart = "UART0" }

[[process]]
name = "client"
package = "sawos:tests/uart-reader"
clients = { uart = "console.uart" }
