# The NS16550 driver built with a 16-byte transmit ring (`config/hold.saw`) as
# the image's console, and a client that prints lines of 100 bytes
# through it (`tests/uart-lines-client`): each line is a `Write` larger
# than the ring, which the driver holds until the device has taken room
# for it. The gate's `uart_hold` case builds it with `sosimage build`.
format = 1

[image]
name = "uart_hold"
board = "riscv32-virt"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-uart-ns16550"
device = { uart = "UART0" }
inputs = { uartconfig = "drivers/svc-uart-ns16550/config/hold.saw" }

[[process]]
name = "client"
package = "sawos:tests/uart-lines-client"
clients = { uart = "console.uart" }
