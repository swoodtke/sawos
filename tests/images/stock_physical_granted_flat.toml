# The stock root on the riscv32 `virt` board, flat profile, launching one
# process whose declaration asks for the opt-in `physical` on `memory` and
# `pool`, which its image grants on both. The gate's `stock_physical_granted`
# case builds it with `sosimage build`.
format = 1

[image]
name = "stock_physical_granted"
board = "riscv32-virt-flat"
tick = false

[root]
package = "stock"

[[process]]
name = "physgrant"
package = "sawos:tests/stock-physical-granted"
pools = { dma = "spare" }
ceilings = { memory = ["map", "physical"], pool = ["allocate", "map", "physical"] }

[[pool]]
name = "spare"
len = 0x2000
