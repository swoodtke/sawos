# The client of `console_service_flat.toml` against the board's UART driver
# instead of the console driver: the image names the driver's package and
# gives it the console UART, and the client is the same package. The gate's
# `console_service_uart` case builds it with `sosimage build`.
format = 1

[image]
name = "console_service_uart"
board = "riscv32-virt-flat"
tick = false

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-uart-ns16550"
device = { uart = "UART0" }

[[process]]
name = "client"
package = "sawos:tests/uart-text-client"
clients = { uart = "console.uart" }
