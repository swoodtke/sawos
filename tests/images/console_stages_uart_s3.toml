# `console_stages_s3.toml` with the ESP32-S3's UART driver as the console.
# The S3 smoke does not run its `console_share_stages` case; it is built with
# `--emit-flash`.
format = 1

[image]
name = "console_share_stages"
board = "esp32s3"
tick = true
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-uart-esp32s3"
device = { uart = "UART0" }

[[process]]
name = "client"
package = "sawos:tests/console-share"
inputs = { shareconfig = "tests/console-share/config/stages.saw" }
clients = { uart = "console.uart" }
