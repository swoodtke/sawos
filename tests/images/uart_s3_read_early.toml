# `uart_s3_read` as its own image, for the case that types the bytes at once
# as the emulator starts. The S3 smoke's
# `uart_s3_read_early` case builds it with `sosimage build`.
format = 1

[image]
name = "uart_s3_read_early"
board = "esp32s3"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-uart-esp32s3"
device = { uart = "UART0" }

[[process]]
name = "client"
package = "sawos:tests/uart-reader"
clients = { uart = "console.uart" }
