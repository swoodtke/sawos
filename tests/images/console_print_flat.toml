# An image that names its console, the console driver's serve, with a client
# written with `main` and no heap (`tests/console-lines`), on the flat
# profile's board, `riscv32-virt-flat`: the builder gives the client an inlet
# of that connection under `CONSOLE_TAG`, and its `print` goes to the driver.
# The image arms no tick. The `console_print` case builds it with `sosimage
# build`.
format = 1

[image]
name = "console_print"
board = "riscv32-virt-flat"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-console"

[[process]]
name = "lines"
package = "sawos:tests/console-lines"
