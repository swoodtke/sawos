# An image that names its console, the console driver's serve, with a client
# whose declaration names no System rights (`tests/console-default`), on the
# riscv32 `virt` board. The client keeps the image's default, which in an image
# that names a console has no `Debug`, and prints it through the console. The
# image arms no tick. The `console_default` case builds it with `sosimage
# build`.
format = 1

[image]
name = "console_default"
board = "riscv32-virt"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-console"

[[process]]
name = "default"
package = "sawos:tests/console-default"
