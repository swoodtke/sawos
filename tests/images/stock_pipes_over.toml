# `stock_pipes.toml` with a fifth server: five connections in a Pipe slab of
# four, which the builder refuses. The gate's `stock_pipes_over` case expects
# the refusal.
format = 1

[image]
name = "stock_pipes_over"
board = "riscv32-virt"
tick = false

[limits]
pipes = 4

[root]
package = "stock"

[[process]]
name = "s0"
package = "sawos:tests/stock-server"
pools = { scratch = "p0" }

[[process]]
name = "s1"
package = "sawos:tests/stock-server"
pools = { scratch = "p1" }

[[process]]
name = "s2"
package = "sawos:tests/stock-server"
pools = { scratch = "p2" }

[[process]]
name = "s3"
package = "sawos:tests/stock-server"
pools = { scratch = "p3" }

[[process]]
name = "s4"
package = "sawos:tests/stock-server"
pools = { scratch = "p4" }

[[pool]]
name = "p0"
len = 0x1000

[[pool]]
name = "p1"
len = 0x1000

[[pool]]
name = "p2"
len = 0x1000

[[pool]]
name = "p3"
len = 0x1000

[[pool]]
name = "p4"
len = 0x1000
