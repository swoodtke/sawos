# Two processes beside root in an image whose Process slab holds three. The
# gate's `stock_processes` case builds it and boots it;
# `stock_processes_over` is the same with a third child, which the builder
# refuses.
format = 1

[image]
name = "stock_processes"
board = "riscv32-virt"
tick = false

[limits]
processes = 3

[root]
package = "stock"

[[process]]
name = "a0"
package = "sawos:tests/stock-goldfish-part"
device = { alarm = "RTC.word[3..=3]" }

[[process]]
name = "a1"
package = "sawos:tests/stock-goldfish-part"
device = { alarm = "RTC.word[3..=3]" }
