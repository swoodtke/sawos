# An image that names its console, the console driver's serve, and gives its
# processes no `Debug` unless they name it (`[system]`), on the riscv32 `virt`
# board: the driver ends at once, before it serves anyone, and the client
# (`tests/console-panic`) prints three lines to a driver that is gone and
# panics. The image arms no tick. The `console_panic_gone` case builds it with
# `sosimage build`.
format = 1

[image]
name = "console_panic_gone"
board = "riscv32-virt"
tick = false
console = "console.uart"

[system]
rights = ["process-self", "transfer"]

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-console"

[[process]]
name = "client"
package = "sawos:tests/console-panic"
