[package]
name = "winsaw"
version = "0.1.0"

# The recursion the windowed Saw cases on the ESP32-S3 share, as a library: no
# `emit`, no linker script, no `runtime`. A package that depends on it is
# compiled as one unit with its own target features, so this code is windowed
# in a package that says `+windowed` and call0 in one that does not.
# `window.c`, the probe `window_frames` calls, is named in each such package's
# `native` list, which is where a C unit's flags come from.
