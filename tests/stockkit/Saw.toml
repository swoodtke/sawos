[package]
name = "stockkit"
version = "0.1.0"

# What the children of the gate's stock-root images do (`tests/stock-*`):
# print the records their launcher gave them, in the order the drain meets
# them, and use each. A library: each child's package is a few lines that
# name its declaration's records and call in here.
[dependencies]
sos = { path = "../../kernel/sysapi" }
