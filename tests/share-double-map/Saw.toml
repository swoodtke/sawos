[package]
name = "share-double-map"
version = "0.1.0"

# Same reason as sos/root's: this image carries its own `__saw_rt_*` seams, out
# of the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# SHARED MEMORY, THE WHOLE OF IT (sawos design 9 D-3). This launcher splits one
# page off its RAM pool and maps it into TWO address spaces — its own and a
# child's — then writes a byte the child reads and reads a byte the child wrote.
# It installs the child's row ITSELF, so the child holds no Memory handle at
# all: access without possession, which is the contrast with unit 6's other
# installation direction (the driver child, which maps its own window).
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32/user/syscall.c ../../rt/common_c/support.c ../poolbase_riscv32.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/root.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c ../poolbase_arm64.c"
