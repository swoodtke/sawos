[package]
name = "xtensa-xregs-hold"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# Two threads of one process each fill BR, MAC16's registers and MISC0..3
# with their own pattern, yield, and check it survived.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 2, high = 3 }

# The ESP32-S3 only: the register helpers are Xtensa assembly.
[sos.xtensa-esp-unknown-elf]
linker-script = "../../hal/xtensa-esp32s3/user/user.ld"
native = "../xtensa/extra_regs.S ../../hal/xtensa-esp32s3/user/syscall.c ../../rt/common_c/support.c"
