[package]
name = "xtensa-windowed-saw-fault"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# A windowed Saw child of `death-notify`'s call0 Saw root, built whole for the
# windowed ABI as `xtensa-windowed-saw` is (see its manifest). It descends 64
# frames and, at the bottom, loads from an address that answers no load.
[dependencies]
sos = { path = "../../kernel/sysapi" }
winsaw = { path = "../winsaw" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.xtensa-esp-unknown-elf]
linker-script = "../../hal/xtensa-esp32s3/user/child.ld"
native = "../../hal/xtensa-esp32s3/user/syscall.c ../../rt/common_c/support.c ../winsaw/window.c"
target-features = "+windowed"
