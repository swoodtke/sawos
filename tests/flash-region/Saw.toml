[package]
name = "flash-region"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# A region over flash is an image source and nothing the kernel or a process
# writes: neither a destination nor a slab donation (spec §5.6, §2.8). Built
# for the ESP32-S3, the board whose image blobs are flash.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.xtensa-esp-unknown-elf]
linker-script = "../../hal/xtensa-esp32s3/user/root.ld"
native = "../../hal/xtensa-esp32s3/user/syscall.c ../../rt/common_c/support.c"
