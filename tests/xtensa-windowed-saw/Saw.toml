[package]
name = "xtensa-windowed-saw"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# A windowed Saw root for the ESP32-S3. `target-features = "+windowed"` makes
# Blade compile the whole module graph windowed (this program, `winsaw`, `sos`
# and `sosrt`, the panic path among them) and every native unit with it, the
# system-call stub and the C floor included: every object of an image must use
# one convention, and the linker does not check (hal/xtensa-esp32s3/ABI.md
# §7d). `_start` opens with `entry`, as every compiled function does.
[dependencies]
sos = { path = "../../kernel/sysapi" }
winsaw = { path = "../winsaw" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.xtensa-esp-unknown-elf]
linker-script = "../../hal/xtensa-esp32s3/user/user.ld"
native = "../../hal/xtensa-esp32s3/user/syscall.c ../../rt/common_c/support.c ../winsaw/window.c"
target-features = "+windowed"
