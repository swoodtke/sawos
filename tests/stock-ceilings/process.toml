# What this child needs from a stock root: tools/sosimage/src/declaration.saw
# states the format. It narrows its rights ceilings to the three kinds it
# lists, so every other kind has none, and its Event's ceiling withholds
# `signal`. Its System handle keeps the two rights it names.
format = 1
arena = 0x2000

[[boot]]
name = "system"
kind = "system"
tag = 1
rights = ["debug", "process-self"]

[ceilings]
process = ["event-create", "stats", "exit"]
event = ["receive", "wait"]
clock = ["read"]
