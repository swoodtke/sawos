[package]
name = "uart-service"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# Driver-as-service, from the launcher's side. Root creates the connection and
# both children, gives the device window and the server end to one of them and a
# minted sibling inlet to the other, and then becomes a client itself through
# the inlet it kept.
#
# It names no device. `UART_BASE` appears nowhere in this package: root's whole
# part is deciding who gets the window, and a capability has no datasheet, which
# is why this package is arch-free while its driver children are per-chip.
[dependencies]
sos = { path = "../../kernel/sysapi" }
uartproto = { path = "../uartproto" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
