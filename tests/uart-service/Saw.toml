[package]
name = "uart-service"
version = "0.1.0"

# Same reason as sos/root's: this image carries its own `__saw_rt_*` seams, out
# of the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# **DRIVER-AS-SERVICE, FROM THE LAUNCHER'S SIDE** (sawos design 21, M4 unit 5 —
# the money shot). Root creates the connection and BOTH children, gives the
# device window and the server end to one of them and a minted SIBLING INLET to
# the other, and then becomes a client itself through the inlet it kept.
#
# **IT NAMES NO DEVICE.** `UART_BASE` appears nowhere in this package: root's
# whole part is deciding WHO gets the window, which is what a launcher is for —
# and a capability has no datasheet, which is why this package is arch-free
# while its driver children are per-chip.
[dependencies]
sos = { path = "../../kernel/sysapi" }
uartproto = { path = "../uartproto" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/root.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
