[package]
name = "c3-isolation"
version = "0.1.0"

runtime = true

# DESIGN 20's `isolation` SMOKE CASE, root's half. Root creates and starts
# `c3-child-poke`, which reaches for the KERNEL's memory, and the access faults.
#
# Root's own script here is this board's root script; the child it launches is
# what does the reaching. See that package's manifest for why neither could be
# the virt sibling reused.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32-esp32c3/user/root.ld"
native = "../../hal/riscv32-esp32c3/user/syscall.c ../../rt/common_c/support.c"

# THE NO-A BUILD SPELLING, USERSPACE HALF (design 20; ../../hal/
# riscv32-esp32c3/ABI.md §3). Blade's built-in default for a riscv32 triple is
# the virt/P4 Profile A baseline — `rv32imac_zicsr` / `+m,+a,+c` — and the
# ESP32-C3 HAS NO A EXTENSION, so all three keys are restated here. Without
# them the image links `amo*`/`lr`/`sc` instructions the part cannot execute,
# and NOTHING catches it: this emulator's CPU model advertises A (misa reads
# 0x401411AD), so the wrong build runs green here and faults on silicon.
march = "rv32imc_zicsr_zifencei"
mabi = "ilp32"
target-features = "+m,+c"
