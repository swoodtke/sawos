[package]
name = "c3-isolation"
version = "0.1.0"

runtime = true

# The `isolation` smoke case, root's half. Root creates and starts
# `c3-child-poke`, which reaches for the kernel's memory, and the access faults.
#
# Root's script here is this board's root script; the child it launches does the
# reaching. See that package's manifest for why neither could be the virt
# sibling.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32-esp32c3/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

# Userspace half of the no-A build spelling (hal/riscv32-esp32c3/ABI.md §3).
# Blade's default for a riscv32 triple is the virt Profile A baseline
# (`rv32imac_zicsr`, `+m,+a,+c`), and the ESP32-C3 has no A extension, so all
# three keys are restated here. Without them the image links `amo*`/`lr`/`sc`
# instructions the part cannot execute, and nothing catches it: the emulator's
# CPU model advertises A (ABI.md §3a), so the wrong build runs green there and
# faults on silicon.
march = "rv32imc_zicsr_zifencei"
mabi = "ilp32"
target-features = "+m,+c"
