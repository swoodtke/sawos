[package]
name = "pipe-child"
version = "0.1.0"

# Same reason as root's: this image carries its own `__saw_rt_*` seams, out of
# the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# **A CONNECTION ACROSS A PROCESS BOUNDARY** (sawos design 13 D-3, M4 unit 1) —
# the seed of unit 5's client. Root creates a pair, keeps the outlet and GIVES
# the inlet to a child under a tag; the child drains the end out of its boot set,
# posts one message and exits; root polls until the bytes arrive.
#
# Its kernel arms no tick, so the only thing that ever takes the processor away
# from root is root parking on its own timer between poll rounds.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
