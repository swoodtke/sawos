# What this client needs from a stock root: tools/sosimage/src/declaration.saw
# states the format. Its image names the driver's serve as the console, which
# its lines are printed through, and as this client's `uart` too.
format = 1
arena = 0x1000
bands = "full"              # its working thread runs at `Rt1`, above the driver

[[boot]]
name = "system"
kind = "system"
tag = 1

[[boot]]
name = "uart"
kind = "client"
protocol = "uartproto"
tag = 2

# Its main thread and the thread at `Rt1` it joins.
[quota]
threads = 2
