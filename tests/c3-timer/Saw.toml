[package]
name = "c3-timer"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# The `timer` smoke case: a SYSTIMER alarm reaches the CPU through the
# ESP32-C3's interrupt matrix and ticks a fixed number of times.
#
# This is a separate package from `timer-oneshot` because a package names its
# linker script by target triple, and the C3 profile uses the same
# `riscv32-unknown-none-elf` triple as the virt profile. A package can name one
# script or the other and not both, and the virt script would link root at
# 0x8020_0000, an address this part does not have. The program is not
# board-specific; only the manifest forks.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32-esp32c3/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

# Userspace half of the no-A build spelling (hal/riscv32-esp32c3/ABI.md §3).
# Blade's default for a riscv32 triple is the virt Profile A baseline
# (`rv32imac_zicsr`, `+m,+a,+c`), and the ESP32-C3 has no A extension, so all
# three keys are restated here. Without them the image links `amo*`/`lr`/`sc`
# instructions the part cannot execute, and nothing catches it: the emulator's
# CPU model advertises A (ABI.md §3a), so the wrong build runs green there and
# faults on silicon.
march = "rv32imc_zicsr_zifencei"
mabi = "ilp32"
target-features = "+m,+c"
