[package]
name = "quota-exceeded"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# The launcher half of the quota proof. It furnishes a child that will meet its
# own Event budget, parks while the child reports, and reads the child's verdict
# back through the Process handle it kept.
#
# It has to be a child. Root is init and its policy cap is the machine, so
# root's rows are unlimited and only the slab can refuse it; a quota is
# something only a launched process can meet.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
