[package]
name = "pool-back"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# A pool's two ends: an allocation from the back and one from the front sit
# at the pool's last bytes and its first, and both come home whole.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 2, high = 3 }

# `poolbase_<arch>.c` is where the pool is; see `tests/poolbase_riscv32.c`.
[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/user.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c ../poolbase_riscv32.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c ../poolbase_arm64.c"

[sos.xtensa-esp-unknown-elf]
linker-script = "../../hal/xtensa-esp32s3/user/user.ld"
native = "../../hal/xtensa-esp32s3/user/syscall.c ../../rt/common_c/support.c ../poolbase_xtensa.c"
