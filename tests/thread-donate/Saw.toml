[package]
name = "thread-donate"
version = "0.1.0"

# Same reason as sos/root's: this image carries its own `__saw_rt_*` seams, out
# of the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# M5 UNIT 6a: THREADS DONATE (sawos design 34). Root fills the Thread slab to its
# COMPILED FLOOR, is refused a ninth, donates a page to `SlabKind.Threads`, and is
# then given the ninth — which proves the ceiling moved. Then the part design 32
# declined this kind over: the thread living in the DONATED extent is STARTED,
# yields three times and exits with a value the joiner reads, so the
# context-switch path is exercised on a frame in donated memory.
#
# It needs no child and no device — only a POOL to cut the donation out of, which
# is the runner's `"pool": True`.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
