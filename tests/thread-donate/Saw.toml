[package]
name = "thread-donate"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# Threads donate. Root fills the Thread slab to its compiled floor, is refused
# one more, donates a page to `SlabKind.Threads`, and is then given it, which
# proves the ceiling moved. Then the thread living in the donated extent is
# started, yields three times and exits with a value the joiner reads, so the
# context-switch path is exercised on a frame in donated memory.
#
# It needs no child and no device, only a pool to cut the donation out of, which
# is the runner's `"pool": True`.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
