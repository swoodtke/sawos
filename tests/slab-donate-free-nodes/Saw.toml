[package]
name = "slab-donate-free-nodes"
version = "0.1.0"

# Same reason as sos/root's: this image carries its own `__saw_rt_*` seams, out
# of the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# M5 UNIT 6a, GAP CLOSER 2 (sawos design 34, closing design 32's finding 6): the
# unit-5 + unit-6 composition, witnessed end to end. Root fragments its pool past
# `MAX_FREE_RANGES` using DONATIONS as separators — the only separator that costs
# neither a handle nor a Memory slot — watches a release leak for want of a node,
# donates a page to `SlabKind.FreeRanges`, and watches the identical release come
# home instead.
#
# riscv32 ONLY, and the package header says why: the construction needs cuts in
# strictly growing sizes (first fit would otherwise serve them out of the holes it
# just made), the step is one protection grain, and the other profile's grain is
# a thousand times larger than this one's.
#
# It needs no child and no device — only a POOL to cut from, which is the
# runner's `"pool": True`.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
