# What this process needs from a stock root: tools/sosimage/src/declaration.saw
# states the format. It has no heap: nothing it does allocates, from the
# start-up's console take to every `print`. In an image that names a console
# the builder gives it the console's inlet under `CONSOLE_TAG` after its own
# record.
format = 1
arena = 0

# `debug` for the line it writes through the kernel's debug print after a
# flush, and `process-self` for the start-up.
[[boot]]
name = "system"
kind = "system"
tag = 1
rights = ["debug", "process-self"]

# It holds its System, Process and main thread handles and the console's
# inlet, then two threads' handles and each thread's own, and a post's claim
# for as long as the post takes to release it: nine. The tenth row is the one
# the row-full check fills with a sibling of its Process handle.
[quota]
handles = 10
threads = 3
