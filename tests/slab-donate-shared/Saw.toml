[package]
name = "slab-donate-shared"
version = "0.1.0"

runtime = true

# M5 UNIT 6, THE NEGATIVE (sawos design 32, on design 25 D-6). The kernel never
# shares slab backing with user-reachable memory, and this is the case that says
# so: root mints a SIBLING handle onto the region it is about to donate — so the
# region's `refs` is 2, not 1 — and the donation ENDS IT.
#
# It is a fault rather than a status by design 178's split: root minted the
# sibling itself, so "this region has another name" is a condition it created and
# can see. `BadState` is the reason, and it prints as "object in the wrong
# state", which is the same wording `process_doublestart` asserts.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
