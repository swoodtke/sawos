[package]
name = "slab-donate-shared"
version = "0.1.0"

runtime = true

# The negative: the kernel never shares slab backing with user-reachable memory.
# Root mints a sibling handle onto the region it is about to donate, so the
# region's `refs` is 2, not 1, and the donation ends it.
#
# It is a fault rather than a status: root minted the sibling itself, so "this
# region has another name" is a condition it created and can see. `BadState` is
# the reason, and it prints as "object in the wrong state", the same wording
# `process_doublestart` asserts.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
