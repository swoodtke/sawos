# What this process needs from a stock root: tools/sosimage/src/declaration.saw
# states the format. In an image that names a console the builder gives it
# the console's inlet under `CONSOLE_TAG` after its own record.
format = 1
arena = 0

# `debug` for its reports, which cannot go to a console that is gone, and
# `process-self` for the start-up. An image may narrow its other processes'
# rights; this record names its own.
[[boot]]
name = "system"
kind = "system"
tag = 1
rights = ["debug", "process-self"]

# Its System, Process and main thread handles and the console's inlet, and
# two rows its row-full step fills with siblings of its Process handle.
[quota]
handles = 6
