[package]
name = "event-consume"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# A root server that reads Events through the blocking door without ever
# blocking (spec.md §2.2, §2.4). One thread, so nothing here is about
# scheduling: every wait finds something already ready and answers at once. It
# proves that a wait delivery takes the accumulated word: the merged word, once,
# and only the bits that arrived since the last take. The parking half is
# `event-consume-wake`.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
