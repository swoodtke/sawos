[package]
name = "map-placed"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# Placement, witnessed. One region, two address spaces, two different addresses,
# and both processes read and write the same bytes through their own.
#
# aarch64 only, which is the point rather than a limitation. riscv32 keeps
# identity placement, so there the two addresses would be one address and the
# case would assert nothing. The runner's `arches` key says so.
#
# It needs no `poolbase_*.c`. Every older map case learns its address from a
# build-time constant that only works because it was told the answer. This one
# asks the kernel (`Mapping.base()`) and would keep working if the placement
# policy changed.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
