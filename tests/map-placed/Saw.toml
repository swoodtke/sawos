[package]
name = "map-placed"
version = "0.1.0"

# Same reason as sos/root's: this image carries its own `__saw_rt_*` seams, out
# of the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# **PLACEMENT, WITNESSED** (sawos design 33, M5 unit 2). One region, two address
# spaces, TWO DIFFERENT ADDRESSES — and both processes read and write the same
# bytes through their own. This is the case §5.5's old law forbade: an address
# was the same number in every process, so "shared at per-process addresses" was
# not a sentence the system could say.
#
# **AARCH64 ONLY, and that is the point rather than a limitation.** riscv32 keeps
# identity placement deliberately (design 25 ruling 11), so there the two
# addresses would be one address and the case would assert nothing. The runner's
# `arches` key is what says so, and it is also what keeps this unit's riscv32
# transcript byte-identical.
#
# **IT NEEDS NO `poolbase_*.c`, WHICH IS THE OTHER HALF OF THE CLAIM.** Every
# older map case learns its address from a build-time constant that only works
# because it was told the answer. This one asks the kernel — `Mapping.base()` —
# and would keep working if the policy changed tomorrow.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
