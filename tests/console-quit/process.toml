# What this driver needs from a stock root: tools/sosimage/src/declaration.saw
# states the format.
format = 1
arena = 0x1000

# `debug` for what it serves and its own line, both written through the
# kernel's debug print, and `process-self` for its Process handle: in an image
# that names a console, a record naming no rights has no `debug`.
[[boot]]
name = "system"
kind = "system"
tag = 1
rights = ["debug", "process-self"]

[[boot]]
name = "uart"
kind = "serve"
protocol = "uartproto"
tag = 2

# Its System, Process and Waiter, the request being served and the handles a
# request may carry: `drivers/svc-console`'s count, less the main thread's
# own handle its start-up holds.
[quota]
handles = 8
waiters = 1
