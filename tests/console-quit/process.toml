# What this driver needs from a stock root: tools/sosimage/src/declaration.saw
# states the format.
format = 1
arena = 0x1000

[[boot]]
name = "system"
kind = "system"
tag = 1

[[boot]]
name = "uart"
kind = "serve"
protocol = "uartproto"
tag = 2

# Its System, Process and Waiter, the request being served and the handles a
# request may carry, as `drivers/svc-console`'s.
[quota]
handles = 8
waiters = 1
