[package]
name = "process-doublestart"
version = "0.1.0"

runtime = true

# THE OTHER HALF OF THE TWO-PHASE LIFECYCLE'S RULING (sawos design 2 D-4; ruled
# Aug 16): a SECOND `start()` is a fault, not a status. Where `process-badimage`
# beside it shows the one thing a launcher may get wrong and survive, this shows
# the line's other side — starting a process twice is broken code, and the
# caller is the one that started it the first time.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/root.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
