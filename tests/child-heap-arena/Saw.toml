[package]
name = "child-heap-arena"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# A heap child with an 8 KiB arena, behind its default heap: each
# `linker-script` names a script of the package's own that sets
# `ARENA_SIZE`. The roles are `heapkit`'s.
[dependencies]
sos = { path = "../../kernel/sysapi" }
heapkit = { path = "../heapkit" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "arena-8k.riscv32.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "arena-8k.arm64.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"

[sos.xtensa-esp-unknown-elf]
linker-script = "arena-8k.xtensa.ld"
native = "../../hal/xtensa-esp32s3/user/syscall.c ../../rt/common_c/support.c"
