[package]
name = "xtensa-main-windowed"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# A windowed child written with `main` beside `death-notify`'s call0 Saw root:
# its program, `sosmain`'s start-up and the runtime are built whole for the
# windowed ABI, as `xtensa-windowed-saw-child` is. It returns 5 when its
# chain's answer is right, 6 when it is not.
[dependencies]
sos = { path = "../../kernel/sysapi" }
sosmain = { path = "../../rt/main" }
winsaw = { path = "../winsaw" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.xtensa-esp-unknown-elf]
linker-script = "../../hal/xtensa-esp32s3/user/user.ld"
native = "../../hal/xtensa-esp32s3/user/syscall.c ../../rt/common_c/support.c ../winsaw/window.c"
target-features = "+windowed"
