[package]
name = "give-after-start"
version = "0.1.0"

runtime = true

# THE BOOT SET FREEZES AT START (sawos design 4): the give-before-start ordering
# IS the soundness argument for the whole launch flow, and this is the case that
# holds it. Dynamic transfer is M4 IPC's job, over pipes, to a process expecting
# it.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/root.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
