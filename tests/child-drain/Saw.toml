[package]
name = "child-drain"
version = "0.1.0"

# Same reason as sos/root's: this image carries its own `__saw_rt_*` seams, out
# of the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# THE FURNISHED CHILD (sawos design 4, as ruled Aug 29) — the first SOS process
# that is neither root nor a sandboxed compute process, and the first that ever
# spoke. It receives a MASKED SYSTEM HANDLE in its first argument register and
# bootstraps exactly as root does (§12's symmetry): derive its own Process
# object, drain the boot set its launcher filled with `give`, report on the
# console, exit with a code.
#
# IT OWNS NO DEVICE AND DRIVES NO UART. `Debug` was in the keep mask its
# launcher minted the handle through, so the authority to print arrived as a
# capability — which is the whole difference between this and every child before
# it. What the mask left out (`Shutdown`, `ProcessCreate`, `Transfer`, `Mint`) is
# what it cannot do, and `child-oversteps` is the case that proves one of them.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/child.ld"
native = "../../hal/riscv32/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/child.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
