[package]
name = "map-into-child"
version = "0.1.0"

runtime = true

# Mapping across a process boundary: a launcher maps a region into a child it
# has created but not started, and the child touches memory its image never
# declared.
#
# A mapping is not a boot record, which is what makes this legal before `start`:
# the give-freeze (§12's "the boot set freezes at start") governs handles
# arriving in the child's table, and a protection row is not one. Both orderings
# work; mapping first is what a launcher would do.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

# `poolbase_<arch>.c` is where the pool is; see `tests/poolbase_riscv32.c`. The
# child package names the same file, so the two halves of one config agree about
# an address the kernel never interprets.
[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c ../poolbase_riscv32.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c ../poolbase_arm64.c"
