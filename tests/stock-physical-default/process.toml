# What this child needs from a stock root: tools/sosimage/src/declaration.saw
# states the format. It has no `[ceilings]`, and its pool record names no
# rights, so it is given the defaults, which leave out the opt-in `physical`.
format = 1
arena = 0x2000

[[boot]]
name = "system"
kind = "system"
tag = 1
rights = ["debug", "process-self"]

[[boot]]
name = "dma"
kind = "memory"
tag = 2
