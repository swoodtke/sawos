[package]
name = "child-window-probe"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# A child that reads device pages, for the arm64 protection tables: given a
# virtio-mmio window, it maps it and reads the page it was granted and then the
# page at the same index in the console's block, which it was not; given
# nothing, it reads the transport page it holds no grant for. Each unmapped
# read ends the process by a fault, which is the case's evidence.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
