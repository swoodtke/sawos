[package]
name = "child-quota-twoseg"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# A child with two loadable segments instead of three, so its image spends
# one grant row fewer than every other test image and its domain has one more
# free row. Each profile's script is the common child script with `.rodata`
# folded into `.text`.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "twoseg.riscv32.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "twoseg.arm64.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
