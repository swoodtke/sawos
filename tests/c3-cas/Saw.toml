[package]
name = "c3-cas"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# The `cas` smoke case: a compare-and-swap through `Atomic<Int>`, which on a
# part with no A extension is the `__atomic_compare_exchange_4` libcall that
# rt/common_c/support.c defines.
#
# This is a separate package from the virt profile's cases for the same reason
# as `c3-timer`: a package names one linker script per target triple, and the
# C3 profile shares `riscv32-unknown-none-elf` with virt.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32-esp32c3/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

# The no-A build spelling (hal/riscv32-esp32c3/ABI.md §3): Blade's default for
# a riscv32 triple includes `+a`, which the ESP32-C3 lacks, so all three keys
# are restated here.
march = "rv32imc_zicsr_zifencei"
mabi = "ilp32"
target-features = "+m,+c"
