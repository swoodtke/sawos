[package]
name = "map-basics"
version = "0.1.0"

runtime = true

# M3 UNIT 4's HEADLINE (sawos design 6 D-3): an address that faulted yesterday
# is memory today — the inverse of every protection proof in this suite so far.
# Root splits a pool, MAPS a piece into ITSELF, writes and reads it, and then
# DOUBLE-MAPS the same region read-only as a second Mapping (agenda item 7's
# lean, shown).
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

# `poolbase_<arch>.c` is WHERE THE POOL IS — see `tests/poolbase_riscv32.c`.
[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32/user/syscall.c ../../rt/common_c/support.c ../poolbase_riscv32.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/root.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c ../poolbase_arm64.c"
