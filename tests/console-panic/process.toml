# What this process needs from a stock root: tools/sosimage/src/declaration.saw
# states the format. It has no heap: nothing it does allocates, its panic
# included. In an image that names a console the builder gives it the
# console's inlet under `CONSOLE_TAG` after its own record.
format = 1
arena = 0

# `process-self` for the start-up. Its lines go to the console and its panic
# to the kernel's fault line, so it needs no `Debug`.
[[boot]]
name = "system"
kind = "system"
tag = 1
rights = ["process-self"]

# What it does: `src/main.saw` names the roles.
[build]
inputs = ["panicrole"]
defaults = { panicrole = "config/default.saw" }
