[package]
name = "map-wx-refused"
version = "0.1.0"

# Same reason as sos/root's: this image carries its own `__saw_rt_*` seams, out
# of the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# W^X, PER ROW (sawos design 9 D-1). This root double-maps ONE region — read-write
# here, read-execute there, which is the sanctioned JIT-shaped pattern and costs
# it nothing — and then asks for both permissions in a SINGLE row through the
# same full pool handle. The last ask ends the process, which is how a caller-
# checkable `BadArg` is asserted.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32/user/syscall.c ../../rt/common_c/support.c ../poolbase_riscv32.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/root.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c ../poolbase_arm64.c"
