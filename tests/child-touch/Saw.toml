[package]
name = "child-touch"
version = "0.1.0"

runtime = true

# THE CHILD `map-into-child` LAUNCHES (sawos design 6 D-3). It writes and reads
# a byte at an address ITS OWN IMAGE NEVER DECLARED — memory that exists in its
# domain only because its launcher installed a row there — and reports what it
# read.
#
# It is linked with `child.ld` rather than `root.ld`: a child loads at the
# destination region its launcher supplies, which is one region above root's.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/child.ld"
native = "../../hal/riscv32/user/syscall.c ../../rt/common_c/support.c ../poolbase_riscv32.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/child.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c ../poolbase_arm64.c"
