[package]
name = "child-touch"
version = "0.1.0"

runtime = true

# The child `map-into-child` launches. It writes and reads a byte at an address
# its own image never declared (memory that exists in its domain only because
# its launcher installed a row there) and reports what it read.
#
# On riscv32 it is linked with `child.ld` rather than `root.ld`: a child loads
# at the destination region its launcher supplies, which is one region above
# root's. arm64 links it with `user.ld`.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/child.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c ../poolbase_riscv32.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c ../poolbase_arm64.c"
