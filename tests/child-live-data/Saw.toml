[package]
name = "child-live-data"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# A child that holds a known pattern in its writable data, tells its launcher
# it is running, parks until the launcher says go, and reports whether the
# pattern is still what it wrote. The arena is small so the whole image sits in
# the low part of the region it was created in; each target names a script of
# its own that sets `ARENA_SIZE` and includes the shared one
# (`tests/arena-small` is the worked example).
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "child-live-data.riscv32.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c witness.c"

[sos.aarch64-unknown-none-elf]
linker-script = "child-live-data.arm64.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c witness.c"
