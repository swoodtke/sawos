# What this child needs from a stock root: tools/sosimage/src/declaration.saw
# states the format. Each record is given with the rights it names, within the
# ceiling its table lists.
format = 1
arena = 0x2000

[[boot]]
name = "system"
kind = "system"
tag = 1
rights = ["debug", "process-self"]

[[boot]]
name = "alarm"
kind = "window"
type = "goldfish-rtc"
part = true
tag = 2
rights = ["map"]

[ceilings]
process = ["boot-handles", "exit"]
iomemory = ["carve", "map"]
