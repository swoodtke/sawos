[package]
name = "stock-shape-carve"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# A child of the gate's `stock_record_shapes` image
# (`tests/images/stock_record_shapes.toml`) on the riscv32 `virt` board: it
# holds a carve of one RTC register, each given with the rights its declaration names, and prints
# the rights it holds (`tests/stockkit`).
[dependencies]
sos = { path = "../../kernel/sysapi" }
stockkit = { path = "../stockkit" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/user.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"
