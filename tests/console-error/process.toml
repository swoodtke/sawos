# What this process needs from a stock root: tools/sosimage/src/declaration.saw
# states the format. In an image that names a console the builder gives it
# the console's inlet under `CONSOLE_TAG` after its own record.
format = 1

# The entry renders `main`'s error into a `String` for its `error:` line,
# which allocates.
arena = 0x1000

# `process-self` for the start-up. Its lines go to the console, so it needs no
# `Debug`.
[[boot]]
name = "system"
kind = "system"
tag = 1
rights = ["process-self"]
