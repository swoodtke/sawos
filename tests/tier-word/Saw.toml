[package]
name = "tier-word"
version = "0.1.0"

runtime = true

# SOS M5 UNIT 4 (sawos design 35): the platform advertises what it can DENY.
# The program asks its System object for the tier word and prints it. It needs
# no pool, no children and no memory of its own — the whole point of the op is
# that it reads a fact rather than spending a resource.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
