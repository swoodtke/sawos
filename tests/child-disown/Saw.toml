[package]
name = "child-disown"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# One program in two roles, chosen by the boot set its launcher gives it.
#
# The charger leaves shared objects charged to it behind: a connection, two
# regions split off the launcher's pool and a window carved off a device view,
# all posted to its launcher in one message before it exits. Its death
# disowns them.
#
# The probe runs in the charger's reused slot and reads its own ledger back
# through what it is refused, after its launcher has freed and donated the
# disowned objects. A refund that reached it would let it make one more of a
# kind than its allowance.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/child.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
