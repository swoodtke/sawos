[package]
name = "stats-region-ro"
version = "0.1.0"

runtime = true

# SOS M5 UNIT 7 (sawos design 37): the READ-ONLY half of the stats region,
# proved the only way a denial can be proved — by dying on it.
#
# The program maps the region, reads a column to show the row is really
# installed, and then stores into it. On an isolated tier the hardware refuses
# and the process ends; the flat tier disclaims hardware denial by name (design
# 19/35), which is why the case that runs this is ISOLATED-ONLY.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
