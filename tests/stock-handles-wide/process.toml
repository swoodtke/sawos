# What this child needs from a stock root: tools/sosimage/src/declaration.saw
# states the format. Its `Handle` row is 48, past the body's table, which the
# builder gives it a handle block for; its System handle keeps `debug` and
# `process-self`.
format = 1
arena = 0x1000

[[boot]]
name = "system"
kind = "system"
tag = 1
rights = ["debug", "process-self"]

[quota]
handles = 48
