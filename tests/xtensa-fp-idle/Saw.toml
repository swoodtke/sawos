[package]
name = "xtensa-fp-idle"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# A root whose child is ended during the idle wait with an FP thread
# outgoing, then a thread of root's own that parks with its FP state live.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 2, high = 3 }

# The ESP32-S3 only: the FP helpers are Xtensa assembly.
[sos.xtensa-esp-unknown-elf]
linker-script = "../../hal/xtensa-esp32s3/user/user.ld"
native = "../xtensa/fp_state.S ../../hal/xtensa-esp32s3/user/syscall.c ../../rt/common_c/support.c"
