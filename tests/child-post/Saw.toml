[package]
name = "child-post"
version = "0.1.0"

# Same reason as sos/root's: this image carries its own `__saw_rt_*` seams, out
# of the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# **THE FIRST SOS PROCESS TO SEND ANYTHING** (sawos design 13 D-3, M4 unit 1).
# It bootstraps exactly as every other child does — a masked System handle in a0,
# its own Process object derived from it, its boot set drained from there — and
# the one new thing in the set is a `PipeInlet`, the client end of a connection
# its launcher created and kept the other half of.
#
# It has no `PipeCreate` right and no way to name its launcher's connection: it
# can post because it was HANDED an end, which is what makes this a capability
# story rather than a naming one.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/child.ld"
native = "../../hal/riscv32/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/child.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
