[package]
name = "echo-child"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# One of three echo children. Each says a line and exits with its own code, so a
# launcher can tell which one ran; the three are identical apart from that code
# and their riscv32 linker script.
#
# The three packages exist because riscv32 places by identity. A child image
# runs at exactly the base it was linked at there, so three concurrent children
# need three load addresses and therefore three scripts, and a package's
# manifest picks one script. On aarch64 every user image links at one canonical
# base and the kernel translates, so all three name the same `user.ld`. The
# runner assigns destination regions by index, so this package must be listed
# first.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/child.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
