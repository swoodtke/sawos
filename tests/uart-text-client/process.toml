# What this client needs from a stock root: tools/sosimage/src/declaration.saw
# states the format.
format = 1
arena = 0x2000

[[boot]]
name = "system"
kind = "system"
tag = 1

[[boot]]
name = "uart"
kind = "client"
protocol = "uartproto"
tag = 2

# It holds, at the most, seven: its System, Process and inlet, and either the
# claims of the four reads it posts or four Events (the ones it sends in one
# request, then the ones that fill its table), made after the claims are gone.
[quota]
handles = 7
events = 4
