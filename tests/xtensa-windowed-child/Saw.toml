[package]
name = "xtensa-windowed-child"
version = "0.1.0"

# A windowed C child of `death-notify`'s root that exits with code 5 from 30
# frames deep: act 1 of `child.c`, chosen by `child.ld`. The Saw file is empty
# (see its header), so no Saw is compiled windowed into the image.
[dependencies]

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.xtensa-esp-unknown-elf]
linker-script = "child.ld"
native = "../../hal/xtensa-esp32s3/user/syscall.c child.c child.S"
target-features = "+windowed"
