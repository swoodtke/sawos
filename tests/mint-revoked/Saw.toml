[package]
name = "mint-revoked"
version = "0.1.0"

runtime = true

# **PROLIFERATION IS REVOCABLE** (sawos design 4, as ruled Aug 29). `MINT_OP` is
# gated on the universal `Mint` bit, and that bit is itself something a keep mask
# can leave out — so a launcher hands out a sibling that cannot mint again, and
# the chain stops exactly where it said it would. Without that property a single
# `Mint` anywhere would be `Mint` everywhere downstream, forever.

[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/root.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
