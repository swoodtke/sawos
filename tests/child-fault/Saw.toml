[package]
name = "child-fault"
version = "0.1.0"

# Same reason as sos/root's: this image carries its own `__saw_rt_*` seams, out
# of the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# A CHILD PROCESS (sawos design 2) — the first image in SOS that the KERNEL does
# not load at boot. It is built exactly as root is and linked at a DIFFERENT
# base (`child.ld`), because under the no-translation contract every process
# shares one physical address space and two images cannot occupy one range.
#
# IT HOLDS NO HANDLES, and that is what it is for. `start()` hands its first
# thread `NO_HANDLE` in the argument register (unit 3's `give` is what changes
# that), so this process cannot print, cannot exit and cannot make a syscall
# that resolves — the ruled "legal-but-doomed" sandboxed compute process. What
# it does is TRY, which is how it dies: a syscall on handle 0 is a `BadHandle`
# fault, and the kernel's report is this case's evidence that a child died
# without taking the machine with it.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/child.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
