[package]
name = "child-fault"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# A child process, built exactly as root is. On riscv32 it is linked at a
# different base (`child.ld`), because that profile does not translate: every
# process shares one physical address space and two images cannot occupy one
# range. arm64 links it with `user.ld`.
#
# It holds no handles. `start()` hands its first thread `NO_HANDLE` in the
# argument register, so this process cannot print, cannot exit and cannot make a
# syscall that resolves: a sandboxed compute process that can only try, and a
# syscall on handle 0 is a `BadHandle` fault. The kernel's report of that fault
# is the case's evidence that a child died without taking the machine down.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/child.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"

[sos.xtensa-esp-unknown-elf]
linker-script = "../../hal/xtensa-esp32s3/user/child.ld"
native = "../../hal/xtensa-esp32s3/user/syscall.c ../../rt/common_c/support.c"
