[package]
name = "uart-echo-pl011"
version = "0.1.0"

# Same reason as sos/root's: this image carries its own `__saw_rt_*` seams, out
# of the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# THE USERSPACE UART ECHO DRIVER (design 178 option A's proof), for the board
# whose console is a PL011. Same program as the ns16550 package beside it, and
# the DIFFERENCES ARE THE DEVICE: a wider register file, the opposite sense on
# the ready flags, an interrupt mask register instead of an enable bit, and a
# control register the driver has to turn on itself.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

# **`device-window` IS GONE — THE MIGRATION LANDED** (sawos design 6 D-6). See
# the ns16550 package beside this one for the whole argument; the window is now
# an `IoMemory` this driver receives in its boot set and maps into itself.
#
# The DEVICE memory attribute (nGnRE) is unchanged and is now a property of the
# OBJECT KIND rather than of a segment flag: an `IoMemory` can only ever produce
# a device-attribute row, so a cached view of a register block — a correctness
# bug, not a performance one — is unreachable by construction rather than by a
# flag the loader honoured. See `sos/hal/arm64/kernel`.
[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
