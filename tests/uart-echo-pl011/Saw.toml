[package]
name = "uart-echo-pl011"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# The userspace UART echo driver, for the board whose console is a PL011. Same
# program as the ns16550 package beside it; the differences are the device: a
# wider register file, the opposite sense on the ready flags, an interrupt mask
# register instead of an enable bit, and a control register the driver has to
# turn on itself.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

# The window is an `IoMemory` this driver receives in its boot set and maps into
# itself; see the ns16550 package beside this one.
#
# The device memory attribute (nGnRE) is a property of the object kind rather
# than of a segment flag: an `IoMemory` can only ever produce a device-attribute
# row, so a cached view of a register block, a correctness bug rather than a
# performance one, is unreachable by construction. See `hal/arm64/kernel`.
[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
