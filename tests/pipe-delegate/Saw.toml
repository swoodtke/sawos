[package]
name = "pipe-delegate"
version = "0.1.0"

# Same reason as root's: this image carries its own `__saw_rt_*` seams, out of
# the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# **THE DELEGATION PRIMITIVE, ACROSS A REAL PROCESS BOUNDARY** (spec §2.1's
# ratified zero-copy example; sawos design 14). Root asks a question of itself,
# takes the obligation off its own outlet, and GIVES that obligation to a child.
# The child answers, and the bytes land at root's claim — which is the seed of
# unit 4's in-message delegation, with a `give` standing in for the message a
# request handle will one day travel in.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/root.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
