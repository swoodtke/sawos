[package]
name = "child-far"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# The far end of a three-process delegation. It answers an obligation that
# arrived in a message, over a connection whose other end belongs to a process
# it was never told about, and the bytes land in a third process's parked call.
#
# It is the second child of `delegate-3p`, so on riscv32 it is linked at the
# second child base (`child2.ld`): the runner assigns destination regions by
# index, so the script a package picks is a contract with the order its case
# lists it in. arm64 translates and links it with `user.ld`.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/child2.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
