[package]
name = "child-far"
version = "0.1.0"

# Same reason as sos/root's: this image carries its own `__saw_rt_*` seams, out
# of the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# **THE FAR END OF A THREE-PROCESS DELEGATION** (sawos design 21, M4 unit 5). It
# answers an obligation that arrived in a message, over a connection whose other
# end belongs to a process it was never told about — and the bytes land in a
# THIRD process's parked call.
#
# It is the SECOND child of `delegate-3p`, so it is linked at the second child
# base (`child2.ld`): the runner assigns destination regions by index, so the
# script a package picks is a contract with the order its case lists it in.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/child2.ld"
native = "../../hal/riscv32/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/child2.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
