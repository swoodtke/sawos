[package]
name = "console-no-debug"
version = "0.1.0"

runtime = true

# A root that gives the console driver a System handle without `Debug`, and
# holds that the driver refuses to start.
[dependencies]
sos = { path = "../../kernel/sysapi" }
uartproto = { path = "../../drivers/uartproto" }
uartpipe = { path = "../../drivers/uartpipe" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/user.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"
