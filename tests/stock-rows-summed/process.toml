# What this child needs from a stock root: tools/sosimage/src/declaration.saw
# states the format. Its `Thread` row is 9, past what the board's
# default total holds for two instances; the image `tests/images/
# stock_rows_summed.toml` raises one instance's to 10. Its System handle keeps
# `debug` and `process-self`.
format = 1
arena = 0x1000

[[boot]]
name = "system"
kind = "system"
tag = 1
rights = ["debug", "process-self"]

[quota]
threads = 9
handles = 20
