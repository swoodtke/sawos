[package]
name = "map-unmap"
version = "0.1.0"

runtime = true

# M3 UNIT 4's REVOCATION PROOF (sawos design 6 D-3): unmap, then the touch
# FAULTS — the live-domain reload proven end to end, and in the direction that
# matters. An `unmap` that returned Ok and left the window open until some later
# reschedule would be a revocation that did not revoke.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

# `poolbase_<arch>.c` is WHERE THE POOL IS — see `tests/poolbase_riscv32.c`.
[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c ../poolbase_riscv32.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/root.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c ../poolbase_arm64.c"
