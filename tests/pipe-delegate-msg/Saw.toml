[package]
name = "pipe-delegate-msg"
version = "0.1.0"

# Same reason as root's: this image carries its own `__saw_rt_*` seams, out of
# the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# **THE DELEGATION PRIMITIVE, ARRIVING AS A MESSAGE** (sawos design 18, M4 unit
# 4; spec §2.1's ratified zero-copy example). Root asks a question of itself,
# takes the obligation off its own outlet, and POSTS THAT OBLIGATION through a
# second connection to a child. The child replies, and the bytes land at root's
# ORIGINAL claim — a one-shot crossing a process boundary inside a message rather
# than at launch time.

[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
