[package]
name = "process-bootdrain"
version = "0.1.0"

runtime = true

# THE BOOT-HANDLE ITERATOR (sawos design 2 D-3 — unit 3's `boot_handle_next`,
# pulled forward because root is its first consumer). Root drains its boot set
# to exhaustion, asserts what it got against its own config, and asks once more
# to show that a drained iterator STAYS drained.
#
# It creates no process at all: the claim under test is the DELIVERY, and mixing
# it with a launch would let an iterator bug hide behind a load that happened to
# work.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
