# What this claimant needs from a stock root: tools/sosimage/src/declaration.saw
# states the format. It is the image's console, which the stock root gives the
# console claim.
format = 1
arena = 0x1000
# Its looping thread runs at `Rt0`.
bands = "full"

# `console` for the claim, `debug` for what `slow` prints once it has
# released, `process-self` for its Process handle and `clock-get` for the
# Clock `slow` paces itself by.
[[boot]]
name = "system"
kind = "system"
tag = 1
rights = ["debug", "process-self", "clock-get", "console"]

[[boot]]
name = "uart"
kind = "serve"
protocol = "uartproto"
tag = 2

# Its handles: its System, its Process, its main thread's own Thread handle,
# the outlet, two Waiters and either an Event (`stall`), a thread's two
# (`loop`) or a Clock and a Timer (`slow`): nine at the most. A take needs room
# for the obligation it mints and for every handle the request carries before
# it mints any, so the most it holds is those, the request it holds, and the
# request being taken with the `PIPE_MSG_HANDLES` it carries: fifteen.
[quota]
handles = 15
threads = 2
waiters = 2
events = 1
timers = 1

[build]
inputs = ["stallconfig"]
defaults = { stallconfig = "config/stall.saw" }
