# What this client needs from a stock root: tools/sosimage/src/declaration.saw
# states the format.
format = 1
arena = 0x2000

[[boot]]
name = "system"
kind = "system"
tag = 1

[[boot]]
name = "gpio"
kind = "client"
protocol = "gpioproto"
tag = 2

# It holds, at the most, its System, Process, Waiter, Timer, Clock and
# inlet, and the four claims it keeps posted beside a fifth call.
[quota]
handles = 16
