[package]
name = "pipe-bad-mode"
version = "0.1.0"

# Same reason as root's: this image carries its own `__saw_rt_*` seams, out of
# the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# **A FLAGS WORD OUTSIDE ITS DOMAIN** (spec §5.7; sawos design 15). `WaiterOp.Add`
# grew a flags argument in M4 unit 3 and published exactly two bits; a word
# carrying any other is a caller-checkable mistake, so it is a FAULT. It reaches
# the C altitude because the typed `AttachMode` cannot spell an invalid mode —
# which is the typed layer working, and is why the kernel's check needs a case.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/root.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
