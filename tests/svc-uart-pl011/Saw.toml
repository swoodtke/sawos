[package]
name = "svc-uart-pl011"
version = "0.1.0"

# Same reason as sos/root's: this image carries its own `__saw_rt_*` seams, out
# of the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# **THE UART AS A SERVICE** (sawos design 21, M4 unit 5 — the money shot), for
# the board whose console is a PL011. It is `child-echo-pl011` beside it with a
# SERVER FACE, and it is the `svc-uart-ns16550` package with one register block
# swapped: same protocol, same serve loop, same trap accounting, a different
# datasheet. A driver names its device; a launcher names neither.
[dependencies]
sos = { path = "../../kernel/sysapi" }
uartproto = { path = "../uartproto" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/child.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
