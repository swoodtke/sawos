[package]
name = "pipe-send-manual"
version = "0.1.0"

# Same reason as root's: this image carries its own `__saw_rt_*` seams, out of
# the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# **THE BLOCKING SEND, WRITTEN OUT OF THE PRIMITIVES, AND THE ONLY CASE IN THE
# UNIT THAT REALLY PARKS** (sawos design 15; spec §2.1's ratified client API,
# `designs/010` ruling 4). There is no library `send`: the composition is four
# calls this program makes itself. Root sends to a CHILD server and its thread
# genuinely blocks until the child's reply wakes it; then it sends into a
# connection nobody serves, with a Timer on the SAME Waiter, and resolves the
# race by the KEY the wait answers with.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/root.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
