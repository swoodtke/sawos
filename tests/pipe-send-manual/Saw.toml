[package]
name = "pipe-send-manual"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# The blocking send, written out of the primitives (spec.md §2.1's client API).
# There is no library `send`: the composition is four calls this program makes
# itself. Root sends to a child server and its thread genuinely blocks until the
# child's reply wakes it; then it sends into a connection nobody serves, with a
# Timer on the same Waiter, and resolves the race by the key the wait answers
# with.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
