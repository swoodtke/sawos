[package]
name = "driver-child"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# The launcher that hands over a device. It drains the console UART's register
# page out of its own boot set as an `IoMemory`, creates a child, gives the
# window away, furnishes a masked System handle beside it, starts the child and
# parks on its death.
#
# It is arch-free and the child is not. A driver names its device, so there are
# two child packages named for the chip; this launcher names none, because what
# it moves is a capability and a capability has no datasheet. Policy is
# arch-free; only the driver knows what a UART is. The window and the line both
# arrive as capabilities, and the line number root binds it by is the one board
# fact linked per target (`tests/irq-lines`).
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c ../irq-lines/riscv32.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c ../irq-lines/arm64.c"
