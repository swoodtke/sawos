[package]
name = "driver-child"
version = "0.1.0"

# Same reason as sos/root's: this image carries its own `__saw_rt_*` seams, out
# of the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# THE LAUNCHER THAT HANDS OVER A DEVICE (sawos design 9 D-2, M3 unit 6's money
# shot). It drains the console UART's register page out of its own boot set as
# an `IoMemory`, creates a child, GIVES the window away, furnishes a masked
# System handle beside it, starts the child and parks on its death.
#
# **IT IS ARCH-FREE, AND THE CHILD IS NOT.** A driver names its device, so there
# are two child packages named for the chip; this launcher names none, because
# what it moves is a CAPABILITY and a capability has no datasheet. That
# asymmetry is the unit's claim in the package list: policy is arch-free, and
# only the driver knows what a UART is.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/root.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
