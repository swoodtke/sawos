[package]
name = "pipe-handles"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# Handles in a message (spec.md §2.1's `send(data?, handles?)`), with the handle
# ledger observed. Root sends a connection end to a child inside a message and
# counts its own free table slots at three moments: one more after the post (the
# post unbound the sent entry), and the same number after the child takes (the
# mint lands in the child's table). The child posts through what it was sent.
# The reply direction is shown by `pipe-delegate-msg`.

[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
