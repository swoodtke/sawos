[package]
name = "pipe-handles"
version = "0.1.0"

# Same reason as root's: this image carries its own `__saw_rt_*` seams, out of
# the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# **HANDLES IN MESSAGES, BOTH DIRECTIONS, WITH THE LEDGER OBSERVED** (sawos
# design 18, M4 unit 4; spec §2.1's `send(data?, handles?)`; `designs/010`
# ruling 5). Root sends a connection END to a child inside a message and counts
# its own free table slots on each side of the rendezvous: unchanged after the
# post, one MORE after the child takes. The child posts through what it was sent
# and returns a sibling of it on its reply.

[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
