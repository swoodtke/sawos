[package]
name = "heapkit"
version = "0.1.0"

# The heap cases' launcher and child, as a library: no `emit`, no linker
# script, no `runtime`. Each heap case's root and each heap child depends on
# it and calls it from its `_start`.
[dependencies]
sos = { path = "../../kernel/sysapi" }
bootplan = { path = "../../root/bootplan" }
