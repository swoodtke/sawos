[package]
name = "child-placed"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# The other half of `map-placed`. It is given a `Memory` capability, maps it
# into itself (the driver-child direction: "hand over authority" rather than
# "hand over access") and asks the kernel where the row was placed. The address
# it gets is not the one its launcher got for the same region, which is the
# whole claim.
#
# It is not linked at a child base; every image on this board links at
# `hal.USER_IMAGE_BASE`. The kernel loads this one into whatever frames its
# launcher supplied and maps them at that same canonical address. `user.ld`
# below is the one user script arm64 has.
#
# aarch64 only, for its launcher's reason.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
