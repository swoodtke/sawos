[package]
name = "pipe-send-exit"
version = "0.1.0"

# Same reason as root's: this image carries its own `__saw_rt_*` seams, out of
# the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# **A CAPABILITY OUTLIVES THE PROCESS THAT SENT IT** (sawos design 18, M4 unit 4;
# `designs/010` ruling 5 as re-ruled Sep 2 — take-at-post). The child posts a
# message carrying a connection END and exits immediately; root WAITS FOR THE
# DEATH, then takes, then posts through what arrived and reads its own byte back.
# The sender is `Gone` and its table is closed before the take happens, so the
# working capability at the end of it can only be one the kernel was holding.

[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
