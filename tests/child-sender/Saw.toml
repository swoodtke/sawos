[package]
name = "child-sender"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# A process that sends a capability and then dies. It posts one message carrying
# a connection end and exits at once, without waiting for anybody to take it.
# Its launcher takes the message after this process is gone and finds the
# capability alive, which is what take-at-post guarantees; the teardown count is
# the other half of the proof, because a handle this process had already given
# up is not one its teardown can close.

[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/child.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
