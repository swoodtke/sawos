[package]
name = "child-sender"
version = "0.1.0"

# Same reason as sos/root's: this image carries its own `__saw_rt_*` seams, out
# of the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# **THE PROCESS THAT SENDS A CAPABILITY AND THEN DIES** (sawos design 18, M4
# unit 4; `designs/010` ruling 5 as re-ruled Sep 2 — take-at-post). It posts one
# message carrying a connection END and exits at once, without waiting for
# anybody to take it. Its launcher takes the message AFTER this process is gone
# and finds the capability alive, which is the guarantee take-at-post exists to
# make; its TEARDOWN COUNT is the other half of the proof, because a handle this
# process had already given up is not one its teardown can close.

[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/child.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/child.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
