[package]
name = "svc-client"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# The process with no device authority. It reads and writes the console over a
# pipe, through `uartproto`, and holds no `IoMemory`, no `Mapping` and no
# `Interrupt`: the asymmetry with its sibling driver is the point.
#
# On riscv32 it is linked at the second child base (`child2.ld`), a contract
# with the case rather than a property of the program: the runner's
# `_region_rows` assigns destination regions by index, so a package linked there
# must be listed second by its case. arm64 translates and links it with
# `user.ld`.
[dependencies]
sos = { path = "../../kernel/sysapi" }
uartproto = { path = "../../drivers/uartproto" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/child2.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
