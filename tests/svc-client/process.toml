# What this client needs from a stock root: tools/sosimage/src/declaration.saw
# states the format. The tags are the ones `tests/uart-service` gives under.
format = 1
arena = 0x1_0000            # 64 KiB: the user link scripts' ARENA_SIZE

[[boot]]
name = "system"
kind = "system"
tag = 31

[[boot]]
name = "uart"
kind = "client"
protocol = "uartproto"
tag = 32
