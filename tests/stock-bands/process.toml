# What this child needs from a stock root: tools/sosimage/src/declaration.saw
# states the format. `bands = "full"` asks root for the identity band map, so
# a thread started at `Rt0` runs above one started at `High`. Its System
# handle keeps `debug` and `process-self`.
format = 1
bands = "full"

[[boot]]
name = "system"
kind = "system"
tag = 1
rights = ["debug", "process-self"]
