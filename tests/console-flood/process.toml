# What this client needs from a stock root: tools/sosimage/src/declaration.saw
# states the format. In an image that names a console the builder gives it
# the console's inlet under `CONSOLE_TAG` after its own records.
format = 1
arena = 0x1000

[[boot]]
name = "system"
kind = "system"
tag = 1
rights = ["process-self", "clock-get"]

# A second `uartproto` driver, which `floodconfig.AUX` tells a byte to.
[[boot]]
name = "aux"
kind = "client"
protocol = "uartproto"
tag = 2

# Its main thread and the hog's computing thread.
[quota]
threads = 2

[build]
inputs = ["floodconfig"]
defaults = { floodconfig = "config/flood.saw" }
