[package]
name = "stats-reader"
version = "0.1.0"

runtime = true

# THE CHILD `stats-region` LAUNCHES (sawos design 37, M5 unit 7) — the
# cross-process half of the `top` shape.
#
# It maps the same kernel page its launcher mapped and reads ITS LAUNCHER's row
# out of it: a process observing another process's traffic with no syscall, no
# handle onto that process, and nothing shared between them but a right its
# launcher chose to pass on.
#
# It is linked with `child.ld` rather than `root.ld` on the profile that places
# by identity: a child loads at the destination region its launcher supplies.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/child.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
