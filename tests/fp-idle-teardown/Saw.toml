[package]
name = "fp-idle-teardown"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# A root that lets a child's process end while the kernel idles, with the
# child's last running thread having used FP/SIMD, then runs a thread of its
# own that uses it.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 2, high = 3 }

# arm64 only: the FP/SIMD helpers are AArch64 assembly.
[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../arm64/fp_state.S ../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
