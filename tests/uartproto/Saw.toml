[package]
name = "uartproto"
version = "0.1.0"

# The /dev/uart0 protocol, as a package: one declaration a driver and its
# clients both compile against. A device's protocol is not the kernel's
# business, so it lives in userspace, in `tests/`, and not in the kernel's
# published surface (unlike `PIPE_BODY_BYTES`, which lives in `sosabi`).
#
# It is a library: no `emit`, no linker script, no `runtime`. Each package that
# depends on it carries its own seams.

[dependencies]
sos = { path = "../../kernel/sysapi" }
# For `ascii_byte`, so a line written through a driver's window and a line
# written through a System op agree about what a non-ASCII scalar becomes.
sosrt = { path = "../../rt/common" }
