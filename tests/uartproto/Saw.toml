[package]
name = "uartproto"
version = "0.1.0"

# **THE /dev/uart0 PROTOCOL, AS A PACKAGE** (sawos design 21, M4 unit 5). One
# declaration a driver and its clients both compile against — the argument
# `PIPE_BODY_BYTES` gets in `sosabi`, at the altitude a DEVICE protocol belongs
# at: userspace, in `tests/`, and nowhere near the kernel's published surface.
# The unit's brief forbids kernel/abi and sysapi growth precisely because a
# device's protocol is not the kernel's business; M5's namespace is what will
# give this one a path.
#
# It is a LIBRARY: no `emit`, no linker script, no `runtime` — three packages
# depend on it and each carries its own seams.

[dependencies]
sos = { path = "../../kernel/sysapi" }
# For `ascii_byte`, so a line written through a driver's window and a line
# written through a System op agree about what a non-ASCII scalar becomes.
sosrt = { path = "../../rt/common" }
