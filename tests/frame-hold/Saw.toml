[package]
name = "frame-hold"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# Two threads holding distinct values in every register the ESP32-S3 trap
# frame carries while ticks move the processor between them. The spin is
# assembly, in `hold.c`.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.xtensa-esp-unknown-elf]
linker-script = "../../hal/xtensa-esp32s3/user/root.ld"
native = "../../hal/xtensa-esp32s3/user/syscall.c ../../rt/common_c/support.c hold.c"
