[package]
name = "pipe-oneshot"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# The one-shot pair, end to end in one process (spec.md §2.1). Root creates a
# connection, holds both ends, and proves the whole request/reply exchange: a
# post answers a claim, a take answers the obligation, a reply is delivered to
# the claim that asked for it and to no other, and a ring slot lives until the
# exchange settles rather than until its bytes are taken.
#
# The last of those is what `pipe-basics` cannot show, because that case tells
# and drops at every step; here one exchange is deliberately left open and the
# ring is counted around it.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
