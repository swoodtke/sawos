[package]
name = "child-pool-leg"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# A child that does one thing to the pool it is given, chosen by its launcher,
# for `pool_faults`. It is linked as `child-ro-segment` is, with its read-only
# data above its writable data, so a word of that data lies inside its copy-out
# window and only the row's permission refuses a record there.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../child-ro-segment/ro.riscv32.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c ../child-ro-segment/ro_cell.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../child-ro-segment/ro.arm64.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c ../child-ro-segment/ro_cell.c"
