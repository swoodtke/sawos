[package]
name = "child-echo-ns16550"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# The userspace UART echo driver as a child, for the board whose console is an
# NS16550A. It is the `uart-echo-ns16550` package beside it with one difference:
# it is not root. It receives no boot region of its own (its window is a
# capability its launcher gave it), and it ends with `Process.exit` rather than
# `System.shutdown`, because a driver child holds no `SystemRight.Shutdown`.
#
# Its riscv32 section links `child.ld`, the line to compare with the
# root-as-driver twin's: riscv32 does not translate, so every process shares one
# physical address space and a child's image is linked where its launcher's
# config puts it.
#
# It is per-device, not per-architecture: a driver names its device, and the two
# SOS profiles have different UARTs. The pl011 package beside this one is the
# same program for the other.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/child.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"
