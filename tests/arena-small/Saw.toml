[package]
name = "arena-small"
version = "0.1.0"

# Same reason as sos/root's: this image carries its own `__saw_rt_*` seams, out
# of the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# SOS M5 ARENA UNIT (sawos design 38): a package that chooses its own arena.
#
# **THE ONLY THING THAT MAKES THIS PACKAGE SPECIAL IS THE `linker-script` LINE**
# — it names a two-line script of its own instead of the shared one, and that
# script sets `ARENA_SIZE` before INCLUDEing exactly the shared script every
# other root package names. Nothing else here differs from `tests/tier-word`'s
# manifest, which is the claim: choosing an arena size costs a package one file
# and one changed path, and costs every package that does not choose nothing at
# all.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "arena-small.riscv32.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "arena-small.arm64.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
