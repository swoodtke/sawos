[package]
name = "arena-small"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# A package that chooses its own arena. The `linker-script` lines (one per
# target) are the only difference from `tests/tier-word`'s manifest: each names
# a small per-target script that sets `ARENA_SIZE` and then includes the shared
# script the other root packages name. Choosing an arena size costs a package
# one override file per target and the changed paths, and costs every other
# package nothing.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "arena-small.riscv32.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "arena-small.arm64.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
