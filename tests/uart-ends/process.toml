# What this client needs from a stock root: tools/sosimage/src/declaration.saw
# states the format. In an image that names a console the builder gives it
# the console's inlet after its own records, which the runtime takes for
# `print`.
format = 1
arena = 0x1000

# `debug` for the debug print its `exit` end makes, and `process-self` for its
# Process handle; an image that names a console gives a record naming no
# rights no `debug`.
[[boot]]
name = "system"
kind = "system"
tag = 1
rights = ["debug", "process-self"]

[build]
inputs = ["endsconfig"]
defaults = { endsconfig = "config/exit.saw" }
