# An image whose one process exits with 3, which stops the machine with 3:
# the gate's product phase holds `test` and `run` to that status.
format = 1

[image]
name = "fails"
board = "riscv32-virt"
tick = false

[root]
package = "stock"

[[process]]
name = "fails"
package = "fails"
on-exit = "shutdown"
