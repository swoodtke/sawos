[package]
name = "stats-region"
version = "0.1.0"

runtime = true

# SOS M5 UNIT 7 (sawos design 37): the shared stats region — the milestone's own
# demo, and a `top` whose samples cost no syscalls.
#
# Root maps the kernel's published counter page read-only, proves its own row
# moves by exactly the number of syscalls it makes, proves the region and the v1
# `Process.stats()` op answer the same storage, and then launches a child that
# maps the same page and reads ROOT's row out of it.
#
# It needs no pool: the page it maps is the KERNEL's, granted by the op rather
# than carved out of memory this process owns, which is the whole
# access-without-possession shape.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
