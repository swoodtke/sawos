[package]
name = "pwmkit"
version = "0.1.0"

# What the PWM cases' client children do (`tests/pwm-*-client`): start from a
# stock root's boot set, hold the client end of the driver's connection, and
# make `pwmproto` calls, each checked against the answer the case wants. A
# library: each client's package is its script and the names of its records.
[dependencies]
sos = { path = "../../kernel/sysapi" }
pwmproto = { path = "../../drivers/pwmproto" }
