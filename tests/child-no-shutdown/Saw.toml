[package]
name = "child-no-shutdown"
version = "0.1.0"

runtime = true

# **THE MASK HOLDS AT RUN TIME** (sawos design 4, as ruled Aug 29). This launcher
# gives a child a System handle whose keep mask left `Shutdown` out, and the
# child tries to stop the machine anyway. The kernel refuses, the CHILD dies, and
# ROOT SURVIVES to say so — attenuation working end to end, with the fault
# falling on the process that overstepped.

[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/root.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
