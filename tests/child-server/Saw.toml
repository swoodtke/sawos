[package]
name = "child-server"
version = "0.1.0"

# Same reason as root's: this image carries its own `__saw_rt_*` seams, out of
# the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# **A SERVER CHILD THAT PARKS** (sawos design 15, M4 unit 3). It is given one
# `PipeOutlet` and nothing else, attaches it to a Waiter of its own, and BLOCKS
# until a message is staged — which is unit 3's readable arm proved across a
# process boundary, where `child-post`'s poll loop was the best unit 1 could do.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/child.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/child.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
