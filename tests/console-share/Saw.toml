[package]
name = "console-share"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# A client of an image's console with a printing thread and a counting
# thread, for the ESP32-S3 board: a board-only case, whose numbers are the
# part's.
[dependencies]
sos = { path = "../../kernel/sysapi" }
uartproto = { path = "../../drivers/uartproto" }
uartpipe = { path = "../../drivers/uartpipe" }
sosmain = { path = "../../rt/main" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.xtensa-esp-unknown-elf]
linker-script = "../../hal/xtensa-esp32s3/user/user.ld"
native = "../../hal/xtensa-esp32s3/user/syscall.c ../../rt/common_c/support.c"
