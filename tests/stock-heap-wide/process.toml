# What this child needs from a stock root: tools/sosimage/src/declaration.saw
# states the format. Its two heaps' pools come to 2 MiB, so with its own
# region they pass the 2 MiB an arm64 process's rows have above its link
# address, and the builder refuses an arm64 image with it. On a board whose
# rows lie at their own bytes' address it would be placed like any other.
format = 1
arena = 0

[[boot]]
name = "system"
kind = "system"
tag = 1

[heap.default]
len = 0x10_0000

[heap.data]
slot = 1
len = 0x10_0000
