[package]
name = "child-forward"
version = "0.1.0"

# Same reason as sos/root's: this image carries its own `__saw_rt_*` seams, out
# of the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# **THE MIDDLE OF A THREE-PROCESS DELEGATION** (sawos design 21, M4 unit 5). It
# receives a request from a client it cannot name and forwards the OBLIGATION —
# not the data — to a process the client has never heard of, which is §2.1's
# ratified zero-copy example with three real processes rather than two pipes.
#
# It is the FIRST child of `delegate-3p`, so it is linked at the first child
# base; `child-far` beside it is the second.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/child.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/child.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
