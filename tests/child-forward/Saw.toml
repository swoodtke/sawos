[package]
name = "child-forward"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# The middle of a three-process delegation. It receives a request from a client
# it cannot name and forwards the obligation, not the data, to a process the
# client has never heard of: §2.1's zero-copy example with three real processes
# rather than two pipes.
#
# It is the first child of `delegate-3p`, so on riscv32 it is linked at the
# first child base (`child.ld`); `child-far` beside it is the second.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/child.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
