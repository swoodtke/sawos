# What this client needs from a stock root: tools/sosimage/src/declaration.saw
# states the format. It declares no client record: in an image that names a
# console, the builder gives it one under `CONSOLE_TAG` after its own.
format = 1
arena = 0x1000

# `debug` for its reports, which it prints through the kernel's debug print:
# it has its own `_start`, so its runtime does not take the console's record.
# `process-self` for its Process handle.
[[boot]]
name = "system"
kind = "system"
tag = 1
rights = ["debug", "process-self"]

# Its System and Process handles, the console's inlet and the claim a write
# posts: the console's inlet is not among its records, and the builder counts
# it in the floor this row is held to.
[quota]
handles = 4
