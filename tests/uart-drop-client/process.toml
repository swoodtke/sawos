# What this client needs from a stock root: tools/sosimage/src/declaration.saw
# states the format.
format = 1
arena = 0x2000
bands = "full"              # its script runs at `Rt1`, above the driver

[[boot]]
name = "system"
kind = "system"
tag = 1

[[boot]]
name = "uart"
kind = "client"
protocol = "uartproto"
tag = 2

# Its main thread and the thread at `Rt1` it joins.
[quota]
threads = 2
