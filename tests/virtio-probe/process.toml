# What this process needs from a stock root: tools/sosimage/src/declaration.saw
# states the format. `debug` is its console, the kernel's debug print.
format = 1
arena = 0x1000

[[boot]]
name = "system"
kind = "system"
tag = 1
rights = ["debug", "process-self"]

[[boot]]
name = "virtio"
kind = "window"
type = "virtio-mmio"
tag = 2
