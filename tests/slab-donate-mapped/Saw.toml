[package]
name = "slab-donate-mapped"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# The `maps == 0` half of the donation safety condition, which needs a live
# mapping to prove.
#
# Root maps and observes; the child donates and dies. The refusal is a fault, so
# the donor cannot report anything afterwards: root keeps the grant row, stamps
# a witness byte through it, hands the region's only handle to a child carrying
# `SlabDonate`, and reads the witness back once the child is gone. A donation
# that had been accepted would have zeroed those bytes.
#
# It needs the pool (`"pool": True`) to cut the page from, and the poolbase C
# file for the address to stamp through.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c ../poolbase_riscv32.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c ../poolbase_arm64.c"
