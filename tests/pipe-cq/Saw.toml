[package]
name = "pipe-cq"
version = "0.1.0"

# Same reason as root's: this image carries its own `__saw_rt_*` seams, out of
# the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# **THE COMPLETION-QUEUE SERVER: ONE TRAP PER MESSAGE** (sawos design 18, M4
# unit 4; `designs/010` ruling 11(d)). Root attaches its outlet CONSUMING and
# PERSISTENT and never holds an outlet handle again: every message arrives
# through `wait` itself, with the obligation minted at the delivery. The client
# is `child-pingpong`, unchanged from unit 3.5, so the server's cost is measured
# against the same eight round trips that case measured at two traps each.

[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
