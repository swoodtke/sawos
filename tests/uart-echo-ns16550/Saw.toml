[package]
name = "uart-echo-ns16550"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# The userspace UART echo driver, for the board whose console is an NS16550A. It
# holds an Interrupt handle for the console's line, waits on it through a
# Waiter, reads the device's registers directly through its mapped window,
# echoes each byte back out the same device, acks and re-waits. The kernel has
# no driver code in it.
#
# It is per-device, not per-architecture: a driver names its device, and the two
# SOS profiles have different UARTs. The pl011 package beside this one is the
# same program for the other.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

# The console's register page arrives as an `IoMemory` capability in this
# driver's boot set, and it maps it into itself with `Process.map(iomemory:)`
# rather than declaring a window in the image.
[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"
