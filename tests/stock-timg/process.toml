# What this child needs from a stock root: tools/sosimage/src/declaration.saw
# states the format.
format = 1
arena = 0x2000

[[boot]]
name = "system"
kind = "system"
tag = 1

[[boot]]
name = "timer"
kind = "window"
type = "esp32s3-timg"
tag = 2

[build]
inputs = ["stockconfig"]
defaults = { stockconfig = "config/default.saw" }
