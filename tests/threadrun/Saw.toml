[package]
name = "threadrun"
version = "0.1.0"

# The threads the `thread_run` case and the ESP32-S3's windowed case make with
# `Process.thread_create(run:arg:stack_top:)`, as a library: no `emit`, no
# linker script, no `runtime`. A program that depends on it is compiled as one
# unit with its own target features, so this code is windowed in a package
# that says `+windowed` and call0 in one that does not.
[dependencies]
sos = { path = "../../kernel/sysapi" }
sosmain = { path = "../../rt/main" }
