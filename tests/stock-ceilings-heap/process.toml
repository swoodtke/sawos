# What this child needs from a stock root: tools/sosimage/src/declaration.saw
# states the format. It has no built-in heap and one default heap, and its
# ceilings list exactly what a program written with `main` and a heap spends
# (the builder refuses a table that lacks any). Its System handle keeps
# `debug` and `process-self`.
format = 1
arena = 0

[[boot]]
name = "system"
kind = "system"
tag = 1
rights = ["debug", "process-self"]

[quota]
handles = 8
mappings = 1
memories = 1

[heap.default]
len = 0x8000

[ceilings]
process = ["boot-handles", "thread-self", "exit", "mint", "map"]
thread = ["control"]
memory = ["map", "extend"]
mapping = ["grow", "base"]
pool = ["allocate", "map", "transfer", "mint", "extend"]
