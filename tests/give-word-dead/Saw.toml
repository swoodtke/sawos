[package]
name = "give-word-dead"
version = "0.1.0"

runtime = true

# The giver's word is dead. A give unbinds the caller's entry exactly as a
# release does, generation bump included, so the word it held names nothing
# afterwards and using it is the diagnosed `BadHandle` fault. It works at the C
# altitude, because the typed Saw surface has no word extractor: `Process.give`
# consumes its wrapper, so a claim about the given word is unspellable there.
# That is half the claim, not a shortcut.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
