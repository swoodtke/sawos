# What the pinger needs from a stock root: tools/sosimage/src/declaration.saw
# states the format. Its ring comes from the driver, in the reply to
# `Attach`, so it has no memory record and asks for no `physical`. The arena
# holds the stack, which keeps frames waiting on an address and TCP's
# connections with their buffers.
format = 1
arena = 0x18000

[[boot]]
name = "system"
kind = "system"
tag = 1
rights = ["debug", "process-self"]

[[boot]]
name = "netdev"
kind = "client"
protocol = "netdevproto"
tag = 2

# The ring's.
[quota]
mappings = 1

# Its first step: `config/default.saw` says what the input decides.
[build]
inputs = ["pingconfig"]
defaults = { pingconfig = "config/default.saw" }
