[package]
name = "c3-child-poke"
version = "0.1.0"

runtime = true

# The `isolation` smoke case, from the wrong side of the fence: this child
# stores a word into memory the kernel owns and nobody was ever granted.
#
# This is a separate package from `child-poke` for two reasons. A package names
# its linker script by target triple, the C3 shares `riscv32-unknown-none-elf`
# with the virt profile, and `child-poke` names virt's script, which links at
# 0x8024_0000, an address this part does not have. And `child-poke` finds its
# target by rounding its own address down to a region boundary, a fact about the
# virt memory map; this board's regions are smaller because its SRAM does not
# divide the way the virt DRAM does (hal/riscv32-esp32c3/ABI.md §8).
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32-esp32c3/user/child.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

# Userspace half of the no-A build spelling (hal/riscv32-esp32c3/ABI.md §3).
# Blade's default for a riscv32 triple is the virt Profile A baseline
# (`rv32imac_zicsr`, `+m,+a,+c`), and the ESP32-C3 has no A extension, so all
# three keys are restated here. Without them the image links `amo*`/`lr`/`sc`
# instructions the part cannot execute, and nothing catches it: the emulator's
# CPU model advertises A (ABI.md §3a), so the wrong build runs green there and
# faults on silicon.
march = "rv32imc_zicsr_zifencei"
mabi = "ilp32"
target-features = "+m,+c"
