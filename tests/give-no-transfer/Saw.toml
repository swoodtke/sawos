[package]
name = "give-no-transfer"
version = "0.1.0"

runtime = true

# THE ATTENUATION PROOF (sawos design 4, as ruled Aug 29). `Transfer` is a
# UNIVERSAL right checked on the handle BEING GIVEN, and `MINT_OP`'s keep mask is
# what lets a launcher produce a handle without it. One transcript proves both:
# the give's gate is real, and a masked sibling is genuinely narrower than its
# source with no way back.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/root.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
