[package]
name = "give-no-transfer"
version = "0.1.0"

runtime = true

# THE RIGHTS AUDIT'S NEGATIVE EXHIBIT (sawos design 4 D-3). `Transfer` is a
# UNIVERSAL right and it is checked on the handle BEING GIVEN; root's System
# handle withholds it, deliberately, from the M2 decision that there was nobody
# to transfer to. That refusal is v1-correct and this case is what proves the
# gate is real rather than assumed.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/root.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
