# What the client needs from a stock root: tools/sosimage/src/declaration.saw
# states the format. Its ring comes from the driver, in the reply to `Attach`,
# so it has no memory record and asks for no `physical`. The arena holds the
# stack, which keeps frames waiting on an address and TCP's connections with
# their buffers. The clock is the DHCP scenario's that retransmits.
format = 1
arena = 0x18000

[[boot]]
name = "system"
kind = "system"
tag = 1
rights = ["debug", "process-self", "clock-get"]

[[boot]]
name = "netdev"
kind = "client"
protocol = "netdevproto"
tag = 2

# A heap of its own, whose pool it takes a share from: a page to carry in a
# request.
[heap.default]
len = 0x8000

# The ring's mapping and the heap's three.
[quota]
mappings = 4

# Its one step: `config/default.saw` says what the input decides.
[build]
inputs = ["netcase"]
defaults = { netcase = "config/default.saw" }
