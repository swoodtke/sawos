[package]
name = "child-handles"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# A process that receives a capability in a message (spec.md §2.1's `send(data?,
# handles?)`). It takes one message off the server end its boot set carries and
# branches on the kind of the handle that came with it: a forwarded obligation
# it answers, or a connection end it posts through and sends a sibling of back.
# Two launchers, one child, and the arm that ran is its exit code.

[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/child.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
