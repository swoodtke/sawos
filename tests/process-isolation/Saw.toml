[package]
name = "process-isolation"
version = "0.1.0"

runtime = true

# THE MONEY PROOF (sawos design 2 D-5): root creates and starts a child that
# reaches for ROOT's memory, and the access faults. The claim is inverted
# somewhere today — before the per-process protection reload, a child would have
# run under whatever domain happened to be installed.
#
# Root's own script here is the same one every root uses; the child it launches
# (`tests/child-poke`) is what does the reaching.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/root.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
