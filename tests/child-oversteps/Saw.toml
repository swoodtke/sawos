[package]
name = "child-oversteps"
version = "0.1.0"

runtime = true

# A CHILD THAT REACHES FOR A RIGHT IT WAS NOT GIVEN (sawos design 4, as ruled
# Aug 29) — `root-server-oversteps`'s little brother, one privilege level along.
# It holds a masked System handle: it can print, and it cannot stop the machine,
# because its launcher's keep mask named `Debug` and not `Shutdown`. It says so
# and then tries, which is how it dies.

[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/child.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/child.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
