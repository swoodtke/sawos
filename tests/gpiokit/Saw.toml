[package]
name = "gpiokit"
version = "0.1.0"

# What the GPIO cases' client children do (`tests/gpio-*-client`): start from
# a stock root's boot set, hold the client end of the driver's connection, and
# make `gpioproto` calls, each checked against the answer the case wants. A
# library: each client's package is its script and the names of its records.
[dependencies]
sos = { path = "../../kernel/sysapi" }
gpioproto = { path = "../../drivers/gpioproto" }
