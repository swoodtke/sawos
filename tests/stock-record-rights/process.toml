# What this child needs from a stock root: tools/sosimage/src/declaration.saw
# states the format. Its ceilings let it hold a window with `carve` and `map`,
# and its window record is given with `map` alone.
format = 1
arena = 0x2000

[[boot]]
name = "system"
kind = "system"
tag = 1
rights = ["debug", "process-self"]

[[boot]]
name = "rtc"
kind = "window"
type = "goldfish-rtc"
tag = 2
rights = ["map"]

[ceilings]
process = ["boot-handles", "exit"]
iomemory = ["carve", "map"]
