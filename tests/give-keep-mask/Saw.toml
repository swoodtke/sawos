[package]
name = "give-keep-mask"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# Attenuate at give, and at the derive. A child is handed a connection end
# through a keep mask that omits `Post` and faults when it posts; a keep bit the
# source never held is ignored, which is the fail-closed intersection narrowing
# and never widening. Then root derives a Process handle without `Stats` through
# `process_self(keep:)`, and reading the stats through it ends the case.

[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
