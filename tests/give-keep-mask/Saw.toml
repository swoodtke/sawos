[package]
name = "give-keep-mask"
version = "0.1.0"

# Same reason as root's: this image carries its own `__saw_rt_*` seams, out of
# the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# **ATTENUATE AT GIVE, AND AT THE DERIVE** (sawos design 18, M4 unit 4;
# `designs/010` agenda 7b). A child is handed a connection end through a keep
# mask that omits `Post` and faults when it posts; a keep bit the source never
# held is ignored, which is the fail-closed intersection proving it narrows and
# never widens. Then root closes spec §9's unit-6 finding on itself:
# `process_self(keep:)` derives a Process handle without `Stats`, and reading
# them ends the case.

[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/root.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
