[package]
name = "child-no-heap"
version = "0.1.0"

runtime = true

# A `_start` child with no heap: each `linker-script` names a script of the
# package's own that sets `ARENA_SIZE` to zero and includes the shared one,
# so every allocation it makes is refused. It drains its boot set and takes
# every record, which only an allocation-free drain lets it do.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "no-heap.riscv32.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "no-heap.arm64.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"

[sos.xtensa-esp-unknown-elf]
linker-script = "no-heap.xtensa.ld"
native = "../../hal/xtensa-esp32s3/user/syscall.c ../../rt/common_c/support.c"
