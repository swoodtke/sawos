# What this driver needs from a stock root: tools/sosimage/src/declaration.saw
# states the format. It ends before it takes its server end.
format = 1
arena = 0

# `process-self` for the Process handle it exits through.
[[boot]]
name = "system"
kind = "system"
tag = 1
rights = ["process-self"]

[[boot]]
name = "uart"
kind = "serve"
protocol = "uartproto"
tag = 2
