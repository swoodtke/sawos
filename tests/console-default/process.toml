# What this process needs from a stock root: tools/sosimage/src/declaration.saw
# states the format. Its System record names no rights, so it keeps its
# image's default. In an image that names a console the builder gives it the
# console's inlet under `CONSOLE_TAG` after its own record.
format = 1
arena = 0x1000

[[boot]]
name = "system"
kind = "system"
tag = 1
