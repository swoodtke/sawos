[package]
name = "process-lifecycle"
version = "0.1.0"

runtime = true

# THE HEADLINE OF M3 UNIT 2 (sawos design 2): root creates a second process,
# starts it, and is still there afterwards. It is a real Blade package for the
# reason sos/root is — a launcher should go through the pipeline every SOS
# process goes through, and should reach the kernel through the `sos` module and
# never through an op number.
#
# Its kernel arms no tick, so the only thing that ever takes the processor away
# from root is root parking on its own timer.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/root.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
