# What this child needs from a stock root: tools/sosimage/src/declaration.saw
# states the format.
format = 1
arena = 0x2000

[[boot]]
name = "system"
kind = "system"
tag = 1

[[boot]]
name = "rtc"
kind = "window"
type = "pl031"
tag = 2

[[boot]]
name = "rtc"
kind = "line"
type = "pl031"
tag = 3

[build]
inputs = ["stockconfig"]
defaults = { stockconfig = "config/default.saw" }
