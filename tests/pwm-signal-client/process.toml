# What this client needs from a stock root: tools/sosimage/src/declaration.saw
# states the format.
format = 1
arena = 0x2000

[[boot]]
name = "system"
kind = "system"
tag = 1

[[boot]]
name = "pwm"
kind = "client"
protocol = "pwmproto"
tag = 2

# GPIO whole, which it reads and never writes: bank 1's input levels, and the
# output levels and enables root's setup writes made.
[[boot]]
name = "gpio"
kind = "window"
type = "esp32s3-gpio"
tag = 3
