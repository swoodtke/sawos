[package]
name = "child-reply"
version = "0.1.0"

# Same reason as sos/root's: this image carries its own `__saw_rt_*` seams, out
# of the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# **THE FIRST SOS PROCESS TO ANSWER A QUESTION IT WAS NEVER ASKED** (sawos design
# 14, M4 unit 2; spec §2.1's ratified delegation paragraph). It bootstraps
# exactly as every other child does — a masked System handle in a0, its own
# Process object derived from it, its boot set drained from there — and the one
# new thing in the set is a `PipeRequest`: an OBLIGATION its launcher took off a
# connection this child cannot name and has no end of.
#
# It replies, and the bytes land at the client that asked. That is §2.1's
# zero-copy delegation example with the fs and the flash driver, at its smallest.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/child.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
