[package]
name = "memory-split"
version = "0.1.0"

runtime = true

# Derivation: a pool is split from the front, the parent becomes the remainder,
# the pieces are disjoint, exhaustion is a status, and an oversize cut is a
# fault.
#
# The two chunks are mapped and written, which makes "disjoint" an observation
# rather than an assertion about arithmetic nobody can see: a byte written into
# the first chunk survives a byte written into the second, which is only true if
# the parent's cursor advanced.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

# `poolbase_<arch>.c` is where the pool is: the one number this program's config
# carries, per architecture, because Saw cannot name an address. See that file
# for why a test knows this and a region still has no bounds reader.
[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c ../poolbase_riscv32.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c ../poolbase_arm64.c"
