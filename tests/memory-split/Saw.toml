[package]
name = "memory-split"
version = "0.1.0"

runtime = true

# M3 UNIT 4's DERIVATION PROOF (sawos design 6 D-2): a pool is split from the
# FRONT, the parent becomes the remainder, the pieces are disjoint, exhaustion
# is a STATUS, and an oversize cut is a FAULT.
#
# The two chunks are MAPPED and WRITTEN, which is what makes "disjoint" an
# observation rather than an assertion about arithmetic nobody can see: a byte
# written into the first chunk survives a byte written into the second, which
# is only true if the parent's cursor advanced.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

# `poolbase_<arch>.c` is WHERE THE POOL IS — the one number this program's
# config carries, per architecture, because Saw cannot name an address
# (DF-172a). See that file for why a test knows this and a region still has no
# bounds reader.
[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c ../poolbase_riscv32.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/root.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c ../poolbase_arm64.c"
