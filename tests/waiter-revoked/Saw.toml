[package]
name = "waiter-revoked"
version = "0.1.0"

# Same reason as root's: this image carries its own `__saw_rt_*` seams, out of
# the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# **NOTHING PARKED IS SILENTLY DOOMED** (sawos design 12, M4 unit 0;
# `designs/010` rulings 1 and 2). A root server with two workers parked in
# `Waiter.Wait`; the initial thread drops the LAST handle to the Waiter and both
# of them wake with `SosStatus.Revoked` instead of stranding. The minted-sibling
# release before it is the other half: the COUNT is what gates the revocation,
# not the release.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
