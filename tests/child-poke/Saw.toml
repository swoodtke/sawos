[package]
name = "child-poke"
version = "0.1.0"

runtime = true

# The other half of the isolation proof: this child reaches for root's memory.
# Everything else about it is `child-fault`: a real Blade package, linked like
# `child-fault` (`child.ld` on riscv32, `user.ld` on arm64), holding no handles.
#
# It is a separate package from `child-fault` because the two prove different
# things and must be able to fail independently: one shows a child dying without
# taking the machine down, the other shows that a child cannot touch its
# neighbour. A single image doing both would let a broken reload hide behind a
# passing fault report.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/child.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
