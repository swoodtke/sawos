[package]
name = "child-poke"
version = "0.1.0"

runtime = true

# THE ISOLATION PROOF'S OTHER HALF (sawos design 2 D-5). This child reaches for
# ROOT's memory. Everything else about it is `child-fault`: a real Blade
# package, linked at the child base, holding no handles.
#
# It is a separate package rather than a mode of the first because the two
# prove different things and must be able to fail independently: one shows a
# child dying without taking the machine down, the other shows that a child
# CANNOT touch its neighbour. A single image doing both would let a broken
# reload hide behind a passing fault report.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/child.ld"
native = "../../hal/riscv32/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/child.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
