# What this child needs from a stock root: tools/sosimage/src/declaration.saw
# states the format.
format = 1
arena = 0x1_2000           # 72 KiB: more than the user scripts' default

[[boot]]
name = "system"
kind = "system"
tag = 1

[[boot]]
name = "echo"
kind = "serve"
protocol = "stockkit"
tag = 2

[[boot]]
name = "scratch"
kind = "memory"
tag = 3

[quota]
waiters = 1

[build]
inputs = ["stockconfig"]
defaults = { stockconfig = "config/default.saw" }
