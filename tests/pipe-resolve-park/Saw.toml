[package]
name = "pipe-resolve-park"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# The Waiter-free blocking receive. Root posts and resolves with no Waiter and
# no attachment at all: the resolve finds the exchange pending and parks the
# calling thread on the claim's ready level, and a child server's reply wakes
# it. Reaching the end proves the park and the wake; a resolve that did not park
# would return before the reply and the program would run off its own
# assertions.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
