[package]
name = "pipe-resolve-park"
version = "0.1.0"

# Same reason as root's: this image carries its own `__saw_rt_*` seams, out of
# the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# **THE WAITER-FREE BLOCKING RECEIVE** (sawos design 22, M4 unit 4.5;
# `designs/010` ruling 12(b)). Root posts and RESOLVES with no Waiter and no
# attachment at all: the resolve finds the exchange pending and parks the calling
# thread on the claim's ready level, and a child server's reply is what wakes it.
# Reaching the end proves the park and the wake — a park-free resolve would have
# answered the old `WouldBlock` and this program would have run off its own
# assertions instead.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
