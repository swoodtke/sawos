[package]
name = "fp-threads"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# Two threads of one process that each fill the FP/SIMD registers with their own
# pattern, yield, and check it survived, beside a thread that never uses them.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

# arm64 only: the FP/SIMD helpers are AArch64 assembly.
[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../arm64/fp_state.c ../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
