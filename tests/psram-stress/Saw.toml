[package]
name = "psram-stress"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# Threads racing `s32c1i` increments on PSRAM words under the tick, with the
# data cache made to evict and refill the words' lines between bursts, on the
# `esp32s3-r8` board. The increments are in `stress.c`.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.xtensa-esp-unknown-elf]
linker-script = "../../hal/xtensa-esp32s3/user/user.ld"
native = "../../hal/xtensa-esp32s3/user/syscall.c ../../rt/common_c/support.c stress.c"
