# What this child needs from a stock root: tools/sosimage/src/declaration.saw
# states the format. It asks for the opt-in `physical` on `memory` and on
# `pool`, which its image must grant on each, and its pool record keeps it. The
# table is complete, so it lists every right the child spends: its Process
# handle's `boot-handles`, `exit` and `stats` (which reads the ceilings back).
format = 1
arena = 0x2000

[[boot]]
name = "system"
kind = "system"
tag = 1
rights = ["debug", "process-self"]

[[boot]]
name = "dma"
kind = "memory"
tag = 2
rights = ["allocate", "map", "physical"]

[ceilings]
process = ["boot-handles", "exit", "stats"]
memory = ["map", "physical"]
pool = ["allocate", "map", "physical"]
