[package]
name = "c-hello"
version = "0.1.0"

# Same reason as sos/root's: this image carries its own `__saw_rt_*` seams, out
# of the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# THE C-LEG PROBE'S LAUNCHER (sawos design 39). An ordinary Saw root server —
# it is `tests/death-notify/`'s program with the assertions changed — and that
# is the claim it exists to make: **the launcher cannot tell what language its
# child is written in.** `ProcessCreate` takes two Memory capabilities and reads
# neither, the boot set is the same give, the death wake is the same Waiter
# attachment, and the §8 status word comes back the same shape. Nothing in this
# package names C.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
