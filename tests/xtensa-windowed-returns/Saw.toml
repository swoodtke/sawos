[package]
name = "xtensa-windowed-returns"
version = "0.1.0"

# A windowed C child of `death-notify`'s root that returns from its entry after
# its first pane was spilled: act 2 of `../xtensa-windowed-child/child.c`,
# chosen by `child.ld`. The Saw file is empty (see its header), so no Saw is
# compiled windowed into the image.
[dependencies]

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.xtensa-esp-unknown-elf]
linker-script = "child.ld"
native = "../../hal/xtensa-esp32s3/user/syscall.c ../xtensa-windowed-child/child.c ../xtensa-windowed-child/child.S"
target-features = "+windowed"
