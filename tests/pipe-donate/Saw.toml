[package]
name = "pipe-donate"
version = "0.1.0"

# Same reason as sos/root's: this image carries its own `__saw_rt_*` seams, out
# of the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# M5 UNIT 6a: PIPES DONATE (sawos design 34). Root fills the Pipe slab to its
# COMPILED FLOOR, is refused a fifth, donates four pages to `SlabKind.Pipes`, and
# is then given the fifth — which proves the ceiling moved. Then the part design
# 32 excluded this kind over: the connection living in the DONATED extent carries
# a full round trip (post, take, reply, resolve), so the staging ring that lives
# beside the slot in donated memory is shown to work rather than merely to exist.
#
# FOUR PAGES, not one: a pipe unit is a connection slot plus `PIPE_INFLIGHT`
# exchange records, each carrying a whole message body, so it is the largest
# per-object storage in this kernel.
#
# It needs no child and no device — only a POOL to cut the donation out of, which
# is the runner's `"pool": True`.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
