[package]
name = "process-donate"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# A deployment that donates runs more concurrent processes than the image was
# compiled for. Root fills the table at `MAX_PROCESSES`, watches the next create
# answer `NoResource`, donates a region to `SlabKind.Processes`, and then
# creates, starts, reaps and re-creates a third child that can only be living in
# the donated extent.
#
# It lists three children and asks for no pool: each child's destination row is
# a pool, and the donation is allocated from the third one, which is also why
# the runner's two-children-plus-a-pool refusal never comes up.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/user.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
