# What this client needs from a stock root: tools/sosimage/src/declaration.saw
# states the format.
format = 1
arena = 0x2000

[[boot]]
name = "system"
kind = "system"
tag = 1

[[boot]]
name = "pwm"
kind = "client"
protocol = "pwmproto"
tag = 2

# It holds, at the most, its System, Process and inlet, a call's answer, and
# the four Events it sends in one request.
[quota]
handles = 8
events = 4
