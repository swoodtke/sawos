name: CI

on:
  push:
  pull_request:

jobs:
  sos-test:
    name: sos-test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # The harness assembles boot.S / rt.c with clang, links with ld.lld,
      # and runs the ELF under qemu-system-riscv32 and qemu-system-aarch64.
      - name: Install host toolchain (clang, lld, qemu)
        run: sudo apt-get update && sudo apt-get install -y clang lld qemu-system-misc qemu-system-arm

      # No SAWLANG_ROOT and no sawc on PATH here: CI exercises the pinned
      # FETCH path (toolchain.py step 3) — sawlang.pin's sha is cloned,
      # bootstrapped into its own venv, and cached by sha across runs.
      - name: Cache the pinned toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/saw-toolchain
          key: saw-toolchain-${{ hashFiles('sawlang.pin') }}

      - name: sos-test (both arches)
        run: make sos-test
