[package]
name = "s3dbias"
version = "0.1.0"

# The digital and RTC LDO settings ESP-IDF chooses for the ESP32-S3 from the
# eFuse's voltage calibration. Plain Saw with no dependency and nothing
# unsafe, so it compiles for the part (as the `s3dbias` module of a kernel's
# compile) and for the host alike, where the image builder's tests hold it to
# ESP-IDF's arithmetic.
