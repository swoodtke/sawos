# The ESP32-S3, Xtensa (call0), flat tier, under Espressif's QEMU: what an
# image is built against. tools/sosimage/src/board.saw states the format;
# `sosimage board` holds this file to a profile and to this HAL's numbers.
format = 1

[board]
name = "esp32s3"
triple = "xtensa-esp-unknown-elf"
tier = "flat"
hal = "hal/xtensa-esp32s3"
placement = "in-place"
modules = ["s3clock=keys/clock-*", "s3stall=keys/stall-*"]   # keyed per image
cflags = ["-mcpu=esp32s3",
          "-Xclang", "-target-feature", "-Xclang", "-windowed",
          "-Xclang", "-target-feature", "-Xclang", "-fp",
          "-fintegrated-as", "-ffreestanding", "-fno-builtin",
          "-ffunction-sections", "-fdata-sections"]

[emulator]
program = "qemu-system-xtensa"
args = ["-machine", "esp32s3", "-nographic", "-semihosting"]

# The kernel's .data and .bss in DRAM (kernel/esp32s3.ld), then the
# processes' DRAM, `RAM_BASE` to `RAM_TOP`.
[ram.kernel]
use = "kernel"
speed = "fast"
base = 0x3FC8_C000
len = 0x2_4000              # 144 KiB

[ram.sram]
use = "process"
speed = "fast"
base = 0x3FCB_0000
len = 0x4_0000              # 256 KiB

[ram.default]
process = "sram"
pool = "sram"

# The image's flash: 4 MiB, mapped for instructions and for data
# (`FLASH_IBUS`, `FLASH_DBUS`, `FLASH_WINDOW_LEN`), root's slot and one
# child slot (kernel/esp32s3.ld).
[flash]
base = 0x0
len = 0x40_0000             # 4 MiB
ibus = { base = 0x4200_0000, len = 0x200_0000 }
dbus = { base = 0x3C00_0000, len = 0x200_0000 }
root-slot = { base = 0x10_0000, len = 0x8_0000 }
slots = { base = 0x18_0000, len = 0x8_0000, count = 1 }

# The console: UART0, on interrupt-matrix source 27.
[devices.UART0]
type = "esp32s3-uart"
base = 0x6000_0000
len = 0x1000
line = 27
kernel = true

# SYSTIMER target 0's source, the kernel's tick.
[lines]
reserved = [57]
