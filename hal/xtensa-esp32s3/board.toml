# The ESP32-S3, Xtensa (call0), flat tier, under Espressif's QEMU: what an
# image is built against. tools/sosimage/src/board.saw states the format;
# `sosimage board` holds this file to a profile and to this HAL's numbers.
format = 1

[board]
name = "esp32s3"
triple = "xtensa-esp-unknown-elf"
tier = "flat"
hal = "hal/xtensa-esp32s3"
placement = "in-place"
modules = ["s3clock=keys/clock-*", "s3stall=keys/stall-*",   # keyed per image
           "s3clockkit=keys/clock-common"]
cflags = ["-mcpu=esp32s3",
          "-Xclang", "-target-feature", "-Xclang", "-windowed",
          "-Xclang", "-target-feature", "-Xclang", "-fp",
          "-fintegrated-as", "-ffreestanding", "-fno-builtin",
          "-ffunction-sections", "-fdata-sections"]

[emulator]
program = "qemu-system-xtensa"
args = ["-machine", "esp32s3", "-nographic", "-semihosting"]

# The kernel's .data and .bss in DRAM (kernel/esp32s3.ld), then the
# processes' DRAM, `RAM_BASE` to `RAM_TOP`.
[ram.kernel]
use = "kernel"
speed = "fast"
base = 0x3FC8_C000
len = 0x2_4000              # 144 KiB

[ram.sram]
use = "process"
speed = "fast"
base = 0x3FCB_0000
len = 0x4_0000              # 256 KiB

[ram.default]
process = "sram"
pool = "sram"

# The image's flash: 4 MiB, mapped for instructions and for data
# (`FLASH_IBUS`, `FLASH_DBUS`, `FLASH_WINDOW_LEN`). Root's image takes
# `root-slot`; the other processes' images take `slots`, a range of `count`
# slots of equal length (here 128 KiB each), child i in slot i, so an image has
# at most `count` processes besides root. The kernel's read-only data begins
# where the slot range ends, behind every slot, at the same offset whatever an
# image's process count (kernel/esp32s3.ld, ABI.md §13).
[flash]
base = 0x0
len = 0x40_0000             # 4 MiB
ibus = { base = 0x4200_0000, len = 0x200_0000 }
dbus = { base = 0x3C00_0000, len = 0x200_0000 }
root-slot = { base = 0x10_0000, len = 0x8_0000 }
slots = { base = 0x18_0000, len = 0x8_0000, count = 4 }

# The console: UART0, on interrupt-matrix source 27.
[devices.UART0]
type = "esp32s3-uart"
base = 0x6000_0000
len = 0x1000
line = 27
kernel = true

# Timer group 1, which the kernel does not use. Its timer 0's alarm word
# holds what is written to it, and acts only once the timer's alarm is
# enabled; `word` is its first sixteen registers.
[devices.TIMG1]
type = "esp32s3-timg"
base = 0x6002_0000
len = 0x1000
registers.T0ALARMLO = { offset = 0x10 }
arrays.word = { offset = 0x0, stride = 4, count = 16 }

# SYSTIMER target 0's source, the kernel's tick.
[lines]
reserved = [57]

# What an image that states no limits of its own boots with, inside the
# kernel range's DRAM: root and seven processes, a Waiter each. The other
# kinds stay at their floors, and the derived totals follow: records 32 (four
# per body), attachments 52 (every waitable), Mappings 32 (four per body).
[limits.default]
processes = 8
waiters = 8
quota = { handles = 28, mappings = 12 }
