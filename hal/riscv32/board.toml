# The QEMU `virt` board, riscv32, isolated by PMP: what an image is built
# against. tools/sosimage/src/board.saw states the format; `sosimage board`
# holds this file to the runner's profile and to this HAL's numbers.
format = 1

[board]
name = "riscv32-virt"
triple = "riscv32-unknown-none-elf"
tier = "isolated"
hal = "hal/riscv32"
placement = "copied"
modules = ["rv32core=../riscv32-common/kernel"]
cflags = ["-march=rv32imac_zicsr", "-mabi=ilp32"]

[emulator]
program = "qemu-system-riscv32"
args = ["-M", "virt", "-bios", "none"]

# RAM is 128 MiB from 0x8000_0000 (kernel/virt.ld). The kernel, its payload
# and its blobs sit below root's region; processes have the rest, to
# `RAM_TOP`.
[ram.kernel]
use = "kernel"
speed = "fast"
base = 0x8000_0000
len = 0x20_0000             # 2 MiB

[ram.ram]
use = "process"
speed = "fast"
base = 0x8020_0000
len = 0x7E0_0000            # 126 MiB
atomics = true              # word atomics: the A extension

[ram.default]
process = "ram"
pool = "ram"

# The console: an NS16550A, on PLIC source 10.
[devices.UART0]
type = "ns16550"
base = 0x1000_0000
len = 0x1000
line = 10
kernel = true

# The real-time clock: a goldfish RTC, on PLIC source 11. Its alarm's upper
# word holds what is written to it, and nothing acts on it until the lower
# word is written; `word` is its eight registers.
[devices.RTC]
type = "goldfish-rtc"
base = 0x10_1000
len = 0x1000
line = 11
registers.ALARM_HIGH = { offset = 0x0c }
arrays.word = { offset = 0x0, stride = 4, count = 8 }

# The virtio-mmio transports, one per row: QEMU's `virtio-mmio-bus.N` is at
# 0x1000_1000 + N * 0x1000 on PLIC source N + 1. What sits behind one is the
# emulator's command line; an empty transport reads DeviceID 0.
[devices.VIRTIO0]
type = "virtio-mmio"
base = 0x1000_1000
len = 0x1000
line = 1

[devices.VIRTIO1]
type = "virtio-mmio"
base = 0x1000_2000
len = 0x1000
line = 2

[devices.VIRTIO2]
type = "virtio-mmio"
base = 0x1000_3000
len = 0x1000
line = 3

[devices.VIRTIO3]
type = "virtio-mmio"
base = 0x1000_4000
len = 0x1000
line = 4

[devices.VIRTIO4]
type = "virtio-mmio"
base = 0x1000_5000
len = 0x1000
line = 5

[devices.VIRTIO5]
type = "virtio-mmio"
base = 0x1000_6000
len = 0x1000
line = 6

[devices.VIRTIO6]
type = "virtio-mmio"
base = 0x1000_7000
len = 0x1000
line = 7

# A transport's registers are 0x200 long and nothing reads past them, so a
# row of 0x200 would serve as well as the 0x1000 each row grants.
[devices.VIRTIO7]
type = "virtio-mmio"
base = 0x1000_8000
len = 0x1000
line = 8

# What an image that states no limits of its own boots with. The derived
# totals follow: threads 16 (one per body), records 64 (four per body),
# attachments 100 (every waitable), Mappings 64 (four per body). A child's
# mapping quota is the PMP budget's rows less the four an image spends.
[limits.default]
processes = 16
events = 16
waiters = 16
timers = 16
memories = 32
iomemories = 16
pipes = 8
quota = { handles = 28, mappings = 4 }
