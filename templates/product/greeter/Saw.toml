[package]
name = "greeter"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in.
runtime = true

# The product's process that only prints, written with `main`: it prints its
# greeting over the image's console. `sosmain` is the start-up
# that runs `main`. Every sawos path is through `.sawos`, the link
# `tools/sawos.py` keeps to the pinned sawos tree.
[dependencies]
sos = { path = "../.sawos/kernel/sysapi" }
sosmain = { path = "../.sawos/rt/main" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../.sawos/hal/riscv32/user/user.ld"
native = "../.sawos/hal/riscv32-common/user/syscall.c ../.sawos/rt/common_c/support.c"

[sos.xtensa-esp-unknown-elf]
linker-script = "../.sawos/hal/xtensa-esp32s3/user/user.ld"
native = "../.sawos/hal/xtensa-esp32s3/user/syscall.c ../.sawos/rt/common_c/support.c"
