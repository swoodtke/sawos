[package]
name = "hello"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in.
runtime = true

# The product's own process, written with `main`: it writes its greeting
# through the UART driver's service and prints over the image's console.
# `sosmain` is the start-up that runs `main`, `uartproto` the driver's
# protocol and `uartpipe` its client over a pipe. Every sawos path is through
# `.sawos`, the link `tools/sawos.py` keeps to the pinned sawos tree.
[dependencies]
sos = { path = "../.sawos/kernel/sysapi" }
sosmain = { path = "../.sawos/rt/main" }
uartproto = { path = "../.sawos/drivers/uartproto" }
uartpipe = { path = "../.sawos/drivers/uartpipe" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../.sawos/hal/riscv32/user/user.ld"
native = "../.sawos/hal/riscv32-common/user/syscall.c ../.sawos/rt/common_c/support.c"
