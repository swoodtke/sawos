# What this process needs from the stock root. The format is stated in the
# sawos tree's tools/sosimage/src/declaration.saw.
format = 1
arena = 0x2000

[[boot]]
name = "system"
kind = "system"
tag = 1

[[boot]]
name = "console"
kind = "client"
protocol = "uartproto"
tag = 2

[build]
inputs = ["greeting"]
defaults = { greeting = "config/greeting.saw" }
