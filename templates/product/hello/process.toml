# What this process needs from the stock root. The format is stated in the
# sawos tree's tools/sosimage/src/declaration.saw. In an image that names a
# console the builder gives it one record more, the console's, which the
# runtime takes for `print`.
format = 1
arena = 0x2000

# Its System handle. Naming no rights, it keeps its image's default, which
# leaves `debug` out in an image that names a console: it prints over the
# console instead.
[[boot]]
name = "system"
kind = "system"
tag = 1

# Its own client of the UART driver's service, which its image connects.
[[boot]]
name = "uart"
kind = "client"
protocol = "uartproto"
tag = 2

[build]
inputs = ["greeting"]
defaults = { greeting = "config/greeting.saw" }
