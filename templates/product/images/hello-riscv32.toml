# The product on the riscv32 `virt` board: the stock root launches sawos's
# NS16550 driver, given the console UART, and the product's `hello` process
# as its client. The driver's serve is the image's console too, so `print`
# goes through it. `hello` writes its greeting through the driver, and its
# end stops the machine with its exit code. The format is stated in the
# sawos tree's tools/sosimage/src/imagefile.saw.
format = 1

[image]
name = "hello-riscv32"
board = "riscv32-virt"
tick = false
console = "uart.uart"

[root]
package = "stock"

[[process]]
name = "uart"
package = "sawos:drivers/svc-uart-ns16550"
device = { uart = "UART0" }

[[process]]
name = "hello"
package = "hello"
clients = { uart = "uart.uart" }
inputs = { greeting = "config/greeting.saw" }
on-exit = "shutdown"
