# The product on the ESP32-S3: the stock root launches sawos's UART driver,
# given UART0, which serves it on its interrupt and holds the console claim
# while it serves, as the image's console, and the product's `greeter`, which
# prints its greeting through it. `greeter`'s end stops the machine with its
# exit code. The format is stated in the sawos tree's
# tools/sosimage/src/imagefile.saw.
format = 1

[image]
name = "hello-esp32s3"
board = "esp32s3"
tick = false
console = "console.uart"

[root]
package = "stock"

[[process]]
name = "console"
package = "sawos:drivers/svc-uart-esp32s3"
device = { uart = "UART0" }

[[process]]
name = "greeter"
package = "greeter"
inputs = { greeting = "config/greeting.saw" }
on-exit = "shutdown"
