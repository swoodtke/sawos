# The product on the ESP32-S3: the stock root launches the product's
# `greeter`, which prints its greeting, and its end stops the machine with
# its exit code. The format is stated in the sawos tree's
# tools/sosimage/src/imagefile.saw.
format = 1

[image]
name = "hello-esp32s3"
board = "esp32s3"
tick = false

[root]
package = "stock"

[[process]]
name = "greeter"
package = "greeter"
inputs = { greeting = "config/greeting.saw" }
on-exit = "shutdown"
