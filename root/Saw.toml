[package]
name = "sos-root"
version = "0.1.0"

# This image carries its own runtime. The `__saw_rt_*` seams and the arena
# behind them come from `sosrt`, which arrives through the `sos` dependency
# below, and a package build compiles its whole module graph into one unit, so
# this compile is where those definitions land. Blade passes `--runtime`, which
# permits the exports, checks each signature against sawlang's runtime/ABI.md,
# and links no runtime beside it.
runtime = true

# The stock root (spec §12): it launches an image's processes as the image's
# plan says. The plan is the module `imageplan`, which the image builder writes
# for each image and hands to the build (`blade build --module-path
# imageplan=DIR`, `sosimage build`), so this package builds only for an image.
[dependencies]
# The kernel's exported userspace API (spec §5.7).
sos = { path = "../kernel/sysapi" }
# The types a plan is written in.
bootplan = { path = "bootplan" }
# The start-up of a program written with `main`, and its boot context.
sosmain = { path = "../rt/main" }
# The console's wire, which root writes its own lines in once the console is
# claimed.
uartproto = { path = "../drivers/uartproto" }

[sos]
emit = "sosimg"

# Root's band map (spec §7), which the kernel applies verbatim from the image
# header: root's own threads run at these levels. Every band is named, the
# realtime ones too, so root has the full map: its console's watchdog runs at
# `Rt1`, above a driver's `Rt0`.
[sos.priorities]
background = 0
low = 1
normal = 2
high = 3
rt0 = 4
rt1 = 5
rt2 = 6
rt3 = 7

# Root's own sources name no architecture; everything that does is reached
# through the HAL, so each section points into the HAL's `user/` directory.
[sos.riscv32-unknown-none-elf]
linker-script = "../hal/riscv32/user/user.ld"
native = "../hal/riscv32-common/user/syscall.c ../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../hal/arm64/user/user.ld"
native = "../hal/arm64/user/syscall.c ../rt/common_c/support.c"

[sos.xtensa-esp-unknown-elf]
linker-script = "../hal/xtensa-esp32s3/user/user.ld"
native = "../hal/xtensa-esp32s3/user/syscall.c ../rt/common_c/support.c"
