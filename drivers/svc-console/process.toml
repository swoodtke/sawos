# What this driver needs from a stock root: tools/sosimage/src/declaration.saw
# states the format. It needs no device: its System handle's `Debug` right is
# the console.
format = 1
arena = 0x1000

[[boot]]
name = "system"
kind = "system"
tag = 1

[[boot]]
name = "uart"
kind = "serve"
protocol = "uartproto"
tag = 2

# Its handles: its System, its Process and its Waiter (the outlet leaving at
# the attach) make three. A delivery needs room for the obligation it mints and
# for every handle the request carries before it mints any, so the most it
# holds is those three, the request being served, and the `PIPE_MSG_HANDLES`
# that request carries: eight. A row short of that lets a client's request end
# the driver.
[quota]
handles = 8
waiters = 1
