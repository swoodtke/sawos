# What this driver needs from a stock root: tools/sosimage/src/declaration.saw
# states the format. It needs no device: its System handle's `Debug` right is
# the console.
format = 1
arena = 0x1000

# `debug` for what it serves and its own lines, both written through the
# kernel's debug print, and `process-self` for its Process handle. It names
# them because an image that names a console gives a record naming none no
# `debug`.
[[boot]]
name = "system"
kind = "system"
tag = 1
rights = ["debug", "process-self"]

[[boot]]
name = "uart"
kind = "serve"
protocol = "uartproto"
tag = 2

# Its handles: its System, its Process, its main thread's own Thread handle
# and its Waiter (the outlet leaving at the attach) make four. A delivery needs
# room for the obligation it mints and for every handle the request carries
# before it mints any, so the most it holds is those four, the request being
# served, and the `PIPE_MSG_HANDLES` that request carries: nine. A row short of
# that lets a client's request end the driver.
[quota]
handles = 9
waiters = 1
