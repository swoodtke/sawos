[package]
name = "hciproto"
version = "0.1.0"

# The HCI transport protocol, as a package: one declaration a Bluetooth host
# and every Bluetooth controller's driver compile against. Its H4 packets
# cross in a `pktring`.
#
# It is a library: no `emit`, no linker script, no `runtime`, and no
# dependency on `sos`, so `blade test` runs its tests on the host.
[dependencies]
pktring = { path = "../pktring" }
