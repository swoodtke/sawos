[package]
name = "netstack"
version = "0.1.0"

# The TCP/IP stack's first layer: Ethernet II, ARP, IPv4, ICMP and UDP as
# parsers, builders and small state machines over byte buffers, with time a
# number the caller passes. Plain Saw with no `sos` dependency, so `blade test`
# runs its tests on the host; the process that serves it supplies the frames,
# the clock and the sockets.
#
# It is a library: no `emit`, no linker script, no `runtime`, and no
# dependency.
