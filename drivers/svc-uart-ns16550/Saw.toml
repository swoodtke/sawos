[package]
name = "svc-uart-ns16550"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# The UART as a service, for the board whose console is an NS16550A. It is
# `child-echo-ns16550` with a server face: the same window arriving by `give`
# and mapped by the driver into itself, the same register block, and a
# pipe outlet given to its Waiter so every request arrives through `wait` itself
# (the completion-queue server shape of `pipe-cq`).
#
# It is per-device, not per-architecture: a driver names its device, and the two
# SOS profiles have different UARTs. The pl011 package beside this one is the
# same program for the other: same protocol, same loop, same accounting, a
# different datasheet.
[dependencies]
sos = { path = "../../kernel/sysapi" }
uartproto = { path = "../uartproto" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/child.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"
