[package]
name = "svc-uart-ns16550"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# The UART as a service, for the board whose console is an NS16550A,
# interrupt-driven both ways: it serves `uartproto` from the UART's window and
# line, with `uartcore`'s rings, holds and marks over the 16550's registers,
# and claims the console while it serves. Its build input `uartconfig` sizes
# the rings (`config/default.saw` names every key).
#
# It is per-device, not per-architecture: a driver names its device, and the two
# SOS profiles have different UARTs. The pl011 package beside this one is the
# same program for the other: same protocol, same loop, same accounting, a
# different datasheet.
[dependencies]
sos = { path = "../../kernel/sysapi" }
uartproto = { path = "../uartproto" }
uartcore = { path = "../uartcore" }
sosmain = { path = "../../rt/main" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/user.ld"
native = "../../hal/riscv32-common/user/syscall.c ../../rt/common_c/support.c"
