[package]
name = "svc-pwm-esp32s3"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# The ESP32-S3's LEDC as a servo service: it drives the servos its build input
# `pwmconfig` names, one LEDC channel and one pad each, and answers `pwmproto`
# requests for them. The input is a module the image names a file for
# (`process.toml`'s `[build] inputs`), so two builds of this package with two
# files are two drivers.
[dependencies]
sos = { path = "../../kernel/sysapi" }
pwmproto = { path = "../pwmproto" }
esp32s3io = { path = "../esp32s3io" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.xtensa-esp-unknown-elf]
linker-script = "../../hal/xtensa-esp32s3/user/user.ld"
native = "../../hal/xtensa-esp32s3/user/syscall.c ../../rt/common_c/support.c"
