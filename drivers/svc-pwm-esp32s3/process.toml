# What this driver needs from a stock root: tools/sosimage/src/declaration.saw
# states the format. LEDC's clock gate and reset, and its pads' output level
# and enable, are the image's `[[setup]]` writes, made before it starts.
format = 1
arena = 0x1000

[[boot]]
name = "system"
kind = "system"
tag = 1

[[boot]]
name = "ledc"
kind = "window"
type = "esp32s3-ledc"
tag = 2

# Its pads' output selects, GPIO's `FUNCn_OUT_SEL_CFG` from the lowest pin's.
[[boot]]
name = "outsel"
kind = "window"
type = "esp32s3-gpio"
part = true
tag = 3

# Its pads' IO MUX words, from the lowest pin's.
[[boot]]
name = "pads"
kind = "window"
type = "esp32s3-io-mux"
part = true
tag = 4

[[boot]]
name = "pwm"
kind = "serve"
protocol = "pwmproto"
tag = 5

# Its handles: the records (five, the outlet leaving at the attach), its
# Process, three Mappings and its Waiter make nine. A delivery needs room for
# the obligation it mints and for every handle the request carries before it
# mints any, so the most it holds is those nine, the request being served, and
# the `PIPE_MSG_HANDLES` that request carries: fourteen. A row short of that
# lets a client's request end the driver.
[quota]
mappings = 3
handles = 14
waiters = 1

[build]
inputs = ["pwmconfig"]
