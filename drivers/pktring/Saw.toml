[package]
name = "pktring"
version = "0.1.0"

# The shared-memory packet ring the packet protocols carry their packets in:
# its layout, its index arithmetic and the accessors that read each shared
# field once. Both ends of a connection compile against it.
#
# It is a library: no `emit`, no linker script, no `runtime`, and no
# dependency, so `blade test` runs its tests on the host.
