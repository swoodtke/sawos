[package]
name = "uartcore"
version = "0.1.0"

# The UART drivers' shared core: the receive and transmit rings, the gap marks
# and held requests, and the serve decisions, over a `UartDevice` trait that is
# the driver's whole view of the hardware. A process implements the trait over
# its mapped window and answers the messages the core hands back; the tests
# implement it over a fake UART (`uartcore.fake`) that behaves as the hardware
# does and misbehaves one way at a time.
#
# It is a library: no `emit`, no linker script, no `runtime`, and no
# dependency but the wire's own package, so `blade test` runs its tests on the
# host.
[dependencies]
uartproto = { path = "../uartproto" }
