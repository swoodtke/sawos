[package]
name = "uartpipe"
version = "0.1.0"

# `uartproto` over a pipe: the transport a process's `Uart` client sends its
# requests through. It is the one piece of a UART client that names the
# kernel's pipe, so it is its own package: `uartproto` stays free of `sos` and
# tested on the host, and every client shares one copy of the adapter.
#
# It is a library: no `emit`, no linker script, no `runtime`. Each package that
# depends on it carries its own seams.
[dependencies]
sos = { path = "../../kernel/sysapi" }
uartproto = { path = "../uartproto" }
