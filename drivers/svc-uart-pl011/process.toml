# What this driver needs from a stock root: tools/sosimage/src/declaration.saw
# states the format. The tags are the ones `tests/uart-service` gives under.
format = 1
arena = 0x1000
ram = "fast"                # it services the UART's interrupt

# `debug` for its own lines, which it writes through the kernel's debug print
# even when it serves an image's console, and `process-self` for its Process
# handle. It names them because an image that names a console gives a record
# naming none no `debug`.
[[boot]]
name = "system"
kind = "system"
tag = 21
rights = ["debug", "process-self"]

[[boot]]
name = "uart"
kind = "window"
type = "pl011"
tag = 22

[[boot]]
name = "uart"
kind = "serve"
protocol = "uartproto"
tag = 23

[[boot]]
name = "uart"
kind = "line"
type = "pl011"
tag = 24
