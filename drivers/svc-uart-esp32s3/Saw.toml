[package]
name = "svc-uart-esp32s3"
version = "0.1.0"

# This image carries its own `__saw_rt_*` seams, from the `sosrt` module its
# `sos` dependency pulls in; see root/Saw.toml.
runtime = true

# The ESP32-S3's UART0 as a service, interrupt-driven both ways: it serves
# `uartproto` from UART0's window and line, with `uartcore`'s rings, holds and
# marks over `esp32s3io`'s registers, and claims the console while it serves.
# Its build input `uartconfig` sizes the rings and sets the thresholds
# (`config/default.saw` names every key).
[dependencies]
sos = { path = "../../kernel/sysapi" }
uartproto = { path = "../uartproto" }
uartcore = { path = "../uartcore" }
esp32s3io = { path = "../esp32s3io" }
sosmain = { path = "../../rt/main" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.xtensa-esp-unknown-elf]
linker-script = "../../hal/xtensa-esp32s3/user/user.ld"
native = "../../hal/xtensa-esp32s3/user/syscall.c ../../rt/common_c/support.c"
