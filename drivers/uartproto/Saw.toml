[package]
name = "uartproto"
version = "0.1.0"

# The UART drivers' wire, as a package: one declaration the drivers and their
# clients compile against. A device's protocol is not the kernel's business,
# so it lives in userspace, in `drivers/`, and not in the kernel's published
# surface.
#
# It is a library: no `emit`, no linker script, no `runtime`, and no
# dependency, so `blade test` runs its tests on the host.
