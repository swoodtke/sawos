[package]
name = "sockproto"
version = "0.1.0"

# The sockets protocol, as a package: one declaration the network stack and
# every application that uses it compile against. Its bulk data crosses in a
# `pktring`.
#
# It is a library: no `emit`, no linker script, no `runtime`, and no
# dependency on `sos`, so `blade test` runs its tests on the host.
[dependencies]
pktring = { path = "../pktring" }
