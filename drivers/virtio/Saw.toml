[package]
name = "virtio"
version = "0.1.0"

# The virtio-mmio transport (version 2) and split virtqueues, as the network
# driver uses them: the probe, feature negotiation, queue layout and ring
# arithmetic, every check of a value the device writes, the failure classes
# and the order of the driver's memory lifecycle. It reaches the device and
# the queue memory only through the `Registers` and `Dma` traits, which the
# process implements over its mapped window and its pinned memory and the
# tests implement over a fake device (`virtio.fake`).
#
# It is a library: no `emit`, no linker script, no `runtime`, and no
# dependency, so `blade test` runs its tests on the host.
