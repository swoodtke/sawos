# What this driver needs from a stock root: tools/sosimage/src/declaration.saw
# states the format.
format = 1
arena = 0x1000
ram = "fast"                # it services the switch's interrupt

[[boot]]
name = "system"
kind = "system"
tag = 1

[[boot]]
name = "gpio"
kind = "window"
type = "esp32s3-gpio"
tag = 2

[[boot]]
name = "iomux"
kind = "window"
type = "esp32s3-io-mux"
tag = 3

[[boot]]
name = "gpio"
kind = "line"
type = "esp32s3-gpio"
tag = 4

[[boot]]
name = "gpio"
kind = "serve"
protocol = "gpioproto"
tag = 5

# Its handles: the records (five, the outlet leaving at the attach), its
# Process, its main thread's own Thread handle, two Mappings and its Waiter
# make nine. A delivery needs room for the obligation it mints and for every
# handle the request carries before it mints any, so the most it holds is those
# nine, the `MAX_HELD` requests it holds, the request being served, and the
# `PIPE_MSG_HANDLES` that request carries: eighteen. A row short of that lets a
# client's request end the driver.
[quota]
mappings = 2
handles = 18
waiters = 1

[build]
inputs = ["gpioconfig"]
