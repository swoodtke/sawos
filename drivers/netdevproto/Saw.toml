[package]
name = "netdevproto"
version = "0.1.0"

# The network device protocol, as a package: one declaration a network stack
# and every network device driver compile against. Its frames cross in a
# `pktring`.
#
# It is a library: no `emit`, no linker script, no `runtime`, and no
# dependency on `sos`, so `blade test` runs its tests on the host.
[dependencies]
pktring = { path = "../pktring" }
